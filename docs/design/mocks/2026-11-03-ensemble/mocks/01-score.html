<!doctype html>
<!--
方案 01-score：总谱（乐团总谱）。时间是横轴，一条工作线一行；人是最上面的双线谱。
回答简报：
  P1 默认缩编：没展开的工作线合成一行三线谱；展开后同一父节点下最多露 5 位（急的优先），其余进「另 n 位」。
  P2/P3 等你的事只有一个队列（谱架）；谱上「现在」右侧是固定宽的「未决区」，每件等你按剩余时间占一个槽，
     延长记号和升到「你」的虚线都从槽里出发，不再按提出时刻挤成一团。
  P4 派出后还没回报的边画成连音线（tie），从派出那一刻延到现在，再弯进被等的那一行；选中节点时整条等待链亮出来。
  P5 派出 = 向下箭头，回报 = 回流弧线，等你 = 延长音，出错 = 红叉，刹车 = 双竖线；你上次离开之前的记号淡到 30%。
  P6 选中任意深度，从你到它的整条祖先链加粗并带嵌套括号。详情从右侧滑出盖住谱架，Esc 回到谱架。
  P8 实线 = 登记，虚线 ≈ = 推测（含「你处理后、守护进程还没登记」），点线加问号 = 未知。
     没有派活记录的父子关系画「挂靠」细线（只知道属于谁）；Orchestra 开在别人名下的会话画「旁挂」虚线。
  P12 顶部一行「自你上次操作以来」，每个数字点开是列表，谱上只亮这几个记号。
  贫瘠态：按简报 7.4 合成（24 主会话、111 子会话 109 未知、718 被裁、DSH 92 个未读入），顶栏开关切换。
主动放弃：乐手间消息默认不画（开关 + 选中时才连线）；390 宽降级为「分谱」，只剩名字、现在的状态和在等谁。
最大风险：贫瘠态几乎没有边，谱退化成一排点线；合作感只能靠「挂靠」和顶部「对得上 2/111」诚实地承认缺失。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>总谱</title>
<style>
:root{
  --paper:#EEF0F3; --sheet:#FAFBFC; --ink:#1C2431; --ink2:#465062; --mute:#768092;
  --staff:#9DA5B2; --faint:#DCE0E6; --hover:#F1F3F6; --sel:#E6EAF1;
  --blue:#1E4BD2; --blue-wash:#E1E8FB; --red:#C02A2A; --red-wash:#F7E2E0;
  --amber:#B0761A; --teal:#1B8780; --violet:#6A4CC0;
  --sans:"Microsoft YaHei UI","PingFang SC","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --serif:"Source Han Serif SC","Noto Serif SC","Noto Serif CJK SC","Songti SC","STSong","SimSun",serif;
  --num:Cambria,Georgia,"Times New Roman",serif;
  --mono:"Cascadia Mono",Consolas,monospace;
  --namew:212px; --noww:200px; --standw:376px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#151920; --sheet:#1B2028; --ink:#DDE2EA; --ink2:#AFB7C5; --mute:#808A9B;
    --staff:#5C6576; --faint:#2B313C; --hover:#212732; --sel:#262D3A;
    --blue:#89A6FF; --blue-wash:#1F2A48; --red:#FF7B73; --red-wash:#3B2125;
    --amber:#E1AA4C; --teal:#4CC2B8; --violet:#A993F2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151920; --sheet:#1B2028; --ink:#DDE2EA; --ink2:#AFB7C5; --mute:#808A9B;
  --staff:#5C6576; --faint:#2B313C; --hover:#212732; --sel:#262D3A;
  --blue:#89A6FF; --blue-wash:#1F2A48; --red:#FF7B73; --red-wash:#3B2125;
  --amber:#E1AA4C; --teal:#4CC2B8; --violet:#A993F2; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
code,.mono{font-family:var(--mono);font-size:12.5px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}

/* 顶栏 */
.top{display:flex;align-items:center;gap:10px 20px;padding:22px 20px 10px;border-bottom:1px solid var(--faint);position:relative;flex-wrap:wrap}
.top h1{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:.12em;margin:0;line-height:1}
.top .span{font-family:var(--num);font-style:italic;color:var(--mute);font-size:15px}
.titlebox{display:flex;align-items:baseline;gap:12px}
.seg{display:inline-flex;border:1px solid var(--faint);border-radius:6px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:5px 12px;font-size:13px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}
.tog input{accent-color:var(--ink)}
.grow{flex:1}
.dispatch{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:7px 16px;font-weight:600;font-size:14px;display:inline-flex;gap:10px;align-items:center}
:root[data-theme="dark"] .dispatch{color:#0D1426}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dispatch{color:#0D1426}}
.dispatch kbd{font-family:var(--mono);font-size:11px;border:1px solid currentColor;border-radius:3px;padding:0 4px;opacity:.75}
.ghost{background:none;border:1px solid var(--faint);border-radius:6px;padding:5px 10px;font-size:13px;color:var(--ink2)}
.ghost:hover{border-color:var(--staff)}
.scheme{position:absolute;top:4px;right:14px;font-size:11px;color:var(--mute);display:flex;gap:10px}
.scheme a,.scheme button{color:var(--mute);background:none;border:0;padding:0;font-size:11px;text-decoration:underline;text-underline-offset:2px}
.clock{font-family:var(--num);font-size:14px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.clock button{background:none;border:0;color:var(--mute);font-size:12px;text-decoration:underline;padding:0}

/* 自你上次操作以来 */
.since{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:7px 20px;border-bottom:1px solid var(--faint);font-size:13px;color:var(--ink2);background:var(--sheet)}
.since .lead{color:var(--mute)}
.chip{background:none;border:0;padding:2px 0;color:var(--ink);border-bottom:1px dashed var(--staff);font-size:13px}
.chip b{font-family:var(--num);font-size:15px;margin-right:3px}
.chip.on{color:var(--blue);border-bottom:2px solid var(--blue)}
.chip.err{color:var(--red)}
.chip.wait{color:var(--blue)}
.chip.guess{color:var(--blue);border-bottom-style:dotted}
.since .sep{width:1px;height:16px;background:var(--faint)}
.since .gap{color:var(--ink2);padding:1px 8px;border:1px dotted var(--staff);border-radius:4px}

/* 主体 */
.desk{display:grid;grid-template-columns:minmax(0,1fr) var(--standw);min-height:0}
.score{overflow:auto;background:var(--sheet);position:relative}
.ruler{display:grid;grid-template-columns:var(--namew) minmax(0,1fr) var(--noww);position:sticky;top:0;z-index:3;background:var(--sheet);border-bottom:1px solid var(--faint);height:46px}
.ruler .rc-name,.ruler .rc-now{font-size:12px;color:var(--mute);display:flex;align-items:flex-end;padding:0 0 6px 14px}
.ruler .rc-now{padding-left:10px}
.ruler svg{display:block;width:100%;height:46px;overflow:hidden}
.rows{position:relative}
#staff{position:absolute;left:var(--namew);top:0;pointer-events:none;overflow:visible;z-index:2}
#staff.reflow{animation:reflow .45s ease-out}
@keyframes reflow{from{opacity:.35}to{opacity:1}}
.row{display:grid;grid-template-columns:var(--namew) minmax(0,1fr) var(--noww);cursor:pointer;position:relative}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.row .nm{position:relative;display:flex;flex-direction:column;justify-content:center;min-width:0;overflow:hidden;padding:0 8px 0 calc(14px + var(--d,0) * 7px)}
.row .nm .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;line-height:1.3}
.row .nm .s{display:block;font-size:11.5px;line-height:1.3;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm .s span+span{margin-left:8px}
.row .nm .s .side-tag{color:var(--blue)}
.row.chain .nm .t{font-weight:700}
.row .nowc{display:flex;flex-direction:column;justify-content:center;min-width:0;overflow:hidden;padding:0 10px;font-size:12.5px;line-height:1.3}
.row .nowc .l1,.row .nowc .l2{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nowc .l2{font-size:11.5px;color:var(--mute)}
.row .nowc .l2.w-you{color:var(--blue)}
.row .nowc .l2.w-error{color:var(--red)}
.row .nowc .l2.w-agent{color:var(--ink2)}
.row.tail .nowc .l1{text-decoration:underline;text-decoration-color:var(--blue);text-underline-offset:3px}
.row .tm{min-width:0}
.br{position:absolute;top:0;bottom:0;width:1.5px;background:var(--staff)}
.br.own{top:9px}
.br.own::before{content:"";position:absolute;top:0;left:0;width:6px;height:1.5px;background:inherit}
.br.p-amber{background:var(--amber)} .br.p-teal{background:var(--teal)} .br.p-violet{background:var(--violet)}
.caret{display:inline-block;width:12px;color:var(--mute);font-size:10px}
.row.you{border-bottom:1px solid var(--faint)}
.row.you .nm{flex-direction:row;align-items:center;gap:12px;justify-content:flex-start}
.row.you .nm .t{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.1em;overflow:visible}
.row.you .addbtn{background:none;border:1px dashed var(--blue);color:var(--blue);border-radius:4px;font-size:12px;padding:0 8px;white-space:nowrap}
.row.you .nowc .l1{color:var(--blue);font-weight:700}
.row.you .nowc.flash{animation:yflash 1.4s ease-out}
@keyframes yflash{0%,40%{background:var(--blue-wash)}100%{background:transparent}}
.row.proj{cursor:default;background:none}
.row.proj .nm{padding-left:14px;flex-direction:row;align-items:baseline;gap:10px;justify-content:flex-start;padding-top:8px}
.row.proj .nm .t{font-family:var(--serif);font-weight:700;font-size:14px;overflow:visible}
.row.proj .nm .s{font-family:var(--mono);font-size:11px}
.row.sys .nm .t,.row.voice .nm .t,.row.vhead .nm .t{font-family:var(--serif);font-weight:600}
.row.fold .nm .t,.row.refold .nm .t{color:var(--mute);font-size:12.5px}
.row.refold .nm .t{text-decoration:underline;text-underline-offset:2px}
.row.cap{cursor:default}
.row.cap .nm{grid-column:1 / -1;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;font-size:12.5px;color:var(--ink2)}
.row.cap .nm::before{content:"";width:46px;height:0;border-top:1.6px dotted var(--mute)}
.row.cap:hover{background:none}
.sum-l1 .tot{font-weight:700;margin-right:6px}
.chord{display:inline-flex;width:72px;height:5px;vertical-align:2px;border-radius:1px;overflow:hidden;background:var(--faint)}
.chord i{display:block;height:100%}
.c-waiting{background:var(--blue)} .c-guess{background:var(--blue);opacity:.45} .c-settling{background:var(--ink2);opacity:.45}
.c-error{background:var(--red)} .c-running{background:var(--ink)} .c-unknown{background:repeating-linear-gradient(90deg,var(--mute) 0 2px,transparent 2px 4px)}
.c-idle,.c-reported,.c-braked,.c-ended{background:var(--staff)}
.l2 span+span{margin-left:7px}
.st-waiting{color:var(--blue);font-weight:700}
.st-guess,.st-settling{color:var(--blue)}
.st-settling{color:var(--ink2)}
.st-error{color:var(--red);font-weight:700}
.st-running{color:var(--ink)}
.st-unknown{color:var(--mute)}
.l1 .st-unknown::before,.state .st-unknown::before{content:"?";display:inline-grid;place-items:center;width:13px;height:13px;border:1px dotted currentColor;border-radius:50%;font-size:9px;margin-right:4px;vertical-align:1px}
.st-idle,.st-reported,.st-ended,.st-braked{color:var(--ink2)}
.urgent{background:var(--blue);color:var(--sheet);padding:0 5px;border-radius:3px}

/* svg 标记 */
.sl{stroke:var(--ink);stroke-width:1.3;fill:none}
.sl.you{stroke-width:1}
.sl.cond{stroke:var(--staff);stroke-width:.9}
.sl.hold{stroke:var(--blue);stroke-width:5;stroke-linecap:round}
.sl.guess{stroke:var(--blue);stroke-width:1.6;stroke-dasharray:6 4}
.sl.settle{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:6 4}
.sl.idle{stroke:var(--staff);stroke-width:1}
.sl.unk{stroke:var(--mute);stroke-width:1.6;stroke-dasharray:1.5 4;stroke-linecap:round}
.barl{stroke:var(--faint);stroke-width:1}
.restband{fill:var(--paper);opacity:.7}
.pz{fill:var(--paper);opacity:.55}
.nowline{stroke:var(--ink);stroke-width:1;opacity:.55}
.mk{pointer-events:all;cursor:pointer}
.mk .hitbox{fill:transparent}
.mk.old{opacity:.3}
.mk.old:hover{opacity:1}
.msg{fill:var(--staff)}
.msgarc{stroke:var(--staff);stroke-width:1;fill:none}
.dl{stroke:var(--ink2);stroke-width:1.2;fill:none}
.dl.skip{stroke-dasharray:1 3;opacity:.5}
.dl-h{fill:var(--ink2)}
.mk.mine .dl{stroke:var(--blue)} .mk.mine .dl-h{fill:var(--blue)}
.rp{stroke:var(--ink2);stroke-width:1.1;fill:none}
.rp-h{fill:var(--sheet);stroke:var(--ink2);stroke-width:1.3}
.rp-cut{stroke:var(--ink2);stroke-width:1.3}
.hang{stroke:var(--staff);stroke-width:1;fill:none}
.hang.skip{stroke-dasharray:1 3}
.side{stroke:var(--blue);stroke-width:1.1;stroke-dasharray:4 3;fill:none;opacity:.8}
.tie{stroke:var(--ink2);stroke-width:1.2;stroke-dasharray:5 3;fill:none}
.tie-h{fill:var(--ink2)}
.tie-t{font:10.5px var(--sans);fill:var(--ink2);paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round}
.ferm{fill:none;stroke:var(--blue);stroke-width:1.8}
.ferm-d{fill:var(--blue)}
.pz-lead{stroke:var(--blue);stroke-width:1.2;stroke-dasharray:2 2;fill:none}
.mk.guess .ferm{stroke-dasharray:3 2;stroke-width:1.3}
.pz-t{font:600 9.5px var(--sans);fill:var(--blue);text-anchor:middle}
.pz-t.urg{fill:var(--red)}
.riser{stroke:var(--blue);stroke-width:1.2;stroke-dasharray:2 3;opacity:.45;fill:none}
.riser.on{opacity:1;stroke-width:1.6}
.x{stroke:var(--red);stroke-width:2.2;stroke-linecap:round}
.brk{stroke:var(--blue);stroke-width:1.6}
.brk-fall{stroke:var(--blue);stroke-width:1;stroke-dasharray:1 2;opacity:.7}
.fin1{stroke:var(--ink2);stroke-width:1}
.fin2{stroke:var(--ink2);stroke-width:3}
.breath{fill:var(--mute);font:600 15px var(--num)}
.qm{fill:var(--sheet);stroke:var(--mute);stroke-width:1;stroke-dasharray:1.5 2}
.qm-t{fill:var(--mute);font:600 9px var(--sans);text-anchor:middle}
.apr{fill:var(--sheet);stroke:var(--blue);stroke-width:1.2}
.apr.to{stroke:var(--mute)}
.apr-tick{stroke:var(--blue);stroke-width:2}
.apr-tick.to{stroke:var(--mute)}
.mk:hover .dl,.mk:hover .rp{stroke-width:2.2}
svg.focusing .mk{opacity:.15}
svg.focusing .mk.em{opacity:1}
svg.focusing .mk.em .rp,svg.focusing .mk.em .dl{stroke-width:2.2}
.fresh .dl{stroke-dasharray:400;stroke-dashoffset:400;animation:draw .9s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.fresh .dl{animation:none;stroke-dashoffset:0} #staff.reflow{animation:none}}
.rl-t{font:italic 12px var(--num);fill:var(--mute)}
.rl-z{font:11px var(--sans);fill:var(--mute)}
.rl-now{font:italic 600 12px var(--num);fill:var(--ink)}
.rest-bar{fill:var(--ink2)}
.rest-end{stroke:var(--ink2);stroke-width:1}
.rest-n{font:11px var(--sans);fill:var(--mute);text-anchor:middle}
.reh{fill:var(--sheet);stroke:var(--ink);stroke-width:1}
.reh-t{font:600 10.5px var(--sans);fill:var(--ink)}
.reh-l{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 2}

.foot{padding:12px 20px 18px;font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;border-top:1px solid var(--faint)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{width:30px;height:18px;overflow:visible}

/* 谱架：等你队列；详情从右侧滑出盖住它 */
.stand{position:relative;overflow:hidden;border-left:1px solid var(--faint);background:var(--paper)}
.queue{position:absolute;inset:0;overflow:auto;padding:14px 16px 20px}
.stand h2{font-family:var(--serif);font-size:17px;margin:0;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.stand h2 .n{font-family:var(--num);font-size:20px;color:var(--blue)}
.stand h2 .hint{font:12px var(--sans);color:var(--mute);font-weight:400}
.q{margin-top:10px;padding:10px 12px 11px;background:var(--sheet);border-left:3px solid var(--blue);border-radius:2px 6px 6px 2px}
.q.guess{background:transparent;border:1px dashed var(--staff);border-left:3px dashed var(--blue)}
.q.flash{animation:flash 1.2s ease-out}
@keyframes flash{from{box-shadow:0 0 0 3px var(--blue)}to{box-shadow:0 0 0 0 transparent}}
.q .when{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--blue);font-weight:700}
.q .when .left{font-family:var(--num);font-size:16px}
.q .when .risk{font-weight:400;font-size:12px;color:var(--ink2)}
.q .when .risk.high{color:var(--red);font-weight:700}
.q .ask{margin:5px 0 4px;font-size:13.5px}
.q .ask code{display:block;margin-top:3px;padding:5px 8px;background:var(--paper);border-radius:4px;white-space:pre-wrap;word-break:break-all}
.q .path{font-size:12px;color:var(--ink2);line-height:1.6}
.q .path b{color:var(--ink)}
.q .path .arw{color:var(--mute);margin:0 3px}
.q .why{font-size:12px;color:var(--mute);margin-top:4px}
.q .claim{margin-top:6px;font-size:12.5px;padding:6px 8px;background:var(--red-wash);border-radius:4px;color:var(--ink)}
.q .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;align-items:center}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--sheet);border-radius:5px;padding:4px 12px;font-size:13px}
.btn.line{background:none;color:var(--ink);border-color:var(--staff)}
.btn.warn{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.hold{position:relative;overflow:hidden;user-select:none;touch-action:none}
.btn.hold .fill{position:absolute;inset:0;background:rgba(255,255,255,.35);transform-origin:left;transform:scaleX(0)}
.btn.hold.holding .fill{transition:transform 1s linear;transform:scaleX(1)}
.btn.hold .lb{position:relative}
.link{background:none;border:0;padding:0;color:var(--ink2);text-decoration:underline;text-underline-offset:2px;font-size:12.5px}
.typed{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding:8px;border:1px solid var(--red);border-radius:5px}
.typed label{font-size:12px;color:var(--ink2)}
.typed input{font:13px var(--mono);padding:4px 6px;border:1px solid var(--staff);border-radius:4px;background:var(--sheet);color:var(--ink)}
.ro{font-size:12px;color:var(--ink2);margin-top:7px;padding-left:8px;border-left:2px solid var(--staff)}
.done-list{padding:0;margin:14px 0 0;list-style:none;font-size:12px;color:var(--mute)}
.done-list li{margin:2px 0}

.detail{position:absolute;inset:0;overflow:auto;background:var(--paper);transform:translateX(102%);visibility:hidden;transition:transform .18s ease-out,visibility 0s linear .18s;box-shadow:-10px 0 24px rgba(10,14,22,.08);z-index:4}
.detail.open{transform:none;visibility:visible;transition:transform .18s ease-out}
@media (prefers-reduced-motion:reduce){.detail,.detail.open{transition:none}}

function formalQ(){ return queue.filter(function(q){ return q.kind !== 'inferred'; }); }

function askEventOf(q){ return events.find(function(e){ return ASK[e.type] && !e.resolved && (q.evId ? e.id === q.evId : e.node === q.nodeId); }); }

/* ---------- 在等谁（P4）：派出后没回报的边 ---------- */
function outstanding(aId){
  return events.filter(function(e){
    if (e.type !== 'delegate' || e.from !== aId) return false;
    var b = byId.get(e.to); if (!b) return false;
    if (b.state === 'ended' || b.state === 'braked' || b.state === 'reported') return false;
    return !events.some(function(r){ return r.type === 'report' && r.from === e.to && r.to === aId && T(r.t) >= T(e.t); });
  });
}
function shortAsk(q){ var a = q.ask.replace(/^运行命令：/, '跑 ').replace(/^写文件：/, '写 '); return a.length > 30 ? a.slice(0, 30) + '…' : a; }
function waitInfo(n){
  var k = stateKey(n);
  if (k === 'waiting'){ var q = qOf(n.id); return { kind:'you', text:q ? '等你：' + shortAsk(q) : '等你' }; }
  if (k === 'guess') return { kind:'you', text:'≈ 可能在等你，没收到正式请求' };
  if (k === 'error') return { kind:'error', text:(n.stateDetail && n.stateDetail.error) || '出错，停在这里' };
  if (k === 'unknown') return { kind:'unknown', text:'在等什么：未知' };
  if (k === 'settling') return { kind:'unknown', text:'等守护进程下次登记' };
  if (k === 'ended' || k === 'braked' || k === 'reported') return null;
  var outs = outstanding(n.id);
  if (outs.length){
    outs.sort(function(a, b){ return hotKey(a.to) - hotKey(b.to) || T(b.t) - T(a.t); });
    var e = outs[0];
    return { kind:'agent', on:e.to, ev:e, all:outs, text:'等「' + short(nameOf(e.to)) + '」回报，已 ' + mins(now() - T(e.t)) + ' 分' + (outs.length > 1 ? '（共 ' + outs.length + ' 位没回）' : '') };
  }
  if (k === 'running') return { kind:'none', text:'在跑，不等谁' };
  if (k === 'idle') return { kind:'none', text:(n.stateDetail && n.stateDetail.why) || '在等输入' };
  return null;
}
function waitChain(id){
  var cur = byId.get(id); if (!cur) return [];
  var up = [], c = cur;
  while (c && c.parent && c.parent !== 'you'){
    var p = byId.get(c.parent); if (!p) break;
    if (!outstanding(p.id).some(function(e){ return e.to === c.id; })) break;
    up.unshift(p.id); c = p;
  }
  var down = [], d = cur, seen = new Set([cur.id]);
  for (;;){ var w = waitInfo(d); if (!w || w.kind !== 'agent' || seen.has(w.on)) break; down.push(w.on); seen.add(w.on); d = byId.get(w.on); }
  return up.concat([cur.id], down);
}

/* ---------- 行 ---------- */
var CAP = 5, VCAP = 8;
var rows = [], rowOf = {};
function selNode(){ return (ui.sel && ui.sel.kind === 'node' && byId.get(ui.sel.id)) ? ui.sel.id : null; }
function selChain(){ var s = selNode(); return s ? new Set(chainOf(s)) : new Set(); }
function pickKids(par, chain){
  var ks = kids(par.id);
  if (ui.unfolded.has(par.id) || ks.length <= 1) return { vis:ks, hid:[] };
  var chosen = new Set();
  ks.forEach(function(k){ if (chain.has(k.id)) chosen.add(k.id); });
  var cand = ks.filter(function(k){ return !chosen.has(k.id); }).map(function(k){
    var must = hot(k.id) || selNode() === par.id || par.state === 'error';
    return { k:k, must:must, p:hotKey(k.id) };
  }).sort(function(a, b){ return (b.must - a.must) || a.p - b.p; });
  cand.forEach(function(c){
    if (chosen.size >= CAP) return;
    if (c.must || par.depth === 1) chosen.add(c.k.id);
  });
  var vis = [], hid = [];
  ks.forEach(function(k){ (chosen.has(k.id) ? vis : hid).push(k); });
  return { vis:vis, hid:hid };
}
function addRow(r){ r.i = rows.length; rows.push(r); (r.members || []).forEach(function(m){ if (!(m in rowOf)) rowOf[m] = r.i; }); }
function buildRows(){
  rows = []; rowOf = {};
  addRow({ key:'you', type:'you', id:'you', members:['you'], h:54 });
  var chain = selChain();
  if (ui.view === 'line'){
    var leads = kids('you');
    PROJ.forEach(function(p){
      var ls = leads.filter(function(l){ return l.project === p.id; });
      if (!ls.length) return;
      addRow({ key:'proj:' + p.id, type:'proj', proj:p, members:[], h:30 });
      ls.forEach(function(l){
        var hasKids = kids(l.id).length > 0;
        if (hasKids && !ui.expanded.has(l.id)){ addRow({ key:'sys:' + l.id, type:'sys', id:l.id, members:subtree(l.id), depth:1, h:44 }); return; }
        addRow({ key:'n:' + l.id, type:'node', id:l.id, members:[l.id], depth:1, h:40, lead:true, caret:hasKids });
        (function walk(par){
          var pk = pickKids(par, chain);
          pk.vis.forEach(function(k){ addRow({ key:'n:' + k.id, type:'node', id:k.id, members:[k.id], depth:k.depth, h:38 }); walk(k); });
          if (pk.hid.length){
            var mem = []; pk.hid.forEach(function(h){ mem = mem.concat(subtree(h.id)); });
            addRow({ key:'f:' + par.id, type:'fold', id:par.id, members:mem, depth:par.depth + 1, h:36 });
          } else if (ui.unfolded.has(par.id) && kids(par.id).length > CAP){
            addRow({ key:'rf:' + par.id, type:'refold', id:par.id, members:[], depth:par.depth + 1, h:26 });
          }
        })(l);
      });
    });
  } else {
    S.voices.forEach(function(v){
      var mem = nodes.filter(function(n){ return (n.role || 'unknown') === v.id; });
      if (!mem.length) return;
      mem.sort(function(a, b){ return PROJ.findIndex(function(p){ return p.id === a.project; }) - PROJ.findIndex(function(p){ return p.id === b.project; }) || a.depth - b.depth; });
      if (!ui.voiceOpen.has(v.id)){ addRow({ key:'v:' + v.id, type:'voice', id:v.id, members:mem.map(function(n){ return n.id; }), h:44 }); return; }
      addRow({ key:'vh:' + v.id, type:'vhead', id:v.id, members:[], memberIds:mem.map(function(n){ return n.id; }), h:44 });
      var fid = 'v:' + v.id, vis = mem, hid = [];
      if (!ui.unfolded.has(fid) && mem.length > VCAP){
        var ranked = mem.slice().sort(function(a, b){ return (chain.has(b.id) - chain.has(a.id)) || PRI[stateKey(a)] - PRI[stateKey(b)]; });
        var keep = new Set(ranked.slice(0, VCAP).map(function(n){ return n.id; }));
        vis = mem.filter(function(n){ return keep.has(n.id); }); hid = mem.filter(function(n){ return !keep.has(n.id); });
      }
      vis.forEach(function(n){ addRow({ key:'n:' + n.id, type:'node', id:n.id, members:[n.id], depth:0, h:38, inVoice:true }); });
      if (hid.length) addRow({ key:'f:' + fid, type:'fold', id:fid, voice:true, members:hid.map(function(n){ return n.id; }), depth:1, h:36 });
      else if (ui.unfolded.has(fid) && mem.length > VCAP) addRow({ key:'rf:' + fid, type:'refold', id:fid, voice:true, members:[], depth:1, h:26 });
    });
  }
  if (CAPS){
    addRow({ key:'cap:dsh', type:'cap', members:[], h:32, text:'DeepSeek Harness：' + CAPS.dshUnread + ' 个会话，因上限未读入（不是没有会话）' });
    addRow({ key:'cap:trim', type:'cap', members:[], h:32, text:'另有 ' + CAPS.trimmed + ' 个子会话因快照上限被裁掉，没有画出来' });
  }
  var y = 0; rows.forEach(function(r){ r.top = y; r.y = y + r.h / 2 + (r.type === 'you' ? 4 : 2); y += r.h; });
  return y;
}

/* ---------- 时间轴：左边是过去，「现在」右侧是固定宽的未决区 ---------- */
var segs = [], timeW = 600, PZ = 128;
function scopeSet(){
  var set = null;
  if (ui.view === 'line' && ui.expanded.size){ set = new Set(); ui.expanded.forEach(function(id){ if (byId.get(id)) subtree(id).forEach(function(x){ set.add(x); }); }); }
  if (ui.view === 'voice' && ui.voiceOpen.size){ set = new Set(); nodes.forEach(function(n){ if (ui.voiceOpen.has(n.role || 'unknown')) set.add(n.id); }); }
  return set;
}
function buildTime(w){
  PZ = w < 420 ? 96 : w < 640 ? 112 : 128;
  var tw = Math.max(60, w - PZ);
  var end = now(), n = Math.max(1, Math.ceil((end - W0) / BAR));
  var bars = [];
  for (var i = 0; i < n; i++) bars.push({ t0:W0 + i * BAR, t1:Math.min(W0 + (i + 1) * BAR, end), c:0 });
  var sc = scopeSet();
  events.forEach(function(e){
    if (e.type === 'message') return;
    var k = Math.floor((T(e.t) - W0) / BAR); if (k < 0 || k >= n) return;
    if (!sc || [e.node, e.from, e.to].some(function(x){ return x && sc.has(x); })) bars[k].c++;
  });
  bars[n - 1].c = Math.max(1, bars[n - 1].c);
  segs = [];
  bars.forEach(function(b, i){
    var last = segs[segs.length - 1];
    var lone = b.c === 0 && (i === 0 || bars[i - 1].c > 0) && (i === n - 1 || bars[i + 1].c > 0);
    if (ui.compress && b.c === 0 && !lone){
      if (last && last.rest){ last.t1 = b.t1; last.k++; } else segs.push({ rest:true, t0:b.t0, t1:b.t1, k:1 });
    } else segs.push({ rest:false, t0:b.t0, t1:b.t1, c:b.c, wt:ui.compress ? (b.c ? 1 + 1.25 * Math.sqrt(b.c) : .5) : (b.t1 - b.t0) / BAR });
  });
  var RW = 30, pad = 4;
  var rests = segs.filter(function(s){ return s.rest; }).length;
  var sum = segs.reduce(function(a, s){ return a + (s.rest ? 0 : s.wt); }, 0) || 1;
  var avail = Math.max(40, tw - pad - rests * RW);
  var x = 0;
  segs.forEach(function(s){ s.x0 = x; x += s.rest ? RW : avail * s.wt / sum; s.x1 = x; });
}
function X(t){
  var end = now(); t = Math.max(W0, Math.min(end, t));
  for (var i = 0; i < segs.length; i++){ var s = segs[i]; if (t <= s.t1 || i === segs.length - 1) return s.x0 + (s.t1 > s.t0 ? (t - s.t0) / (s.t1 - s.t0) : 1) * (s.x1 - s.x0); }
  return 0;
}
function slotX(i, n){ var nx = X(now()); var step = Math.min(18, (PZ - 34) / Math.max(1, n - 1)); return nx + 24 + i * step; }

/* ---------- 渲染：总谱 ---------- */

  var ks = ORDER.filter(function(k){ return c[k]; });

    l1:'<span class="sum-l1"><span class="tot">' + ids.length + ' 位</span><span class="chord" aria-hidden="true">' + ks.map(function(k){ return '<i class="c-' + k + '" style="flex:' + c[k] + '"></i>'; }).join('') + '</span></span>',
    l2:ks.map(function(k){ return '<span class="st-' + k + '">' + c[k] + ' ' + SUMLABEL[k] + '</span>'; }).join(''),
    title:ids.length + ' 位：' + ks.map(function(k){ return c[k] + ' ' + SUMLABEL[k]; }).join('，') + '。点开看名单'

function nowLabel(n){

function vline(x, y1, y2, cls, near){

  var a = y1 + dir * 10, b = y2 - dir * 14;
  return '<path class="' + cls + '" d="M' + x + ',' + y1 + 'L' + x + ',' + a + '"/><path class="' + cls + ' skip" d="M' + x + ',' + a + 'L' + x + ',' + b + '"/><path class="' + cls + '" d="M' + x + ',' + b + 'L' + x + ',' + y2 + '"/>';

function staffFor(r){

  if (r.type !== 'node'){
    var st = Math.min.apply(null, r.members.map(function(id){ var n = byId.get(id); return T(n.spawnedAt || n.since); }));
    var x0 = X(st);
    [-4, 0, 4].forEach(function(dy){ o += '<line class="sl cond" x1="' + x0 + '" x2="' + end + '" y1="' + (y + dy) + '" y2="' + (y + dy) + '"/>'; });
    return o;
  }
  var n = byId.get(r.id), segsN = [], s0 = T(n.spawnedAt || n.since), since = T(n.since), tn = now();
  function evT(type){ var e = events.filter(function(e){ return e.type === type && (e.node === n.id || e.from === n.id); }).pop(); return e ? T(e.t) : since; }
  switch (n.state){
    case 'running': segsN.push([s0, tn, 'sl']); break;
    case 'waiting': {
      var q = qOf(n.id), op = q ? T(q.openedAt) : since;
      segsN.push([s0, op, 'sl'], [op, tn, (n.stateDetail && n.stateDetail.kind === 'inferred') ? 'sl guess' : 'sl hold']); break; }

    case 'idle': segsN.push([s0, since, 'sl'], [since, tn, 'sl idle']); break;
    case 'reported': segsN.push([s0, n.report ? T(n.report.at) : since, 'sl']); break;
    case 'error': segsN.push([s0, evT('error'), 'sl']); break;
    case 'unknown': if (!n.spawnedAt) segsN.push([since, tn, 'sl unk']); else segsN.push([s0, since, 'sl'], [since, tn, 'sl unk']); break;
    case 'braked': segsN.push([s0, since, 'sl']); break;

  segsN.forEach(function(sg){ var a = X(sg[0]), b = X(sg[1]); if (b - a < .5 && sg[2] !== 'sl hold') return; o += '<line class="' + sg[2] + '" x1="' + a + '" x2="' + Math.max(a + 1, b) + '" y1="' + y + '" y2="' + y + '"/>'; });
  if (n.state === 'unknown') o += mk('', '<circle class="qm" cx="' + (end - 7) + '" cy="' + y + '" r="6"/><text class="qm-t" x="' + (end - 7) + '" y="' + (y + 3) + '">?</text>', n.id, '状态未知：' + (n.stateDetail ? n.stateDetail.why : ''));

    if (act === 'group'){
      var rg = rows[+a.closest('.row').getAttribute('data-row')];
      var ttl = rg.type === 'sys' ? short(nameOf(rg.id)) + ' 这条工作线' : rg.type === 'fold' ? (rg.voice ? voiceById[rg.id.slice(2)].label + '声部里收起的' : '「' + short(nameOf(rg.id)) + '」名下收起的') : voiceById[rg.id].label + '声部';
      openPanel({ kind:'group', title:ttl, members:rg.members.length ? rg.members : rg.memberIds }); return;
    }
    if (act === 'collapse'){ ev.stopPropagation(); var rr = rows[+a.closest('.row').getAttribute('data-row')]; ui.expanded.delete(rr.id); renderAll(); return; }
    if (act === 'toq'){ toQueue('#q-' + a.getAttribute('data-q')); return; }
    if (act === 'convo'){ openConvo(byId.get(ui.sel.id)); return; }
    if (act === 'dispatchTo'){ openDispatch({ tell:ui.sel.id }); return; }
    if (act === 'close'){ closeSheet(); return; }
    if (act === 'send'){ closeSheet(); toast('消息已发出（演示，没有真的发送）'); return; }
    if (act === 'routeFix'){ ev.preventDefault(); dsp.text = $('#dTask').value; dsp.fixed[+a.getAttribute('data-i')] = true; dsp.route = +a.getAttribute('data-i'); renderDispatch(); return; }
    if (act === 'doDispatch'){
      var text = ($('#dTask').value || '').trim();
      if (!text){ toast('先写一句要做什么'); $('#dTask').focus(); return; }
      var route = routeList()[dsp.route]; if (!route || route.block) return;
      var att = attachOf(route);
      var proj = att === 'you' ? ($('#dProj') ? $('#dProj').value : PROJ[0].id) : null;
      var gate = gateRule();
      if (gate){
        var qid = 'dq-' + (++newSeq), tq = now();
        var nodeId = route.kind === 'tell' ? route.target : (att && att !== 'you' ? att : null);
        var eid = 'ev-dq-' + newSeq;
        events.push({ t:iso(tq), type:'approval', node:nodeId, id:eid, subkind:'dispatch', risk:'medium', ask:'派出：「' + text + '」', deadline:iso(tq + 15 * MIN) });
        queue.push({ id:qid, evId:eid, kind:'approval', subkind:'dispatch', risk:'medium', nodeId:nodeId, ask:'派出：「' + text + '」', why:'命中规则「' + gate.rule + '」', blast:route.label, openedAt:iso(tq), deadline:iso(tq + 15 * MIN), pending:{ route:route, text:text, project:proj, attach:att } });
        ui.queueChangedAt = Date.now();
        closeSheet(); renderAll(); toQueue('#q-' + qid); toast('先进了等你队列：批准后才派出');
        return;
      }
      var id = performDispatch(route, text, proj, att);
      closeSheet(); renderAll(); toast(route.kind === 'tell' ? '已交给「' + short(nameOf(id)) + '」' : '已派出：' + byId.get(id).title);
      scrollRow(id);
      return;
    }
  }
  var dr = t.closest('[data-draft]');
  if (dr){ var dd = DRAFTS.find(function(x){ return x.id === dr.getAttribute('data-draft'); }); dsp.text = dd.text; dsp.draft = dd.id; dsp.fixed = {}; dsp.project = dd.project; dsp.route = 0; dsp.route = firstOpenRoute(); renderDispatch(); return; }
  var qa = t.closest('[data-qa]');
  if (qa){
    var q = queue.find(function(x){ return x.id === qa.closest('[data-q]').getAttribute('data-q'); }); if (!q) return;
    var kind = qa.getAttribute('data-qa');
    if (kind === 'locate'){ revealNode(q.nodeId); return; }
    if (kind === 'cancel'){ delete ui.typedOpen[q.id]; renderQueue(); return; }
    if (Date.now() - ui.queueChangedAt < 750){ toast('列表刚变过，看清楚再点'); return; }
    if (kind === 'reject'){ resolveQ(q, 'rejected'); return; }
    if (kind === 'answer'){ resolveQ(q, 'answered', q.options[+qa.getAttribute('data-opt')]); return; }
    if (kind === 'approve'){
      if (confirmToken(q)){ ui.typedOpen[q.id] = true; renderQueue(); var inp = $('#ty-' + q.id); if (inp) inp.focus(); return; }
      resolveQ(q, q.kind === 'seat' ? 'dispatched' : 'approved'); return;
    }
    return;
  }
  var stp = t.closest('[data-stop]');
  if (stp){
    var n = byId.get(ui.sel.id), k = stp.getAttribute('data-stop');
    if (ui.armed && ui.armed.id === n.id && ui.armed.kind === k && Date.now() - ui.armed.at < 3000){ doStop(n, k); return; }
    ui.armed = { id:n.id, kind:k, at:Date.now() }; renderDetail();
    setTimeout(function(){ if (ui.armed && ui.armed.id === n.id && ui.armed.kind === k && Date.now() - ui.armed.at >= 3000){ ui.armed = null; renderDetail(); } }, 3100);
    return;
  }
  var sc = t.closest('[data-since]');
  if (sc){
    var key = sc.getAttribute('data-since');
    if (ui.hlKey === key){ ui.hl = null; ui.hlKey = null; ui.panel = false; renderAll(); return; }
    var g = sinceGroups().find(function(x){ return x.key === key; });
    ui.hl = new Set(g.list.map(function(e){ return e.id; })); ui.hlKey = key; openPanel({ kind:'since', key:key }); return;
  }
  var go = t.closest('[data-goto]'); if (go){ revealNode(go.getAttribute('data-goto')); return; }
  if (t.closest('[data-sel="you"]')){ openPanel({ kind:'you' }); return; }
  var m = t.closest('.mk'); if (m && m.getAttribute('data-node')){ var mid = m.getAttribute('data-node'); if (byId.get(mid)) revealNode(mid); return; }
  var row = t.closest('.row');
  if (row){
    var r2 = rows[+row.getAttribute('data-row')]; if (!r2) return;
    if (r2.type === 'you') openPanel({ kind:'you' });
    else if (r2.type === 'node') openPanel({ kind:'node', id:r2.id });
    else if (r2.type === 'sys'){ ui.expanded.add(r2.id); openPanel({ kind:'node', id:r2.id }); }
    else if (r2.type === 'fold'){ ui.unfolded.add(r2.id); renderAll(); }
    else if (r2.type === 'refold'){ ui.unfolded.delete(r2.id); renderAll(); }
    else if (r2.type === 'voice'){ ui.voiceOpen.add(r2.id); openPanel({ kind:'voice', id:r2.id }); }
    else if (r2.type === 'vhead'){ ui.voiceOpen.delete(r2.id); openPanel({ kind:'voice', id:r2.id }); }
    return;
  }
  if (t.id === 'sheetwrap') closeSheet();
});
document.addEventListener('input', function(ev){
  var t = ev.target;
  if (t.matches && t.matches('[data-tok]')){ var b = t.closest('.typed').querySelector('[data-hold]'); b.disabled = t.value.trim() !== t.getAttribute('data-tok'); }
  if (t.id === 'dTask' && dsp) dsp.text = t.value;
});
document.addEventListener('change', function(ev){
  var t = ev.target;
  if (t.id === 'dTell'){ dsp.tell = t.value; dsp.text = $('#dTask').value; renderDispatch(); }
  if (t.id === 'dAttach'){ dsp.attach = t.value; dsp.text = $('#dTask').value; renderDispatch(); }
  if (t.id === 'dProj'){ dsp.project = t.value; }
  if (t.name === 'route'){ dsp.route = +t.value; dsp.text = $('#dTask').value; renderDispatch(); }
  if (t.id === 'compress'){ ui.compress = t.checked; renderScore(false); }
  if (t.id === 'msgs'){ ui.msgs = t.checked; renderScore(false); }
});
document.addEventListener('keydown', function(ev){
  var tag = (ev.target.tagName || '').toLowerCase();
  if (ev.key === 'Escape'){ if (!$('#sheetwrap').hidden) closeSheet(); else if (ui.panel) closePanel(); return; }
  if ((ev.key === ' ' || ev.key === 'Enter') && ev.target.matches && ev.target.matches('[data-hold]')){ ev.preventDefault(); if (!ev.repeat) holdStart(ev.target); return; }
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('row')){ ev.target.click(); return; }
  if ((ev.key === 'n' || ev.key === 'N') && $('#sheetwrap').hidden){ ev.preventDefault(); openDispatch(); }
});
document.addEventListener('keyup', function(ev){ if (holdEl && (ev.key === ' ' || ev.key === 'Enter')) holdCancel(); });
$$('[data-view]').forEach(function(b){ b.addEventListener('click', function(){ ui.view = b.getAttribute('data-view'); $$('[data-view]').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); }); renderAll(); }); });
$$('[data-mode]').forEach(function(b){ b.addEventListener('click', function(){ var m = b.getAttribute('data-mode'); if (m === mode) return; load(m); $$('[data-mode]').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); }); renderAll(); toast(m === 'barren' ? '今天的真实形状：大部分东西都不知道' : '设想的数据：M1 之后会有的样子'); }); });
$('#btnDispatch').addEventListener('click', function(){ openDispatch(); });
$('#btnNotes').addEventListener('click', openNotes);
$('#clock').addEventListener('click', function(ev){ if (ev.target.id !== 'btnClock') return; if (clock.paused){ LOAD = Date.now() - clock.frozen; clock.paused = false; } else { clock.frozen = Date.now() - LOAD; clock.paused = true; } renderClock(); });

/* 主题 */
function applyTheme(t){ if (t) document.documentElement.setAttribute('data-theme', t); var dark = t ? t === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); $('#btnTheme').textContent = dark ? '浅色' : '深色'; }
var saved = null; try { saved = localStorage.getItem('score-theme'); } catch (e) {}
applyTheme(saved);
$('#btnTheme').addEventListener('click', function(){
  var cur = document.documentElement.getAttribute('data-theme') || ((window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
  var nx = cur === 'dark' ? 'light' : 'dark'; applyTheme(nx); try { localStorage.setItem('score-theme', nx); } catch (e) {}
});

/* 时钟：倒计时每秒走；到点自动拒；守护进程登记；谱面每 10 秒只重画 svg */
var tickN = 0;
setInterval(function(){
  var changed = false;
  pendingSettle = pendingSettle.filter(function(p){
    if (Date.now() - p.at < 8000) return true;
    var n = byId.get(p.id);
    if (n && n.state === 'settling'){
      if (p.ok){ n.state = 'running'; n.stateDetail = null; }
      else { n.state = 'idle'; n.stateDetail = { kind:'idle', why:'守护进程登记：在等输入（被拒之后没有新动作）' }; }
      n.since = iso(now()); changed = true;
    }
    return false;
  });
  if (changed){ renderSince(); renderScore(false); renderQueue(); renderDetail(); }
  if (clock.paused) return;
  tickN++;
  var expired = queue.filter(function(q){ return q.deadline && T(q.deadline) <= now(); });
  if (expired.length){ expired.forEach(function(q){ resolveQ(q, 'timeout'); }); return; }
  $$('[data-deadline]').forEach(function(el){
    var d = el.getAttribute('data-deadline'); if (!d) return;
    var l = T(d) - now();
    el.textContent = el.textContent.replace(/剩 \d+:\d\d/, '剩 ' + left(l));
    el.classList.toggle('urgent', l < 120000);
  });
  renderClock();
  if (tickN % 10 === 0) renderScore(true);
}, 1000);
var rT; window.addEventListener('resize', function(){ clearTimeout(rT); rT = setTimeout(function(){ renderScore(false); }, 120); });

load('rich');
window.__score = { renderAll:renderAll, ui:function(){ return ui; }, rows:function(){ return rows; }, queue:function(){ return queue; }, segs:function(){ return segs; }, resolveQ:resolveQ, spawnNode:spawnNode, doStop:doStop, byId:function(){ return byId; }, load:function(m){ load(m); renderAll(); }, waitChain:waitChain };
renderAll();
})();
</script>
