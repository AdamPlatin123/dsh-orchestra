/* ---------- 按住确认 ---------- */
let hold = null;
function startHold(btn){
  if (btn.disabled || hold) return;
  const id = btn.dataset.id;
  btn.classList.add('holding');
  hold = {btn, timer:setTimeout(() => {
    btn.classList.remove('holding'); hold = null;
    const a = M.attention.find(x => x.id === id); if (a) resolve(a, 'approved');
  }, 1000)};
}
function cancelHold(){ if (!hold) return; clearTimeout(hold.timer); hold.btn.classList.remove('holding'); hold = null; }
document.addEventListener('pointerdown', e => { const b = e.target.closest && e.target.closest('[data-hold]'); if (b){ e.preventDefault(); startHold(b); } });
document.addEventListener('pointerup', cancelHold);
document.addEventListener('pointercancel', cancelHold);
document.addEventListener('pointerout', e => { if (hold && e.target.closest && e.target.closest('[data-hold]') === hold.btn && !hold.btn.contains(e.relatedTarget)) cancelHold(); });
document.addEventListener('keyup', e => { if ((e.key === ' ' || e.key === 'Enter') && hold) cancelHold(); });

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('button, a'); if (!el) return;
  const d = el.dataset;
  if (d.more){ const s = el.parentElement; s.hidden = true; if (s.nextElementSibling) s.nextElementSibling.hidden = false; return; }
  if (d.hold) return;
  if (d.mode){ st.mode = d.mode; st.current = null; st.order = []; st.lastChange = Date.now(); renderAll(); return; }
  if (d.view){ st.view = d.view; renderAll(); return; }
  if (d.l){ const r = REG[+d.l]; if (r.kind === 'events') openEvents(r.title, r.list); else openNodeList(r.title, r.list); return; }
  if (d.case){ st.current = d.case; st.view = 'board'; closeDrawer(); renderAll(); return; }
  if (d.node){ st.current = 'n:' + d.node; st.view = 'board'; closeDrawer(); renderAll(); return; }
  if (d.back){ st.current = null; renderAll(); return; }
  if (d.tower){ st.towerOpen = !st.towerOpen; renderBoard(); return; }
  if (d.chart){ openChart(d.chart); return; }
  if (d.convo){ openConvo(d.convo); return; }
  if (d.brake){ closeConvo(); openBrake(d.brake); return; }
  if (d.draft){ openDispatch(d.draft); return; }
  if (d.act){
    const a = M.attention.find(x => x.id === d.id); if (!a) return;
    if (d.act === 'yes'){ if (needsHold(a)) return; resolve(a, 'approved'); }
    else if (d.act === 'no') resolve(a, 'rejected');
    else if (d.act === 'answer') resolve(a, 'answered', a.options[+d.opt]);
    else if (d.act === 'ack') resolve(a, 'ack');
    return;
  }
  if (d.stop){
    if (d.stop === 'tree'){
      if (st.brakeArm && st.brakeArm.id === d.id && Date.now() - st.brakeArm.t < 3000){ applyBrake(d.id, 'tree'); return; }
      st.brakeArm = {id:d.id, t:Date.now()}; el.textContent = '再点一次确认刹车'; el.classList.add('armed');
      const an = $('#armnote'); if (an) an.textContent = '3 秒内再点一次才会刹车。';
      setTimeout(() => { if (st.brakeArm && st.brakeArm.id === d.id && el.isConnected){ el.textContent = '刹车（停它整棵进程树）'; el.classList.remove('armed'); st.brakeArm = null; } }, 3000);
      return;
    }
    applyBrake(d.id, d.stop === 'proc' ? 'tree' : d.stop); return;
  }
  if (el.id === 'seenAll'){ M.D.lastSeen = now(); renderAll(); return; }
  if (el.id === 'dispatchBtn'){ openDispatch(); return; }
  if (el.id === 'doDispatch'){ doDispatch(); return; }
  if (el.id === 'dclose'){ closeDrawer(); return; }
  if (el.id === 'notesBtn'){ openNotes(); return; }
  if (el.id === 'themeBtn'){
    const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('triage-theme', r.dataset.theme); } catch(_){}
    return;
  }
  if (el.id === 'play'){ st.paused = !st.paused; st.lastReal = Date.now(); el.textContent = st.paused ? '开始走时' : '暂停'; return; }
  if (el.id === 'speed'){ st.speed = st.speed === 1 ? 10 : st.speed === 10 ? 60 : 1; el.textContent = '×' + st.speed; return; }
  if (el.id === 'reset'){
    cancelHold();
    data = {rich:buildRich(), poor:buildPoor()};
    Object.assign(st, {sim:0, paused:true, current:null, order:[], typed:{}, prevCard:null, fresh:{}, lastChange:0, brakeArm:null});
    $('#play').textContent = '开始走时'; closeDrawer(); closeConvo(); renderAll(); tick();
    toast('剧本已回到 ' + hm(NOW0) + '，你做过的处理都撤销了');
    return;
  }
});
$('#scrim').addEventListener('click', closeDrawer);
document.addEventListener('change', e => { if (e.target.id === 'dto') showPath(); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.typed){
    st.typed[t.dataset.typed] = t.value;
    const a = M.attention.find(x => x.id === t.dataset.typed);
    const btn = document.querySelector('[data-hold][data-id="' + t.dataset.typed + '"]');
    if (a && btn) btn.disabled = t.value.trim() !== confirmWord(a);
  }
  if (t.dataset.brakeTyped){
    const btn = document.querySelector('[data-stop="proc"][data-id="' + t.dataset.brakeTyped + '"]');
    if (btn) btn.disabled = t.value.trim() !== '刹车';
  }
});
$('#rail').addEventListener('mouseenter', () => { st.freeze = true; const f = $('#frozen'); if (f) f.textContent = '鼠标在列表上，排序已冻结'; });
$('#rail').addEventListener('mouseleave', () => { st.freeze = false; const f = $('#frozen'); if (f) f.textContent = ''; });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if ($('#convo').classList.contains('on')) closeConvo(); else closeDrawer(); return; }
  if ((e.key === ' ' || e.key === 'Enter') && e.target.dataset && e.target.dataset.hold){ e.preventDefault(); if (!e.repeat) startHold(e.target); return; }
  if (/input|textarea|select/i.test(e.target.tagName)) return;
  if ($('#drawer').classList.contains('on') || $('#convo').classList.contains('on')) return;
  if (e.key === 'n'){ e.preventDefault(); openDispatch(); }
  if (e.key === 'j' || e.key === 'k'){
    const q = queue(M); if (!q.length) return;
    const i = q.findIndex(x => x.id === st.current);
    const next = i < 0 ? (e.key === 'j' ? 0 : q.length - 1) : (i + (e.key === 'j' ? 1 : q.length - 1)) % q.length;
    st.current = q[next].id; renderAll();
  }
});

/* ---------- 走时：只改数字，不重画（保护正在键入的确认和按住） ---------- */
function tick(){
  const r = Date.now(); if (!st.paused) st.sim += (r - st.lastReal) * st.speed; st.lastReal = r;
  $('#clock').textContent = hms(now());
  let expired = null;
  for (const a of M.attention){
    if (a.deadline && Date.parse(a.deadline) <= now()){
      a.res = {decision:'rejected', by:'timeout', at:now()};
      const b = live(a.nodeId);
      if (b){ b.state = 'unknown'; b.stateDetail = {kind:'unknown', why:'请求在 ' + hm(Date.parse(a.deadline)) + ' 超时自动拒；它接下来做什么，等下一次读到'}; }
      expired = a;
    }
  }
  if (expired){ cancelHold(); st.lastChange = Date.now(); renderAll(); toast('超时，已自动拒：' + nodeOrGhost(M, expired.nodeId).title + ' ' + verbOf(expired)); return; }
  document.querySelectorAll('[data-rem]').forEach(el => { const a = M.attention.find(x => x.id === el.dataset.rem); if (a) el.textContent = mmss(Date.parse(a.deadline) - now()); });
  document.querySelectorAll('[data-wait]').forEach(el => { const a = M.attention.find(x => x.id === el.dataset.wait); if (a) el.textContent = mins(now() - Date.parse(a.openedAt)); });
  document.querySelectorAll('[data-acu]').forEach(el => {
    const a = M.attention.find(x => x.id === el.dataset.acu); if (!a) return;
    const k = 'a-' + acuity(a).k;
    if (!el.classList.contains(k)){ el.className = el.className.replace(/\ba-\w+/, k); const lab = el.querySelector('.acu'); if (lab) lab.textContent = acuity(a).label; }
  });
}

try { const th = localStorage.getItem('triage-theme'); if (th) document.documentElement.dataset.theme = th; } catch(_){}
renderAll();
tick();
setInterval(tick, 1000);
window.__triage = {derive, st, tick, data:() => data, M:() => M};
})();
</script>
