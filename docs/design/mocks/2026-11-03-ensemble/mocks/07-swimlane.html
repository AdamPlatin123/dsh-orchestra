<!doctype html>
<!--
方案 07-swimlane：泳道时间线（时间瀑布）
回答简报：P5 合作画成边上的事件：派活是某一时刻从上一层落到下一层的竖边，回报是升回去的竖边，
  折叠的泳道里也按层画成 ≤5 条细轨的小瀑布，不点开就看得出责任下放了几层、交回了几次；
  「你」单独一行常驻在标尺下，你的派活 ▼、批准 ◆、刹车 ‖ 落在同一根时间轴上（r4 D8 只有人能做）。
  P4 不画消息但画「等」：有派活记录、还没回报的边，在现在线左边画成一根虚线链，链尾是你时接到序号点。
  P1 一个领头一条泳道，高度只随层数（≤5）变；P2/P3 现在线上的序号点和右栏是同一个队列，来路写全；
  P6 选中深层只展开一条祖先链；P8 登记/≈ 推测/未知 = 实条/斜纹/点线；P12 可拖的「上次看」算成摘要。
  时间轴是分段压缩的：最近 15 分钟占近一半宽，更早的压缩，把宽度留给要行动的地方。
主动放弃：消息不画（只给计数和最后一句自述）；不画 agent 之间的横向消息边；不按紧急度重排泳道。
最大风险：分段时间轴要靠刻度说明才读得对；同一分钟的密集派活合成「×n」后看不出各派给了谁，
  要展开泳道才拆得开。窄屏只保留最近 60 分钟，是降级视图。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>泳道时间线</title>
<style>
[hidden]{display:none!important}
:root{
  --bg:#ECEEF0; --paper:#F6F7F8; --lane:#E3E6EA; --ink:#18202B; --ink2:#4A5563; --ink3:#87909B; --rule:#D0D5DB;
  --own:#C3CAD2; --obs:#C3CAD2; --barline:#4A5563; --accent:#2340D8; --accent-soft:#DDE3FF; --accent-wash:rgba(35,64,216,.06);
  --err:#C4321C; --err-soft:#F7DDD6; --seen:rgba(24,32,43,.045);
  --p-shop:#B07F22; --p-paper:#2C8780; --p-dshplug:#6A52B0;
  --shadow:0 1px 0 rgba(24,32,43,.08), 0 8px 24px -12px rgba(24,32,43,.25);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161B22; --paper:#1C222A; --lane:#222933; --ink:#E2E6EB; --ink2:#A8B1BC; --ink3:#6C7783; --rule:#2D353F;
    --own:#39424E; --obs:#39424E; --barline:#8A95A3; --accent:#90A3FF; --accent-soft:#283364; --accent-wash:rgba(144,163,255,.07);
    --err:#FF7B5E; --err-soft:#4A2620; --seen:rgba(226,230,235,.04);
    --p-shop:#D8A64A; --p-paper:#4FB3AB; --p-dshplug:#9C86E6;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161B22; --paper:#1C222A; --lane:#222933; --ink:#E2E6EB; --ink2:#A8B1BC; --ink3:#6C7783; --rule:#2D353F;
  --own:#39424E; --obs:#39424E; --barline:#8A95A3; --accent:#90A3FF; --accent-soft:#283364; --accent-wash:rgba(144,163,255,.07);
  --err:#FF7B5E; --err-soft:#4A2620; --seen:rgba(226,230,235,.04);
  --p-shop:#D8A64A; --p-paper:#4FB3AB; --p-dshplug:#9C86E6;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.5 "Microsoft YaHei UI","PingFang SC","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
code,.mono{font-family:"Cascadia Mono",Consolas,monospace;font-size:12px}
.app{display:flex;flex-direction:column;height:100vh}
.app>.main{flex:1}

/* ── 顶栏 ── */
.top{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--paper)}
.you{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:15px;letter-spacing:.02em}
.you small{font-weight:400;color:var(--ink3);font-size:12px}
.dispatch{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 12px;border:1.5px solid var(--ink);border-radius:4px;font-weight:700;background:var(--ink);color:var(--paper)}
.dispatch kbd{font:600 11px "Cascadia Mono",Consolas,monospace;border:1px solid currentColor;border-radius:3px;padding:0 4px;opacity:.7}
.dispatch:hover{background:transparent;color:var(--ink)}
.tally{display:flex;gap:6px}
.tally button{padding:4px 9px;border-radius:3px;border:1px solid var(--rule);color:var(--ink2)}
.tally button b{font-weight:700;color:var(--ink);margin-left:3px}
.tally .t-wait{border-color:var(--accent);color:var(--accent)} .tally .t-wait b{color:var(--accent)}
.tally .t-err{border-color:var(--err);color:var(--err)} .tally .t-err b{color:var(--err)}
.tally small{font-size:11px;color:var(--ink3);margin-left:4px}
.tally .t-maybe{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg button{padding:4px 10px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.spacer{flex:1}
.top button,.top .you,.mark span{white-space:nowrap}
@media (max-width:1280px){ .top{gap:8px 10px} }
.mark{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;color:var(--ink3);line-height:1.35}
.mark a{color:var(--ink2)}
.mark details{position:relative}
.mark summary{cursor:pointer;list-style:none;color:var(--ink2)}
.mark summary::-webkit-details-marker{display:none}
.about{position:absolute;right:0;top:20px;width:min(420px,86vw);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;box-shadow:var(--shadow);z-index:40;color:var(--ink);font-size:12px;line-height:1.6}
.about table{border-collapse:collapse;width:100%;margin:6px 0}
.about td{border-top:1px solid var(--rule);padding:3px 4px;vertical-align:top}
.about h4{margin:8px 0 2px;font-size:12px}
.iconbtn{width:30px;height:30px;border:1px solid var(--rule);border-radius:4px;display:grid;place-items:center;color:var(--ink2)}

/* ── 「上次看」摘要 ── */
.since{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 16px;border-bottom:1px solid var(--rule);font-size:12px;color:var(--ink2);min-height:34px}
.since .lbl{color:var(--ink);font-weight:600;margin-right:4px}
.since button{padding:1px 8px;border-radius:10px;background:var(--lane);color:var(--ink)}
.since button b{font-weight:700;margin-left:2px}
.since button.err{background:var(--err-soft);color:var(--err)}
.since button.acc{background:var(--accent-soft);color:var(--accent)}
.since .mode{margin-left:auto;color:var(--ink3)}
.sparse-note{padding:6px 16px;font-size:12px;background:var(--lane);color:var(--ink2);border-bottom:1px solid var(--rule)}
.sparse-note b{color:var(--ink)}

/* ── 主体 ── */
.main{display:grid;grid-template-columns:1fr 340px;min-height:0;min-width:0}
.left{display:grid;grid-template-rows:auto auto 1fr auto;min-height:0;min-width:0;border-right:1px solid var(--rule)}
.ruler{position:relative;height:38px;border-bottom:1px solid var(--rule);background:var(--paper);user-select:none}
.ruler svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.youband{position:relative;height:40px;border-bottom:1px solid var(--rule);background:var(--paper)}
.youband svg{position:absolute;left:0;top:0;display:block}
.youband .head{top:0;height:40px}
.scroll{overflow-y:auto;overflow-x:hidden;min-height:0;position:relative}
.tl{position:relative}
.tl svg{position:absolute;left:0;top:0;display:block}
.heads{position:absolute;left:0;top:0}
.head{position:absolute;left:0;padding:5px 8px 0 12px;overflow:hidden;cursor:pointer}
.head:hover{background:var(--seen)}
.head .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.head .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--ink3)}
.head .s .w{color:var(--accent);font-weight:600}
.head .s .e{color:var(--err);font-weight:600}
.head .s .u{color:var(--ink2);border-bottom:1px dotted var(--ink3)}
.head.sel{background:var(--accent-wash);box-shadow:inset 3px 0 0 var(--accent)}
.head.onchain{background:var(--accent-soft)}
.head.onchain.sel{box-shadow:inset 3px 0 0 var(--accent)}
.head.lanehead .t{font-size:13.5px}
.head.proj{cursor:default;padding-top:8px;font-size:12px;font-weight:700;color:var(--ink2);background:none}
.head.proj:hover{background:none}
.head.proj i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.head.youhead .t{font-size:13.5px}
.chips{display:flex;gap:3px 4px;margin-top:3px;flex-wrap:wrap}
.chip{font-size:11px;padding:0 5px;border-radius:3px;background:var(--lane);color:var(--ink2);white-space:nowrap}
.chip b{font-weight:700;color:var(--ink)}
.chip.w{background:var(--accent-soft);color:var(--accent)} .chip.w b{color:var(--accent)}
.chip.e{background:var(--err-soft);color:var(--err)} .chip.e b{color:var(--err)}
.chip.u{background:transparent;border:1px dashed var(--ink3)}
.chip.r{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink2)}
.chip{cursor:pointer}
.tw{cursor:pointer}
.rail{color:var(--ink3);margin-right:4px;font-family:"Cascadia Mono",Consolas,monospace}

/* svg marks */
.g-row{cursor:pointer}
.bar-own{fill:var(--own);stroke:var(--barline);stroke-width:1} .bar-obs{fill:var(--obs)}
.bar-hollow{fill:none;stroke-width:1.2}
.lnk{stroke:var(--ink2);stroke-width:1.1;fill:none}
.lnk-dash{stroke-dasharray:3 3}
.tri{fill:var(--ink2)}
.tri-hollow{fill:var(--paper);stroke:var(--ink2);stroke-width:1}
.pkg{fill:var(--paper);stroke:var(--ink);stroke-width:1.3}
.pkg-cut{fill:var(--paper);stroke:var(--ink);stroke-width:1.3;stroke-dasharray:2 1.5}
.errx{stroke:var(--err);stroke-width:2.2;stroke-linecap:round}
.brk{stroke:var(--ink);stroke-width:2}
.endcap{stroke:var(--ink2);stroke-width:1.5}
.unk{stroke:var(--ink3);stroke-width:1.5;stroke-dasharray:1 4;stroke-linecap:round}
.unkq{fill:var(--ink3);font-size:10px}
.waitline{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
.dot{fill:var(--accent)} .dot-hot{fill:var(--err)} .dot-inf{fill:var(--paper);stroke:var(--accent);stroke-width:1.5;stroke-dasharray:2 2}
.dot-ring{fill:none;stroke:var(--err);stroke-width:1.5}
.dot-hl{stroke:var(--ink);stroke-width:2}
.remtxt{fill:var(--ink3);font-size:10.5px}
.remtxt-soon{fill:var(--accent);font-weight:700}
.remtxt-hot{fill:var(--err);font-weight:700;font-size:12px}
.thread{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:3 2;fill:none}
.thread-inf{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:1 3;fill:none;opacity:.7}
.thread-hl{stroke-width:2.4}
.knot{fill:var(--accent)}
.waitedge{stroke:var(--ink3);stroke-width:1;stroke-dasharray:2 2;fill:none}
.waitlbl{fill:var(--ink2);font-size:10.5px}
.waitlbl tspan.w{fill:var(--accent);font-weight:700}
.trk{stroke:var(--rule);stroke-width:1}
.trk-busy{stroke:var(--ink3);stroke-width:2;stroke-linecap:round}
.trknum{fill:var(--ink3);font-size:9px}
.mdl{stroke:var(--ink2);stroke-width:1.2}
.mtri{fill:var(--ink2)}
.mrep{stroke:var(--ink);stroke-width:1.4}
.mrep-cut{stroke:var(--ink);stroke-width:1.4;stroke-dasharray:2 1.5}
.mrepcap{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.mcount{fill:var(--ink2);font-size:9.5px;font-weight:700}
.segtxt{fill:var(--ink3);font-size:9.5px}
.dotnum{fill:var(--paper);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dotnum-inf{fill:var(--accent)}
.fuselbl{fill:var(--accent);font-size:10.5px}
.fuselbl-hot{fill:var(--err);font-weight:700}
.nowline{stroke:var(--accent);stroke-width:3}
.futwash{fill:var(--accent-wash)}
.seenwash{fill:var(--seen)}
.seenline{stroke:var(--ink3);stroke-width:1;stroke-dasharray:2 3}
.grid{stroke:var(--rule);stroke-width:1}
.rowline{stroke:var(--rule);stroke-width:1}
.lanebg{fill:var(--lane);opacity:.55}
.selbg{fill:var(--accent-wash)}
.preview{fill:none;stroke:var(--err);stroke-width:1.5;stroke-dasharray:3 2}
.dim{opacity:.28}
.newflash{animation:flash 1.6s ease-out 1}
@keyframes flash{0%{opacity:0;transform:translateY(-6px)}30%{opacity:1}100%{transform:none}}
.ytick{fill:var(--ink3);font-size:10.5px}
.ylbl{fill:var(--ink2);font-size:11px}
.nowflag{fill:var(--accent)} .nowtxt{fill:var(--paper);font-size:11px;font-weight:700}
.futtxt{fill:var(--ink3);font-size:10px}
.seenflag{fill:var(--ink2);cursor:ew-resize} .seentxt{fill:var(--paper);font-size:10.5px;pointer-events:none}
.hatch-l{stroke:var(--obs);stroke-width:1.4}
.youmark{fill:var(--ink)}
.capped{fill:none;stroke:var(--ink3);stroke-dasharray:4 3}
.cappedtxt{fill:var(--ink3);font-size:11px}
@media (prefers-reduced-motion:reduce){.newflash{animation:none}}

/* ── 详情抽屉 ── */
.detail{border-top:1px solid var(--rule);background:var(--paper);max-height:38vh;overflow:auto;display:none}
.detail.open{display:block}
.dwrap{padding:12px 16px 16px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px 28px;max-width:1100px}
.dclose{float:right;color:var(--ink3);font-size:12px}
.chain{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;font-size:12px;color:var(--ink2)}
.chain button{padding:1px 4px;border-radius:3px}
.chain button:hover{background:var(--lane)}
.chain .cur{font-weight:700;color:var(--ink)}
.chain .sep{color:var(--ink3)}
.dtitle{grid-column:1/-1;font-size:18px;font-weight:700;line-height:1.3;margin:2px 0 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12px;align-content:start}
.kv dt{color:var(--ink3)} .kv dd{margin:0}
.state-big{font-size:14px;font-weight:700}
.state-big.w{color:var(--accent)} .state-big.e{color:var(--err)}
.conf{display:inline-block;width:22px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.conf.real{background:var(--own)}
.conf.inf{background:repeating-linear-gradient(135deg,var(--obs) 0 2px,transparent 2px 5px);outline:1px solid var(--obs)}
.conf.unk{background:radial-gradient(circle,var(--ink3) 1px,transparent 1.5px) 0 50%/5px 8px repeat-x}
.report{border:1px solid var(--rule);border-radius:4px;padding:8px 10px;background:var(--bg)}
.report h5{margin:0 0 4px;font-size:12px;display:flex;gap:8px;align-items:baseline}
.report h5 span{font-weight:400;color:var(--ink3)}
.trunc{margin-top:6px;font-size:12px;color:var(--err);border-left:2px solid var(--err);padding-left:8px}
.refs{margin:6px 0 0;padding:0;list-style:none;font-size:12px}
.refs li::before{content:"引用  ";color:var(--ink3)}
.quote{margin:8px 0 0;font-size:12px;color:var(--ink2);border-left:2px solid var(--rule);padding-left:8px}
.quote cite{font-style:normal;color:var(--ink3)}
.acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:8px;border-top:1px dashed var(--rule);margin-top:4px}
.btn{padding:5px 12px;border:1px solid var(--ink2);border-radius:4px;font-weight:600}
.btn:hover{background:var(--lane)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.danger.armed{background:var(--err);color:var(--paper)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.note{font-size:12px;color:var(--ink3)}
.ro{font-size:12px;color:var(--ink2);background:var(--lane);padding:4px 10px;border-radius:3px}
.plist{grid-column:1/-1;margin:0;padding:0;list-style:none}
.plist li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:5px 0;border-top:1px solid var(--rule);font-size:12px;cursor:pointer;align-items:baseline}
.plist li:hover{background:var(--seen)}
.plist .tm{color:var(--ink3)}
.plist .st{color:var(--ink3);white-space:nowrap}
.waitlist{margin:0;padding:0;list-style:none}
.waitlist li{padding:1px 0}
.waitlist button{color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px}
.blast{grid-column:1/-1;border:1px solid var(--err);border-radius:4px;padding:8px 10px;background:var(--err-soft)}
.blast ul{margin:4px 0 0;padding-left:18px;font-size:12px}
.typed{display:flex;gap:6px;align-items:center;font-size:12px}
.typed input{width:120px;padding:4px 6px;border:1px solid var(--ink3);border-radius:3px;background:var(--paper);color:var(--ink);font:12px "Cascadia Mono",Consolas,monospace}

/* ── 等你队列（右栏） ── */
.queue{display:flex;flex-direction:column;min-height:0;background:var(--paper)}
.qhead{padding:10px 14px 8px;border-bottom:1px solid var(--rule);display:flex;align-items:baseline;gap:8px}
.qhead h2{margin:0;font-size:15px}
.qhead h2 b{color:var(--accent)}
.qhead .note{margin-left:auto}
.qlist{overflow:auto;flex:1;padding:6px 0 24px}
.q{position:relative;padding:10px 14px 10px 46px;border-bottom:1px solid var(--rule);cursor:pointer}
.q:hover{background:var(--seen)}
.q.open{background:var(--bg);cursor:default}
.q.hl{box-shadow:inset 3px 0 0 var(--accent)}
.qgroup{padding:10px 14px 4px;font-size:12px;color:var(--ink3);border-bottom:1px solid var(--rule)}
.q .rk{position:absolute;left:14px;top:11px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--paper);font-weight:700;font-size:11px;display:grid;place-items:center}
.q.hot .rk{background:var(--err)}
.q.inf .rk{background:transparent;color:var(--accent);border:1.5px dashed var(--accent)}
.q .k{font-size:11px;color:var(--ink3);display:flex;gap:8px}
.q .k .risk{color:var(--err);font-weight:700}
.q .ask{margin:2px 0 4px;font-weight:600;line-height:1.45;word-break:break-word}
.q .ask code{font-weight:400;background:var(--lane);padding:1px 4px;border-radius:3px}
.q .from{font-size:11.5px;color:var(--ink2);line-height:1.5}
.q .from .sep{color:var(--ink3);margin:0 2px}
.q .tl2{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px}
.q .waitfor{font-size:11.5px;color:var(--ink2);margin-top:2px}
.q .fz{flex:1;height:3px;background:var(--rule);border-radius:2px;position:relative;overflow:hidden}
.q .fz i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:2px}
.q.hot .fz i{background:var(--err)}
.q .rem{color:var(--accent);font-weight:700;white-space:nowrap}
.q.hot .rem{color:var(--err)}
.q .more{margin-top:8px;font-size:12px;display:grid;gap:6px}
.q .more .why{color:var(--ink2)}
.q .more .bl{color:var(--err)}
.q .unv{color:var(--err);font-weight:700}
.q .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hold{position:relative;overflow:hidden}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.35)}
.qdone{padding:10px 14px;font-size:12px;color:var(--ink3);border-bottom:1px solid var(--rule)}
.qdone b{color:var(--ink2);font-weight:600}

/* ── 派活面板 ── */
.sheet{position:fixed;inset:0;background:rgba(10,14,20,.35);display:none;z-index:50}
.sheet.open{display:block}
.panel{position:absolute;left:16px;top:56px;width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 80px);overflow:auto;background:var(--paper);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);padding:16px 18px}
.panel h3{margin:0 0 10px;font-size:16px}
.panel textarea{width:100%;min-height:72px;padding:8px 10px;border:1px solid var(--ink3);border-radius:4px;background:var(--bg);color:var(--ink);font:14px/1.5 inherit;font-family:inherit;resize:vertical}
.panel select{padding:5px 6px;border:1px solid var(--ink3);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit;max-width:100%}
.panel .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.drafts{margin:12px 0 0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.drafts li{padding:8px 0;border-bottom:1px solid var(--rule);font-size:12px}
.drafts li button.fill{font-weight:600;text-align:left;font-size:13px}
.drafts .rh{color:var(--ink2);margin-top:3px}
.drafts .rt{color:var(--ink3);margin-top:2px}
.warn{font-size:12px;color:var(--err);margin-top:4px}

/* ── 对话页占位 ── */
.convo{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;grid-template-rows:auto 1fr auto}
.convo.open{display:grid}
.convo header{padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--paper);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.convo .body{overflow:auto;padding:16px;max-width:780px;width:100%;margin:0 auto}
.convo .msg{margin:0 0 12px;padding:8px 12px;border-left:2px solid var(--rule);font-size:13px}
.convo .msg small{display:block;color:var(--ink3);font-size:11px}
.convo footer{padding:10px 16px;border-top:1px solid var(--rule);background:var(--paper);display:flex;gap:8px}
.convo footer input{flex:1;padding:8px 10px;border:1px solid var(--ink3);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:4px;font-size:12.5px;z-index:80;display:none;max-width:90vw}
.toast.on{display:block}

/* ── 窄屏：降级 ── */
@media (max-width:1100px){ .main{grid-template-columns:1fr 300px} }
@media (max-width:760px){
  body{overflow:auto}
  .app{height:auto;display:block}
  .top{flex-wrap:wrap;gap:8px;padding:10px 16px}
  .top .spacer{display:none}
  .mark{order:-1;width:100%;flex-direction:row;justify-content:space-between}
  .main{display:flex;flex-direction:column}
  .queue{order:-1;border-bottom:1px solid var(--rule)}
  .qlist{max-height:46vh}
  .left{display:block;border-right:0}
  .scroll{overflow:visible}
  .dwrap{grid-template-columns:1fr}
  .detail{max-height:none}
  .since{padding:6px 16px}
}

<div class="sheet" id="sheet"><div class="panel" role="dialog" aria-label="派活" id="panel"></div></div>

<div class="toast" id="toast" role="status"></div>

<script src="../scenario.js"></script>
<script>
(function(){
'use strict';
var S = window.SCENARIO;
var T = function(s){ return Date.parse(s); };
var NOW0 = T(S.meta.now), LOAD = Date.now();
function nowT(){ return NOW0 + (Date.now() - LOAD); }
var MIN = 60e3;
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function hm(t){ var d = new Date(t + 8*3600e3); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function mss(ms){ if (ms <= 0) return '0:00'; var s = Math.floor(ms/1000); return Math.floor(s/60) + ':' + pad(s%60); }
function ago(ms){ var m = Math.round(ms/MIN); return m < 60 ? m + ' 分' : Math.floor(m/60) + ' 小时 ' + (m%60) + ' 分'; }

/* ───────── 状态 ───────── */
var st = {
  mode: 'rich',            // rich | sparse
  view: 'leads',           // leads | all
  expanded: {},            // laneId -> true（整条展开）
  focus: null,             // 链式展开的焦点节点
  sel: null,               // 详情里选中的节点
  detailList: null,        // 详情里的一张列表 {title, items}
  lastSeen: NOW0 - 40*MIN, // 「上次看」线（界面默认值，可拖）
  openQ: null,             // 右栏展开的条目
  hlQ: null,
  resolved: {},            // attId -> {decision, by, at}
  over: {},                // nodeId -> {state, stateDetail}
  extraNodes: [],
  extraEvents: [],
  brakePreview: null,
  brakeArmed: 0,
  qChangedAt: 0,
  flash: null,
  seq: 0
};

/* ───────── 模型：丰富态原样；贫瘠态按今天真实数据的形状降级 ───────── */
var M;
function build(){
  var all = S.nodes.concat(st.extraNodes).map(function(n){
    var o = st.over[n.id]; var c = Object.assign({}, n);
    if (o){ c.state = o.state; c.stateDetail = o.stateDetail; if (o.since) c.since = o.since; }
    c.children = []; return c;
  });
  var hiddenDeep = [], dshUnread = [], kept = [];
  all.forEach(function(n){
    if (st.mode === 'sparse'){
      if (n.harness === 'dsh' && !n.extra){ dshUnread.push(n); return; }
      if (n.stateDetail && n.stateDetail.inferred && n.depth <= 2){ kept.push(n); return; }
      // 只有观察来的深层会话会因读盘上限读不到；Orchestra 自有的会话在 registry 里，照常显示
      if (n.depth > 2 && !n.extra && n.ownership !== 'owned'){ hiddenDeep.push(n); return; }
      if (n.depth === 2 && n.ownership !== 'owned' && !n.extra){
        n = Object.assign({}, n, { state:'unknown', report:null, sparseUnknown:true,
          stateDetail:{kind:'unknown', why:'子会话状态没有登记；只知道它属于谁，不知道是哪一次派活派出的'} });
      }
    }
    kept.push(n);
  });
  var byId = {}; kept.forEach(function(n){ byId[n.id] = n; });
  kept.forEach(function(n){ if (byId[n.parent]) byId[n.parent].children.push(n.id); });
  var ev = S.events.concat(st.extraEvents);
  if (st.mode === 'sparse'){
    ev = ev.filter(function(e){
      var id = e.node || e.to || e.from;
      if (e.type === 'delegate') return !!byId[e.to];
      if (e.type === 'report') return !!byId[e.from] && !byId[e.from].sparseUnknown;
      if (e.type === 'message') return e['with'] === 'you' && !!byId[e.node];
      return !!byId[id];
    }).map(function(e){
      if (e.type === 'delegate' && byId[e.to] && byId[e.to].depth === 2 && byId[e.to].ownership !== 'owned' && !byId[e.to].extra)
        return Object.assign({}, e, {unrecorded:true});
      return e;
    });
  }
  var now = nowT();
  var att = S.attention.filter(function(a){
    if (st.resolved[a.id]) return false;
    if (st.mode === 'sparse'){
      if (a.kind === 'seat') return true;           // seat 请求经插件直接送到，不靠读磁盘
      return !!byId[a.nodeId];
    }
    return true;
  }).sort(function(a,b){
    var da = a.deadline ? T(a.deadline) : Infinity, db = b.deadline ? T(b.deadline) : Infinity;
    return da - db || T(a.openedAt) - T(b.openedAt);
  });
  // 能在这里处理（或必须由你去别处处理）的在前，按截止排序编号；≈ 推测的单独成组排在后面，用 ≈ 编号
  var sure = att.filter(function(a){ return a.kind !== 'inferred'; });
  var maybe = att.filter(function(a){ return a.kind === 'inferred'; });
  sure.forEach(function(a, i){ a._rank = i + 1; a._label = String(i + 1); });
  maybe.forEach(function(a, i){ a._rank = sure.length + i + 1; a._label = maybe.length > 1 ? '≈' + (i + 1) : '≈'; });
  att = sure.concat(maybe);
  var attByNode = {}; att.forEach(function(a){ (attByNode[a.nodeId] = attByNode[a.nodeId] || []).push(a); });
  var lanes = kept.filter(function(n){ return n.parent === 'you'; });
  // 派活记录：每个子会话的那条 delegate 事件（贫瘠态里对不上的标 unrecorded）
  var delegOf = {}; ev.forEach(function(e){ if (e.type === 'delegate' && !delegOf[e.to]) delegOf[e.to] = e; });
  M = { nodes: kept, byId: byId, ev: ev, att: att, sure: sure, maybe: maybe, attByNode: attByNode, lanes: lanes,
        hiddenDeep: hiddenDeep, dshUnread: dshUnread, unread: hiddenDeep.concat(dshUnread), delegOf: delegOf, now: now };
  // 等待链：从领头一路到等你的那个节点，链上每个祖先的「派出未回」都通向它
  M.onChain = {};   // nodeId -> [att...]
  att.forEach(function(a){ chainOf(a.nodeId).forEach(function(id){ (M.onChain[id] = M.onChain[id] || []).push(a); }); });
}
/* 「等」只用有记录的边：有派活记录、还没回报（没有已回报 / 已结束 / 被刹车）的子会话 */
function openKids(id){
  var n = M.byId[id]; if (!n) return [];
  return n.children.filter(function(c){
    var k = M.byId[c], d = M.delegOf[c];
    return d && !d.unrecorded && ['reported','ended','braked'].indexOf(k.state) < 0;
  }).sort(function(a, b){ return T(M.delegOf[a].t) - T(M.delegOf[b].t); });
}
function urgentAttUnder(id){ var l = M.onChain[id] || []; return l.slice().sort(function(a,b){ return a._rank - b._rank; })[0] || null; }
function srcNode(id){ for (var i=0;i<S.nodes.length;i++) if (S.nodes[i].id === id) return S.nodes[i]; return null; }
function nameOf(id){
  if (id === 'you') return '你';
  var n = M.byId[id];
  if (n) return shortTitle(n.title);
  var s = srcNode(id);
  if (s && st.mode === 'sparse') return shortTitle(s.title) + '（未读入）';
  return s ? shortTitle(s.title) : id;
}
function shortTitle(t){ return String(t).replace(/ · 领头$/, ''); }
function chainOf(id){ var out = []; var n = M.byId[id]; while (n){ out.unshift(n.id); n = M.byId[n.parent]; } return out; }
function laneOf(id){ var c = chainOf(id); return c[0]; }
function subtree(id){ var out = []; (function walk(x){ out.push(x); var n = M.byId[x]; if (n) n.children.forEach(walk); })(id); return out; }
function cat(n){
  if (n.state === 'waiting' && n.stateDetail && n.stateDetail.kind === 'inferred') return 'maybe';
  return n.state;
}
var CAT = { waiting:'等你', maybe:'≈ 可能在等你', error:'出错', running:'在跑', unknown:'状态未知',
  reported:'已回报', idle:'空闲', ended:'已结束', braked:'被刹车' };
function own(n){ return n.ownership === 'owned' ? '自有' : n.ownership === 'observed' ? '只读' : '归属不明（只读）'; }
function hz(n){ return S.harnesses[n.harness] ? S.harnesses[n.harness].label : '未知'; }
function confOf(n){
  if (n.state === 'unknown') return 'unk';
  if (n.stateDetail && n.stateDetail.inferred) return 'inf';
  return 'real';
}

/* 在等谁、要什么（P4） */
function waitText(n){
  var sd = n.stateDetail || {};
  var a = (M.attByNode[n.id] || [])[0];
  switch (n.state){
    case 'waiting':
      if (sd.kind === 'inferred') return '≈ 可能在等你（推测，没有正式请求）';
      if (a && a.kind === 'question') return '等你回答（已等 ' + ago(M.now - T(a.openedAt)) + '）';
      if (a && a.kind === 'seat') return '等你决定派不派（剩 ' + mss(T(a.deadline) - M.now) + ' 自动拒）';
      if (a) return '等你批准（剩 ' + mss(T(a.deadline) - M.now) + ' 自动拒）';
      return '等你';
    case 'running': return '在跑' + pendingText(n);
    case 'idle': return '空闲：' + (sd.why || '在等输入') + pendingText(n);
    case 'error':
      var live = n.children.filter(function(c){ return M.byId[c].state === 'running'; });
      return '出错：' + (sd.error || '') + (live.length ? '　它派出的 ' + live.length + ' 个子会话仍在跑' : '');
    case 'unknown': return '状态未知：' + (sd.why || '');
    case 'reported': return '已回报给 ' + nameOf(n.report ? n.report.to : n.parent) + '（对方读没读，未知）';
    case 'braked': return '被刹车：' + (sd.why || '');
    case 'ended': return '已结束：' + (sd.why || '');
  }
  return '状态未知';
}
/* 派出未回：只陈述记录，不推断它是不是卡住了 */
function pendingText(n){
  var ok = openKids(n.id); if (!ok.length) return '';
  var a = urgentAttUnder(n.id);
  var first = ok[0];
  if (a && a.nodeId !== n.id){
    var c = chainOf(a.nodeId); var via = c[c.indexOf(n.id) + 1];
    return '；待「' + nameOf(via) + '」回报（派出 ' + ago(M.now - T(M.delegOf[via].t)) + '），这条链的尾巴' + (a.kind === 'inferred' ? ' ≈ 可能在等你' : '在等你 ' + a._label);
  }
  return '；派出的 ' + ok.length + ' 个还没回报，最早的是「' + nameOf(first) + '」（' + ago(M.now - T(M.delegOf[first].t)) + '）';
}

/* ───────── 几何 ───────── */
var G;
/* 分段压缩的时间轴：最近 15 分钟占近一半宽，更早的逐段压缩；现在线右边只留一窄条写剩余时间 */
function geom(){
  var W = $('scroll').clientWidth || 800;
  var narrow = W < 640;
  var headW = narrow ? 118 : (W < 900 ? 176 : 232);
  var futW = narrow ? 50 : 66;
  var pastW = W - headW - futW - 6;
  var now = M.now;
  var t0 = narrow ? now - 60*MIN : T(S.meta.windowStart);
  var segs = narrow
    ? [ {a: t0, b: now - 15*MIN, f: .45, step: 15*MIN, lbl: '一刻钟一格'}, {a: now - 15*MIN, b: now, f: .55, step: 5*MIN, lbl: '5 分一格'} ]
    : [ {a: t0, b: now - 60*MIN, f: .22, step: 30*MIN, lbl: '半小时一格'},
        {a: now - 60*MIN, b: now - 15*MIN, f: .30, step: 15*MIN, lbl: '一刻钟一格'},
        {a: now - 15*MIN, b: now, f: .48, step: 5*MIN, lbl: '5 分一格'} ];
  var acc = 0; segs.forEach(function(s){ s.x0 = headW + acc*pastW; acc += s.f; s.x1 = headW + acc*pastW; });
  G = { W:W, narrow:narrow, headW:headW, futW:futW, pastW:pastW, t0:t0, now:now, segs:segs, xNow: headW + pastW };
  G.x = function(t){
    if (t <= t0) return headW; if (t >= now) return G.xNow;
    for (var i = 0; i < segs.length; i++){ var s = segs[i]; if (t <= s.b) return s.x0 + (t - s.a)/(s.b - s.a)*(s.x1 - s.x0); }
    return G.xNow;
  };
  if (st.lastSeen < t0 + MIN) st.lastSeen = t0 + MIN;
  G.inv = function(x){
    if (x <= headW) return t0; if (x >= G.xNow) return now;
    for (var i = 0; i < segs.length; i++){ var s = segs[i]; if (x <= s.x1) return s.a + (x - s.x0)/(s.x1 - s.x0)*(s.b - s.a); }
    return now;
  };
}

/* ───────── 行 ───────── */
function rows(){
  var out = [];
  var byProj = {};
  M.lanes.forEach(function(l){ (byProj[l.project] = byProj[l.project] || []).push(l); });
  var projIds = S.projects.map(function(p){ return p.id; });
  Object.keys(byProj).forEach(function(p){ if (projIds.indexOf(p) < 0) projIds.push(p); });
  projIds.forEach(function(pid){
    var ls = byProj[pid] || [];
    var dshCap = st.mode === 'sparse' ? M.dshUnread.filter(function(n){ return n.project === pid; }) : [];
    if (!ls.length && !dshCap.length) return;
    out.push({type:'proj', h:26, project:pid});
    ls.forEach(function(l){
      var full = st.view === 'all' || st.expanded[l.id];
      var focusHere = st.focus && M.byId[st.focus] && laneOf(st.focus) === l.id;
      if (full) dfs(l.id, out);
      else if (focusHere) chainRows(l.id, out);
      else {
        // 高度只随层数变（≤5 条细轨），子会话再多也不加行
        var ids = subtree(l.id), maxD = 1;
        ids.forEach(function(id){ maxD = Math.max(maxD, M.byId[id].depth); });
        var nChips = Object.keys(chipGroups(breakdown(ids))).length + (laneUnread(l.id).length ? 1 : 0);
        var perRow = G.headW > 200 ? 4 : 3;
        var headH = 46 + 19*Math.ceil(nChips/perRow);
        out.push({type:'lane', id:l.id, maxD:maxD, h: Math.max(headH, LANE.top + (maxD - 1)*LANE.gap + 14)});
      }
    });
    if (dshCap.length) out.push({type:'capped', h:44, project:pid, list:dshCap});
  });
  var y = 0; out.forEach(function(r){ r.y = y; y += r.h; });
  return out;
}
function nodeRowH(id){ var k = (M.attByNode[id] || []).length; return Math.max(38, 24 + 14*k); }
function dfs(id, out){
  out.push({type:'node', id:id, h:nodeRowH(id)});
  M.byId[id].children.forEach(function(c){ dfs(c, out); });
}
function chainRows(laneId, out){
  var path = chainOf(st.focus);
  path.forEach(function(id, i){
    out.push({type:'node', id:id, h:nodeRowH(id), onPath:true});
    var next = path[i+1];
    var n = M.byId[id];
    var others = n.children.filter(function(c){ return c !== next; });
    if (next){
      if (others.length) out.push({type:'fold', parent:id, ids:others, h:28, depth:n.depth+1, sib:true});
    } else if (n.children.length){
      out.push({type:'fold', parent:id, ids:n.children.slice(), h:28, depth:n.depth+1});
    }
  });
}
function breakdown(ids){
  var c = {}; ids.forEach(function(id){ var k = cat(M.byId[id]); (c[k] = c[k] || []).push(id); });
  return c;
}
/* 分项：已回报单列并排在在跑前面；空闲、已结束、被刹车合成「停着」 */
var GROUPS = [
  ['waiting', '等你', ['waiting'], 'w'], ['maybe', '≈ 等你', ['maybe'], 'w'], ['error', '出错', ['error'], 'e'],
  ['reported', '已回报', ['reported'], 'r'], ['running', '在跑', ['running'], ''], ['unknown', '未知', ['unknown'], 'u'],
  ['stopped', '停着', ['idle','ended','braked'], '']
];
function chipGroups(b){
  var out = {};
  GROUPS.forEach(function(g){ var ids = []; g[2].forEach(function(k){ if (b[k]) ids = ids.concat(b[k]); }); if (ids.length) out[g[0]] = ids; });

  // 「等」：展开时，从父条拉一根细虚线到每个派出未回的子条；通向等你的那几根用蓝色，链尾接到现在线上的序号点
  R.forEach(function(r){

/* 一根工作条：实线=登记，斜纹=≈ 推测，点线=状态未知，空心=空闲在等输入；自有的加描边 */

    return '<li><button class="fill" data-draft="' + d.id + '">' + esc(d.text) + '</button>'
      + '<div class="rh">' + d.rulesHit.map(function(r){ return esc(r.rule) + '：' + esc(r.effect); }).join('<br>') + '</div>'
      + '<div class="rt">路由建议：' + d.routes.map(function(r){ return esc(r.to) + (r.model ? '，' + esc(S.models[r.model] || r.model) : '') + '（把握 ' + Math.round(r.confidence*100) + '%）'; }).join('；') + '</div>'
      + (warn ? '<div class="warn">' + esc(warn) + '</div>' : '') + '</li>';
  }).join('');
  $('panel').innerHTML = '<h3>派活</h3>'
    + '<textarea id="dText" placeholder="一句话说清要做什么，例如：把购物车单测的 3 个失败修掉"></textarea>'
    + '<div class="row"><label>交给 <select id="dTo">' + opts + '</select></label><span class="note">默认交给领头；派出后新的一条立刻长在泳道上</span></div>'
    + '<div class="row"><button class="btn pri" id="dGo">派出</button><button class="btn" id="dCancel">取消（Esc）</button></div>'
    + '<div class="note">Orchestra 给的建议（' + S.dispatch.drafts.length + ' 条），点一条填进去：</div><ul class="drafts">' + drafts + '</ul>';
  $('sheet').classList.add('open');
  setTimeout(function(){ $('dText').focus(); }, 10);
  $('dCancel').onclick = closeDispatch;
  $('panel').querySelectorAll('[data-draft]').forEach(function(b){ b.onclick = function(){
    var d = S.dispatch.drafts.filter(function(x){ return x.id === b.getAttribute('data-draft'); })[0];
    $('dText').value = d.text;
    var sp = d.suggestedParent && M.byId[d.suggestedParent];
    $('dTo').value = sp && sp.ownership === 'owned' ? sp.id : (d.routes[0] && d.routes[0].harness === 'codex' ? 'new:codex' : 'new:claude');
  }; });
  $('dGo').onclick = function(){
    var text = $('dText').value.trim(); if (!text){ $('dText').focus(); return; }
    var to = $('dTo').value, now = new Date(nowT()).toISOString();
    var isNew = to.indexOf('new:') === 0, p = isNew ? null : M.byId[to];
    var nn = { id:'new' + (++st.seq), parent: isNew ? 'you' : to, depth: isNew ? 1 : p.depth + 1, project: isNew ? (st.sel && M.byId[st.sel] ? M.byId[st.sel].project : 'shop') : p.project,
      harness: isNew ? to.slice(4) : p.harness, ownership:'owned', role:'code', model: isNew ? (to === 'new:codex' ? 'codex-mid' : 'sonnet') : p.model,
      title: text.length > 16 ? text.slice(0, 16) + '…' : text, task:text, state:'running', spawnedAt:now, since:now, lastActivity:now,
      tokens:0, costUsd:0, messages:0, children:[], stateDetail:null, report:null, extra:true };
    st.extraNodes.push(nn);
    st.extraEvents.push({ t:now, type:'delegate', from:'you', to:nn.id, task:text, via:'orchestra', id:'h' + (++st.seq) });
    st.focus = nn.id; st.sel = nn.id; st.flash = nn.id; st.detailList = null;
    closeDispatch(); rebuild(); locate(nn.id);
    toast('你派出：「' + nn.title + '」' + (isNew ? '，新开一条泳道' : '，挂在「' + nameOf(to) + '」下'));
  };
}
function closeDispatch(){ $('sheet').classList.remove('open'); }

/* ───────── 对话页（占位） ───────── */
function openConvo(id){
  var n = M.byId[id];
  var msgs = M.ev.filter(function(e){ return (e.type === 'message' && e.node === id) || (e.type === 'delegate' && e.to === id) || (e.type === 'report' && (e.from === id || e.to === id)); });
  var c = $('convo');
  c.innerHTML = '<header><button class="btn" id="cBack">回到泳道（Esc）</button><b>' + esc(shortTitle(n.title)) + '</b><span class="note">' + chainOf(id).map(nameOf).map(esc).join(' → ') + '</span><span class="note" style="margin-left:auto">' + esc(hz(n)) + '，自有，消息 ' + n.messages + ' 条</span></header>'
    + '<div class="body">' + (msgs.length ? msgs.map(function(e){
      var who = e.type === 'delegate' ? nameOf(e.from) + ' 派活' : e.type === 'report' ? nameOf(e.from) + ' 回报' : '最近 ' + e.count + ' 条消息里的最后一句（与 ' + nameOf(e['with']) + '）';
      var txt = e.type === 'delegate' ? e.task : e.type === 'report' ? e.summary : '「' + e.last + '」';
      return '<div class="msg"><small class="num">' + hm(T(e.t)) + '　' + esc(who) + '</small>' + esc(txt) + '</div>';
    }).join('') : '<p class="note">这里会是它的完整对话。</p>') + '<p class="note">完整对话页在 M1 接入；这里只列出守护进程登记过的事件。</p></div>'
    + '<footer><input placeholder="直接给「' + esc(shortTitle(n.title)) + '」发消息"><button class="btn pri" id="cSend">发送</button></footer>';
  c.classList.add('open');
  $('cBack').onclick = function(){ c.classList.remove('open'); };
  $('cSend').onclick = function(){ toast('消息会发给「' + shortTitle(n.title) + '」'); };
}

/* ───────── 杂项 ───────── */
var tt;
function toast(t){ var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(function(){ el.classList.remove('on'); }, 2600); }
function rebuild(){ build(); geom(); renderTally(); renderSince(); renderRuler(); renderYou(); renderTimeline(); renderQueue(); renderDetail(); }
function renderAbout(){
  $('about').innerHTML = '<b>泳道时间线</b>：横轴是时间，每个领头 agent 一条泳道，右边那根蓝线是「现在」。'
    + '<table><tr><td>折叠的泳道</td><td>上面一根是领头；下面每层一条细轨（最多 5 层），轨上加粗的是那一层有人在干活的时段</td></tr>'
    + '<tr><td>落下的短竖线 ▼</td><td>派活：上一层在这一刻把事交给下一层；「×3」是同一分钟派出 3 个</td></tr>'
    + '<tr><td>升起的短竖线 ⌃</td><td>回报：这一层在这一刻交回给上一层；虚线是回报被截断了</td></tr>'
    + '<tr><td>现在线左边的蓝虚线</td><td>等待链：从领头一路往下，每层都有派出去还没回报的活，链尾落在等你的序号点上</td></tr>'
    + '<tr><td>序号点</td><td>等你的事，和右栏同一个序号；越急越大越红，旁边是离自动拒还剩多久；≈ 是推测</td></tr>'
    + '<tr><td>实条 / 斜纹 / 点线</td><td>守护进程登记 / ≈ 推测 / 状态未知；空心条是空闲在等输入；带描边的是 Orchestra 自有的</td></tr>'
    + '<tr><td>时间轴</td><td>分段压缩：最近 15 分钟 5 分一格，再往前一刻钟一格、半小时一格</td></tr>'
    + '<tr><td>灰色底</td><td>你上次看到现在之间，可以拖</td></tr></table>'
    + '<h4>重押</h4>P5 合作画成边上的事件：派活落下、回报升起、等待成链；「你」常驻一行；P2 一个队列：现在线上的点和右栏是同一批条目；P6 选中深层只展开一条链。'
    + '<h4>放弃</h4>不画消息（只给计数和最后一句自述）；不画 agent 之间的横向消息边。'
    + '<h4>最弱的一点</h4>分段时间轴要看刻度才读得准；同一分钟的密集派活合成 ×n 后，要展开泳道才知道各派给了谁。';
}

/* ───────── 事件绑定 ───────── */
$('heads').addEventListener('click', function(e){
  var chip = e.target.closest('[data-list]');
  if (chip){
    var p = chip.getAttribute('data-list').split(':');
    var ids = p[1] === 'unread' ? laneUnread(p[0]).map(function(x){ return x.id; }) : (chipGroups(breakdown(subtree(p[0])))[p[1]] || []);
    st.detailList = { title: shortTitle(M.byId[p[0]].title) + ' 这条泳道里' + (p[1] === 'unread' ? '未读入的' : '「' + groupDef(p[1])[1] + '」的'), items: nodeItems(ids) };
    renderDetail(); return;
  }
  var lane = e.target.closest('[data-lane]');
  if (lane){
    var id = lane.getAttribute('data-lane');
    if (st.view === 'all'){ st.sel = id; st.detailList = null; renderTimeline(); renderDetail(); return; }
    var openNow = st.expanded[id] || (st.focus && M.byId[st.focus] && laneOf(st.focus) === id);
    if (openNow){ delete st.expanded[id]; if (st.focus && laneOf(st.focus) === id) st.focus = null; }
    else st.expanded[id] = true;
    st.sel = id; st.detailList = null; st.brakePreview = null;
    renderTimeline(); renderDetail(); return;
  }
  var sel = e.target.closest('[data-sel]');
  if (sel){ st.sel = sel.getAttribute('data-sel'); st.detailList = null; st.brakePreview = null; renderTimeline(); renderDetail(); return; }
  var fold = e.target.closest('[data-fold]');
  if (fold){ st.expanded[laneOf(fold.getAttribute('data-fold'))] = true; renderTimeline(); return; }
});
$('youband').addEventListener('click', function(e){
  if (e.target.closest('[data-you]')){
    var mine = youEvents();
    st.detailList = { title:'你做过的事', items: mine.map(function(x){ var id = x.to || x.node; return { id:id, tm:hm(T(x.type === 'approval' ? x.resolved.at : x.t)), text: x.type === 'delegate' ? '派出「' + nameOf(x.to) + '」：' + x.task : x.type === 'brake' ? '刹车：' + nameOf(x.node) : x.type === 'human' ? x.what + '：' + nameOf(x.node) : (x.resolved.decision === 'approved' ? '批准' : '拒绝') + '：' + nameOf(x.node) + '　' + x.ask, st:'' }; }) };
    renderDetail();
  }
});
$('tlSvg').addEventListener('click', function(e){
  var q = e.target.closest('[data-q]');
  if (q){ st.openQ = q.getAttribute('data-q'); st.hlQ = st.openQ; renderQueue(); var el = document.querySelector('.q[data-q="' + st.openQ + '"]'); if (el) el.scrollIntoView({block:'nearest'}); renderTimeline(); return; }
  var sel = e.target.closest('[data-sel]');
  if (sel){ st.sel = sel.getAttribute('data-sel'); st.detailList = null; st.brakePreview = null; renderTimeline(); renderDetail(); return; }
  var fold = e.target.closest('[data-fold]');
  if (fold){ st.expanded[laneOf(fold.getAttribute('data-fold'))] = true; renderTimeline(); }
});
$('tlSvg').addEventListener('mouseover', function(e){
  var q = e.target.closest('[data-q]'); var id = q ? q.getAttribute('data-q') : null;
  document.querySelectorAll('.q').forEach(function(el){ el.classList.toggle('hl', el.getAttribute('data-q') === id); });
});
$('btnDispatch').onclick = function(){ openDispatch(); };
$('sheet').addEventListener('click', function(e){ if (e.target === $('sheet')) closeDispatch(); });
function setView(v){ st.view = v; if (v === 'leads'){ st.expanded = {}; } $('vLeads').setAttribute('aria-pressed', v === 'leads'); $('vAll').setAttribute('aria-pressed', v === 'all'); renderTimeline(); }
$('vLeads').onclick = function(){ setView('leads'); };
$('vAll').onclick = function(){ setView('all'); };
function setMode(m){
  st.mode = m; $('dRich').setAttribute('aria-pressed', m === 'rich'); $('dSparse').setAttribute('aria-pressed', m === 'sparse');
  st.focus = null; st.sel = null; st.detailList = null; st.openQ = null; st.brakePreview = null;
  build();
  var note = $('sparseNote');
  if (m === 'sparse'){
    note.hidden = false;
    var obs2 = M.nodes.filter(function(n){ return n.sparseUnknown; }).length;
    note.innerHTML = '<b>贫瘠态</b>：按今天真实数据的形状读。观察来的会话只读到领头下面一层，更深的 <b class="num">' + M.hiddenDeep.length + '</b> 个因上限未读入（Orchestra 自有的会话在登记表里，照常显示）；DeepSeek Harness 的 <b class="num">' + M.dshUnread.length + '</b> 个会话因上限未读入；只读会话的 <b class="num">' + obs2 + '</b> 个子会话状态未知，派活记录对不上。';
  } else note.hidden = true;
  rebuild();
}
$('dRich').onclick = function(){ setMode('rich'); };
$('dSparse').onclick = function(){ setMode('sparse'); };
$('btnTheme').onclick = function(){
  var r = document.documentElement, cur = r.getAttribute('data-theme');
  var dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.setAttribute('data-theme', dark ? 'light' : 'dark');
  try { localStorage.setItem('ens07-theme', dark ? 'light' : 'dark'); } catch(_){}
};
try { var th = localStorage.getItem('ens07-theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch(_){}
document.addEventListener('keydown', function(e){
  var tag = (e.target.tagName || '').toLowerCase();
  if (e.key === 'Escape'){ closeDispatch(); $('convo').classList.remove('open'); if (st.brakePreview){ st.brakePreview = null; renderTimeline(); renderDetail(); } return; }
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.key === 'n' || e.key === 'N'){ e.preventDefault(); openDispatch(); }
});
var rz; window.addEventListener('resize', function(){ clearTimeout(rz); rz = setTimeout(function(){ geom(); renderRuler(); renderYou(); renderTimeline(); renderSince(); }, 80); });

/* 时钟：倒计时每秒就地更新；泳道每 10 秒重画一次 */
var lastFull = Date.now();
setInterval(function(){
  autoExpire();
  M.now = nowT();
  document.querySelectorAll('[data-rem]').forEach(function(el){
    var a = attById(el.getAttribute('data-rem')); if (!a || !a.deadline) return;
    var left = T(a.deadline) - M.now;
    el.textContent = el.tagName.toLowerCase() === 'text' ? mss(left) : '剩 ' + mss(left) + ' 自动拒';
  });
  document.querySelectorAll('[data-fz]').forEach(function(el){
    var a = attById(el.getAttribute('data-fz')); var left = T(a.deadline) - M.now, span = T(a.deadline) - T(a.openedAt);
    el.style.width = Math.max(0, Math.min(100, left/span*100)) + '%';
  });
  if (Date.now() - lastFull > 10000){ lastFull = Date.now(); geom(); renderRuler(); renderYou(); renderTimeline(); renderTally(); }
}, 1000);

renderAbout();
build();
// 首屏：最急那件事的整条祖先链展开成时间瀑布，其余泳道折成小瀑布
if (M.sure[0] && M.byId[M.sure[0].nodeId] && M.byId[M.sure[0].nodeId].depth > 1) st.focus = M.sure[0].nodeId;
geom(); rebuild();
window.__ens07 = { st: st, model: function(){ return M; }, rows: function(){ return R; }, decide: decide, setMode: setMode, locate: locate };
})();
</script>
