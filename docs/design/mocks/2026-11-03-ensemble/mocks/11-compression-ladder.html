<!doctype html>
<!--
方案 11：压缩阶梯（compression ladder）
核心：每一层是下一层的摘要；祖先各收成一行，焦点层全文；相邻两层的接缝和焦点竖杆上画边。
回答简报：P6 一次只展开一条祖先链（第 5 层时六层同屏、不缩进）；P5 边有五种画法——
  实线箭头派活、包裹回报、T 形挡板等待（指向被等的人并标已等多久）、折线出错、虚线 ≈ 对不上，
  顶层和每个焦点层都有「最近 30 分钟的交接」小链条，并行的兄弟画成并排短竖线；
  P3/P2 等你的事冒到顶层并带全链来路，队列与阶梯是同一个条目；P8 ≈ 推测单独计数、单独一节；
  P7/T3 每个计数点开就是那张列表；P12 顶层第二段是「自你上次看以来」；
  A16 只有收成一行的祖先和下一层列表按版面宽度截断，退到标点、加「…」、标「已截断」，
  命令、问题、倒计时整段保留或整段省略。
主动放弃：全局关系图。跨项目、跨枝的协作只在「最近的交接」里出现，不画成整张图。
  复核和打回的边已定义画法，剧本里没有这类事件，所以画面上不出现。
最大风险：它解决「不被淹没」强于「感到合作」；更适合当别的合作视图的下钻机制，而不是单独做首屏。
数据：丰富态只读 window.SCENARIO；贫瘠态按简报 7.4 的真实形状在页内生成
  （24 个主会话、111 个 subagent 其中 109 个状态未知、718 个因上限没画、DSH 92 个未读入），
  等你条目取自 SCENARIO 的同类条目。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>压缩阶梯</title>
<style>
[hidden]{display:none!important}
:root{
  --sans:"Microsoft YaHei UI","PingFang SC","Segoe UI Variable",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  --bg:#eceee9; --paper:#f7f8f5; --ink:#15171a; --ink2:#454a50; --mute:#7c8188;
  --rule:#cfd3cc; --rule2:#e1e4de; --gauge:#2a44c8; --gauge2:rgba(42,68,200,.14);
  --hl:#ffd640; --err:#bf2c1f; --hatch:#8d939a; --inv:#15171a; --invink:#f7f8f5;
  --shadow:0 12px 40px rgba(20,24,30,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1113; --paper:#16191c; --ink:#e7e9e4; --ink2:#b4b9be; --mute:#80868c;
    --rule:#2c3136; --rule2:#1f2327; --gauge:#8b9dff; --gauge2:rgba(139,157,255,.16);
    --hl:#7d6410; --err:#ff7b6c; --hatch:#7a8087; --inv:#e7e9e4; --invink:#0f1113;
    --shadow:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1113; --paper:#16191c; --ink:#e7e9e4; --ink2:#b4b9be; --mute:#80868c;
  --rule:#2c3136; --rule2:#1f2327; --gauge:#8b9dff; --gauge2:rgba(139,157,255,.16);
  --hl:#7d6410; --err:#ff7b6c; --hatch:#7a8087; --inv:#e7e9e4; --invink:#0f1113;
  --shadow:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
code,.mono{font-family:var(--mono);font-size:.92em}
mark{background:linear-gradient(transparent 50%,var(--hl) 50%,var(--hl) 94%,transparent 94%);color:inherit;padding:0 .08em;cursor:pointer}
:focus-visible{outline:2px solid var(--gauge);outline-offset:2px}

/* 顶栏 */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:50px;padding:0 20px;background:var(--bg);border-bottom:1px solid var(--rule)}
.brand{font-weight:700;letter-spacing:.01em}
.clock{font-family:var(--mono);color:var(--mute);font-size:12.5px}
.bar .sp{flex:1}
.dispatch{display:inline-flex;align-items:center;gap:10px;height:34px;padding:0 16px 0 14px;background:var(--inv);color:var(--invink);border-radius:3px;font-weight:600}
.dispatch kbd{font-family:var(--mono);font-size:11px;border:1px solid currentColor;border-radius:2px;padding:0 4px;opacity:.7}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;font-size:12.5px}
.seg button{padding:4px 10px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tool{font-size:12.5px;color:var(--ink2);padding:4px 8px;border:1px solid var(--rule);border-radius:3px}
.tag{font-size:10.5px;line-height:1.3;color:var(--mute);display:flex;flex-direction:column;align-items:flex-end;margin-left:4px;white-space:nowrap}
.tag a{color:var(--mute)}

/* 主体 */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:calc(100vh - 50px)}
@media (max-width:1180px){.stage{grid-template-columns:minmax(0,1fr) 336px}}
.ladder{padding:0 28px 80px 20px;min-width:0}
.queue{border-left:1px solid var(--rule);background:var(--paper);padding:18px 18px 60px;position:sticky;top:50px;height:calc(100vh - 50px);overflow:auto}

/* 当前档位 */
.where{position:sticky;top:50px;z-index:10;background:var(--bg);display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;padding:12px 0 10px 104px;border-bottom:1px solid var(--rule2);font-size:12.5px;color:var(--ink2)}
.where b{font-size:14px;color:var(--gauge);font-weight:600}
.where .nav{margin-left:auto;display:flex;gap:8px}
.where .nav button{color:var(--ink2);border-bottom:1px solid var(--rule)}

/* 一档 */
.rung,.joint{display:grid;grid-template-columns:72px 32px minmax(0,1fr) 96px;column-gap:0}
.rung{padding:14px 0 12px}
.rung:not(.focus){cursor:pointer}
.rung:not(.focus):hover .sent{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:5px}
.lv{display:flex;flex-direction:column;align-items:flex-end;padding-right:12px;line-height:1.2;text-align:right}
.lvn{font-size:12.5px;color:var(--mute);white-space:nowrap}
.lvn.wrap{white-space:normal;font-size:11.5px}
.focus .lvn{color:var(--gauge);font-weight:700;font-size:14px;padding-top:4px}
.focus .lvn.wrap{font-size:12px}
.lvm{display:none;font-size:11.5px;color:var(--mute)}
.focus .lvm{color:var(--gauge);font-weight:700}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:15px;top:0;bottom:0;border-left:2px solid var(--rule)}
.rung .rail::after{content:"";position:absolute;left:9px;top:12px;width:14px;height:14px;background:var(--bg);border:2px solid var(--ink2)}
.rung.focus .rail::after{background:var(--gauge);border-color:var(--gauge)}
.where + .rung .rail::before{top:14px}
.body{min-width:0;padding-left:6px}
.meta{font-size:12px;color:var(--mute);margin-bottom:2px}
.own{display:inline-block;font-size:11.5px;padding:0 5px;border-radius:2px;margin-right:6px;border:1px solid var(--rule);color:var(--ink2)}
.own.o-owned{border-color:var(--ink2);color:var(--ink)}
.own.o-for{border-style:dashed}
.sent{margin:0;line-height:1.5;overflow-wrap:anywhere}
.r0 .sent{font-size:29px;line-height:1.42;font-weight:500;letter-spacing:-.005em}
.r1 .sent{font-size:22px}
.r2 .sent{font-size:19px}
.r3 .sent{font-size:17px}
.r4 .sent{font-size:15.5px}
.r5 .sent{font-size:14.8px}
.r6 .sent,.r7 .sent{font-size:14.2px}
/* 焦点层不管多深都用大字：深层反而是要看清的地方 */
.rung.focus.r3 .sent,.rung.focus.r4 .sent,.rung.focus.r5 .sent,.rung.focus.r6 .sent,.rung.focus.r7 .sent{font-size:19px;line-height:1.5}
/* 不在焦点的祖先档：收成一行高，只留那一句和压缩量 */
.rung.compact{padding:6px 0 5px}
.rung.compact .sent{font-size:15px!important;line-height:1.5;color:var(--ink2)}
.rung.r0.compact .sent{font-size:16.5px!important;color:var(--ink)}
.rung.compact .lvn{padding-top:3px}
.rung.compact .rail::after{top:11px;left:11px;width:10px;height:10px}
.ledger{margin:6px 0 0;font-size:13px;color:var(--ink2)}
.ledger p{margin:2px 0}
/* 消息总量：只作参考，不抢倒计时和等你的视觉 */
.ratio{text-align:right;padding:6px 0 0 10px;line-height:1.3;font-size:11px;color:var(--mute)}
.ratio .rn{font-family:var(--mono)}
.rung.compact .body{grid-column:3 / span 2}

/* 最近的交接：横向小链条 */
.handoffs{margin:12px 0 4px;padding:8px 0 6px;border-top:1px solid var(--rule2)}
.handoffs .hh{font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;padding:3px 0;font-size:13px}
.hrow .tt{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.hrow .who{border-bottom:1px solid var(--rule);color:var(--ink);overflow-wrap:anywhere;text-align:left}
.hrow .who.you{border-bottom:0;font-weight:600}
.hrow .what{color:var(--ink2);font-size:12.5px;min-width:0;overflow-wrap:anywhere}
.hrow svg{width:58px;height:18px;display:block;flex:none}
.edge .hlf{fill:var(--hl)}
.kid.wt .ks{font-weight:500}
.hrow.k-report svg{color:var(--ink)}
/* 边的五种画法：同一组 SVG 用在焦点竖杆、交接链条和图例里 */
.edge{color:var(--ink2)}
.edge.e-wait,.edge.e-winf{color:var(--ink)}
.edge.e-err{color:var(--err)}
.edge.e-none,.edge.e-end{color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--mute);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend svg{width:34px;height:12px}
/* 并行：同一层的兄弟画成并排短竖线 */
.par{display:inline-flex;align-items:flex-end;gap:2px;height:16px;vertical-align:-3px;padding:0 3px;border-bottom:1px dotted var(--mute)}
.par i{display:block;width:4px;height:14px;background:var(--ink2)}
.par i.p-running{background:var(--ink)}
.par i.p-waiting{background:var(--hl);outline:1px solid var(--ink);height:16px}
.par i.p-maybe{background:transparent;outline:1px dashed var(--ink)}
.par i.p-error{background:var(--err)}
.par i.p-reported{background:transparent;outline:1px solid var(--ink2);height:8px}
.par i.p-unknown{background:repeating-linear-gradient(135deg,var(--hatch) 0 1.2px,transparent 1.2px 3px);outline:1px solid var(--hatch)}
.par i.p-idle{background:var(--rule);height:8px}
.par i.p-ended,.par i.p-braked{background:var(--rule2);height:4px}
.par i.p-dispatched,.par i.p-resumed,.par i.p-rejected{background:var(--gauge)}

/* 数字按钮、截断、置信度 */
.cnt{font-family:var(--mono);font-size:.95em;border-bottom:1px dotted currentColor;padding:0 1px;line-height:1.1}
.cnt:hover{background:var(--gauge2)}
.cnt.attn{background:var(--hl)}
.cnt.err,.err{color:var(--err)}
.cut{font-size:12px;color:var(--gauge);border:1px solid var(--gauge2);background:var(--gauge2);padding:0 6px;border-radius:2px;margin-left:4px;vertical-align:.12em;white-space:nowrap}
.unk{color:var(--ink2)}
.unk::before{content:"";display:inline-block;width:.78em;height:.78em;margin-right:.3em;vertical-align:-.04em;border:1px solid var(--hatch);background:repeating-linear-gradient(135deg,var(--hatch) 0 1.2px,transparent 1.2px 4px)}
.inf{text-decoration:underline dotted;text-underline-offset:4px;text-decoration-color:var(--ink2)}
.ago{color:var(--mute)}
.code{font-family:var(--mono);font-size:.88em;background:var(--rule2);padding:0 .3em;border-radius:2px}
.r0 .sent .code{font-size:.66em;vertical-align:.12em}

/* 接缝：派活 / 回报 / 来回消息 */
.joint{min-height:20px}
.joint .jb{padding:2px 0 4px 6px;font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:2px}
.joint.norec .rail::before{border-left-style:dashed}
.joint.plain .jb{padding:0}
.eg{display:flex;gap:6px;align-items:flex-start}
.eg svg{width:16px;height:16px;flex:none;margin-top:2px}
.eg .t{font-family:var(--mono);font-size:11.5px;color:var(--mute);flex:none}
.eg.rp button,.eg.compact button{color:var(--ink);border-bottom:1px solid var(--rule)}
.eg.compact{align-items:center;font-size:12px;flex-wrap:wrap}
.eg.compact svg{margin-top:0}
.eg .gap{width:10px}
.repcard{margin:4px 0 6px;border-left:3px solid var(--ink2);padding:6px 12px;background:var(--paper);font-size:13px;color:var(--ink)}
.repcard q{display:block;quotes:"「" "」";color:var(--ink2);margin:4px 0}
.repcard .sig{color:var(--mute);font-size:12px}
.repcard .trunc{color:var(--gauge);font-size:12.5px;margin:4px 0}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.refs span{font-family:var(--mono);font-size:11.5px;border:1px solid var(--rule);padding:0 6px;border-radius:2px;background:var(--bg)}

/* 焦点下的动作 */
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;white-space:nowrap;border:1px solid var(--ink2);border-radius:3px;font-size:13px;background:var(--paper)}
.btn.pri{background:var(--inv);color:var(--invink);border-color:var(--inv)}
.btn.warn{border-color:var(--err);color:var(--err)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.armed{background:var(--err);color:#fff;border-color:var(--err)}
.btn.hold{position:relative;user-select:none;-webkit-user-select:none;touch-action:none}
.btn.hold .ring{width:16px;height:16px;flex:none}
.btn.hold .ring circle{fill:none;stroke-width:2.4}
.btn.hold .ring .bg{stroke:currentColor;opacity:.3}
.btn.hold .ring .fg{stroke:currentColor;stroke-dasharray:44;stroke-dashoffset:44;transform:rotate(-90deg);transform-origin:50% 50%}
.btn.hold.pressing .ring .fg{transition:stroke-dashoffset 1s linear;stroke-dashoffset:0}
.ack{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);margin-top:8px;width:100%}
.stopgrp{display:inline-flex;gap:6px;padding-left:10px;border-left:1px solid var(--rule)}
.note{font-size:12.5px;color:var(--mute)}
.inline-att{margin-top:12px}

/* 下一档 */
.next{margin-top:0}
.next-h{display:grid;grid-template-columns:72px 32px minmax(0,1fr);font-size:12.5px;color:var(--ink2);padding:10px 0 6px}
.next-h .rail::before{border-left-color:var(--gauge)}
.next-h .nh{padding-left:6px;display:flex;flex-direction:column;gap:2px}
/* 焦点竖杆一直往下，每一句从竖杆分出一条短边 */
.kid{display:grid;grid-template-columns:72px 32px 48px minmax(0,1fr) 72px;padding:6px 0;cursor:pointer;border-radius:2px;position:relative}
.kid:hover{background:var(--gauge2)}
.kid .rail::before{border-left-color:var(--gauge)}
.next .kid:last-child .rail::before{bottom:auto;height:22px}
.kid .lv{font-family:var(--mono);font-size:11px;color:var(--mute);padding-top:7px;white-space:nowrap}
.kid .lv.w{color:var(--ink);font-weight:600}
.kid .kg{position:relative}
.kid .kg svg{position:absolute;left:-16px;top:13px;width:64px;height:20px}
.kid .ks{margin:0;line-height:1.5}
.kid .kl{margin:1px 0 0;font-size:12.5px;color:var(--ink2)}
.kid .kr{text-align:right;font-family:var(--mono);font-size:11px;color:var(--mute);padding:6px 0 0 8px}
.kid .kr small{font-family:var(--sans);margin-left:2px}
.kid.flash{animation:flash 2.4s ease-out}
@keyframes flash{from{background:var(--hl)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.kid.flash{animation:none;background:var(--gauge2)}}
.kid.raw .ks{font-family:var(--mono);font-size:13px}
.s1 .ks{font-size:21px}.s2 .ks{font-size:18px}.s3 .ks{font-size:16.5px}.s4 .ks{font-size:15.2px}.s5 .ks,.s6 .ks,.s7 .ks{font-size:14.4px}

/* 原文档 */
.rawlog{margin:8px 0 0;padding:0;list-style:none;font-family:var(--mono);font-size:12.5px;border-top:1px solid var(--rule2)}
.rawlog li{display:grid;grid-template-columns:64px 18px 1fr;gap:6px;padding:5px 0;border-bottom:1px solid var(--rule2);color:var(--ink2)}
.rawlog li .tt{color:var(--mute)}
.rawlog li.k-error{color:var(--err)}
.rawlog li.k-report,.rawlog li.k-delegate{color:var(--ink)}

/* 队列 */
.qh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qh h2{margin:0;font-size:18px;font-weight:600}
.qh h2 .cnt{font-size:18px}
.qsub{font-size:12px;color:var(--mute)}
.qtoggle{display:none}
.qbrief{display:none}
.att{border-top:1px solid var(--rule);padding:12px 0 12px;position:relative}
.att:first-of-type{border-top-color:var(--ink2)}
.att .ah{display:flex;align-items:baseline;gap:10px;cursor:pointer}
.att .tl{font-family:var(--mono);font-size:22px;line-height:1;min-width:58px}
.att .tl.soon{color:var(--err)}
.att .tl.none{font-family:var(--sans);font-size:13px;color:var(--mute)}
.att .kd{font-size:12.5px;color:var(--ink2)}
.att .kd .hi{color:var(--err);font-weight:600}
.att .ask{margin:6px 0 2px;font-size:13.5px;overflow-wrap:anywhere}
.att .ask .code{font-size:12.5px}
.att .from{font-size:12px;color:var(--mute);line-height:1.55}
.att .from button{color:var(--ink2);border-bottom:1px solid var(--rule2)}
.att .from b button{color:var(--ink);font-weight:600}
.att dl{margin:8px 0 0;font-size:12.5px;display:grid;grid-template-columns:64px 1fr;gap:3px 8px}
.att dt{color:var(--mute)}
.att dd{margin:0;color:var(--ink2)}
.att .typed{width:100%;margin-top:8px;height:30px;border:1px solid var(--err);background:var(--bg);color:var(--ink);font:13px var(--mono);padding:0 8px;border-radius:2px}
.att .aa{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.att.inferred .tl{font-family:var(--sans);font-size:13px;color:var(--ink2)}
.att.sel{background:linear-gradient(90deg,var(--gauge2),transparent 70%)}
.inline-att .att{border:1px solid var(--rule);background:var(--paper);padding:12px 14px;border-radius:3px}
.qsec{margin-top:22px}
.qsec h3{margin:0 0 6px;font-size:13.5px;font-weight:600}
.qrow{display:block;width:100%;text-align:left;padding:6px 0;border-top:1px solid var(--rule2);font-size:12.5px;color:var(--ink2)}
.qrow b{color:var(--ink);font-weight:600}
.qrow .err{font-weight:600}

/* 弹层 */
.sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;background:rgba(10,12,14,.38);padding:7vh 16px 16px}
.sheet.on{display:flex}
.panel{width:min(640px,100%);max-height:84vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:4px;box-shadow:var(--shadow);padding:20px 22px}
.panel.wide{width:min(980px,100%)}
.panel h2{margin:0 0 4px;font-size:18px}
.panel .sub{font-size:12.5px;color:var(--mute);margin:0 0 12px}
.lrow{display:grid;grid-template-columns:92px 1fr;gap:10px;width:100%;text-align:left;padding:7px 0;border-top:1px solid var(--rule2);font-size:13px}
.lrow small{display:block;color:var(--mute);font-size:11.5px}
.lrow .tt{font-family:var(--mono);font-size:12px;color:var(--mute)}
.st{font-size:12px;color:var(--ink2)}
.st.s-error{color:var(--err)}
.st.s-waiting{background:var(--hl);color:var(--ink);padding:0 3px;align-self:start;justify-self:start}

<script src="../scenario.js"></script>
<script>
(function(){
'use strict';
var BASE = window.SCENARIO;
if(!BASE){ document.getElementById('ladder').textContent='没有读到 scenario.js'; return; }
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var TZ=8*3600e3;
function T(s){return s?Date.parse(s):NaN;}
function hm(ms){return new Date(ms+TZ).toISOString().slice(11,16);}
function hms(ms){return new Date(ms+TZ).toISOString().slice(11,19);}
function iso(ms){return new Date(ms+TZ).toISOString().slice(0,19)+'+08:00';}
function mmss(ms){ms=Math.max(0,ms);var s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function ago(ms){var s=Math.max(0,Math.floor(ms/1000));if(s<60)return s+' 秒前';var m=Math.floor(s/60);if(m<60)return m+' 分钟前';return Math.floor(m/60)+' 小时 '+(m%60)+' 分前';}
function ktok(v){return v==null?'未知':Math.round(v/1000)+'k';}

/* ---------- 时钟（从剧本的 now 起走；可暂停） ---------- */
var NOW0=T(BASE.meta.now), clockBase=NOW0, clockStart=Date.now(), paused=false, pausedAt=NOW0;
function now(){return paused?pausedAt:clockBase+(Date.now()-clockStart);}

/* ---------- 数据 ---------- */
var ST={
  waiting:{l:'等你',o:0}, maybe:{l:'≈ 可能在等你',o:1}, error:{l:'出错',o:2}, running:{l:'在跑',o:3},
  dispatched:{l:'刚派出',o:4}, resumed:{l:'已放行',o:5}, rejected:{l:'被拒后待回应',o:6}, reported:{l:'已回报',o:7},
  unknown:{l:'状态未知',o:8}, idle:{l:'空闲',o:9}, braked:{l:'被刹车',o:10}, ended:{l:'已结束',o:11}
};
var D, path=['g'], selQ=null, mode='rich', newSeq=0, lastQueueChange=0, queueHover=false, queueOrder=null;
var typed={}, repOpen={}, flashId=null, brakeArm=null, lastSeen=NOW0-30*60e3, CUTS=[], ds=null;
/* 每块画面各有一张列表登记表，重画哪块就清哪块，不会无限增长 */
var REGS={ladder:[],queue:[]}, curNS='ladder';

function build(m){
  var S=m==='sparse'?sparseShape():JSON.parse(JSON.stringify(BASE));
  S.byId=new Map(S.nodes.map(function(n){return [n.id,n];}));
  S.attention.forEach(function(a){a.status='open';});
  S.capped=S.capped||[]; S.dshUnread=S.dshUnread||[];
  return S;
}
/* 贫瘠态：按简报 7.4 的真实数据形状生成（数字原样，名字自拟）。
   24 个 Claude 主会话（13 个在 registry 里：3 在跑、1 个 ≈ 可能在等你、9 空闲；11 个不在 registry，状态未知）；
   111 个 subagent，最多 16 个挂在同一个主会话下，109 个状态未知，能对上派活记录的只有 2 个；
   718 个因快照上限没画；DSH 磁盘上 92 个会话一个也没读入；自有 Codex 会话 2 个，其中 1 个等你批准；
   另有 1 张经 seat 发来的 DSH 请求卡。等你条目取自 SCENARIO 里的同类条目。 */
function sparseShape(){
  var S=JSON.parse(JSON.stringify(BASE)),t0=NOW0,nodes=[],events=[];
  function at(min){return iso(t0-min*60e3);}
  function seed(i){var x=Math.sin(i*97.13)*10000;return x-Math.floor(x);}
  var proj=S.projects.map(function(p){return p.id;});
  var titles=['重构结算页表单','查 vitest 偶发超时','整理分词实验笔记','改 CI 缓存配置','排查 DSH 插件握手','写周报草稿','读 Sparse-Attn 附录','升级 pnpm 依赖','补购物车单测','对齐论文表 3 数字',
    '调 tokenizer 参数','复查埋点改动','迁移设计系统按钮','看 CDN 回源日志','整理 seat 插件文档','试 MCP SSE 传输','清理旧分支','跑消融 k=32','改 README 安装步骤','审一遍 a11y 问题',
    '对比两版 warmup','修 lint 报错','查内存占用','核对数据集校验值'];
  var subs=[16,14,12,11,10,9,8,7,6,5,4,3,2,2,1,1]; // 合计 111
  var stIdx={0:'running',1:'running',2:'running',3:'maybe'};
  var infA=BASE.attention.filter(function(a){return a.kind==='inferred';})[0];
  for(var i=0;i<24;i++){
    var id='m'+(i+1),inReg=i<13,st=inReg?(stIdx[i]||'idle'):'unknown';
    var n={id:id,parent:'you',depth:1,project:proj[i%proj.length],harness:'claude',ownership:'observed',role:'plan',model:null,title:titles[i],
      task:null,state:st==='maybe'?'waiting':st,spawnedAt:at(170-i*3),since:at(40-i),lastActivity:at(st==='running'?1+i:st==='maybe'?14:30+i*4),
      tokens:null,costUsd:null,messages:30+Math.round(seed(i)*180),children:[],report:null,
      stateDetail:st==='maybe'?{kind:'inferred',inferred:true,why:infA?infA.why:'最后一条输出像在提问，之后没有动静'}:
        st==='idle'?{kind:'idle',why:'在 registry 里，眼下没有在跑的回合'}:
        st==='unknown'?{kind:'unknown',why:'不在 registry 里；只有会话文件，不知道进程还在不在'}:null};
    nodes.push(n);
    events.push({t:n.spawnedAt,type:'delegate',from:'you',to:id,task:n.title,via:'observed-start'});
  }
  var k=0;
  subs.forEach(function(cnt,mi){
    var p=nodes[mi];
    for(var j=0;j<cnt;j++){
      k++;var cid=p.id+'.s'+(j+1),matched=(mi===0&&j<2);
      var c={id:cid,parent:p.id,depth:2,project:p.project,harness:'claude',ownership:'observed',role:'explore',model:null,
        title:matched?(j===0?'找结算页的旧表单引用':'列出要改的样式文件'):'子会话 '+(j+1)+'（任务未知）',task:null,
        state:matched?(j===0?'running':'ended'):'unknown',spawnedAt:at(120-k%60),since:at(20),lastActivity:at(matched&&j===0?2:25+k%40),
        tokens:null,costUsd:null,messages:matched?18+j*9:null,children:[],report:null,
        stateDetail:matched?(j===0?null:{kind:'ended',why:'会话已退出（退出码 0）'}):{kind:'unknown',sparse:true,why:'只知道挂在「'+p.title+'」下面；派活记录对不上'}};
      if(!matched)c.unread='消息数没有读入';
      nodes.push(c);p.children.push(cid);
      if(matched)events.push({t:c.spawnedAt,type:'delegate',from:p.id,to:cid,task:c.title});
    }
  });
  if(nodes[1]){nodes[1].messages=null;nodes[1].unread='会话文件太大，消息数没有读入';}
  // 自有 Codex 会话 2 个（Orchestra 开的），其中 1 个等你批准
  var apA=BASE.attention.filter(function(a){return a.kind==='approval'&&a.risk==='medium';})[0];
  var o1={id:'own.1',parent:'you',depth:1,project:proj[0],harness:'codex',ownership:'owned',role:'impl',model:null,title:'升级表单库（自有）',task:'把表单库升到 v4',
    state:'waiting',spawnedAt:at(25),since:at(3),lastActivity:at(2),tokens:null,costUsd:null,messages:14,children:[],report:null,stateDetail:{kind:'approval'}};
  var o2={id:'own.2',parent:'you',depth:1,project:proj[1],harness:'codex',ownership:'owned',role:'impl',model:null,title:'核对数据集校验值（自有）',task:'核对 3 个数据集的 sha256',
    state:'running',spawnedAt:at(35),since:at(35),lastActivity:at(1),tokens:null,costUsd:null,messages:21,children:[],report:null,stateDetail:null};
  // 经 seat 发来请求的 DSH 会话：只从请求里知道它存在，会话文件本身没读入
  var seatA=BASE.attention.filter(function(a){return a.kind==='seat';})[0];
  var sd={id:'dsh.seat',parent:'you',depth:1,project:proj[2]||proj[0],harness:'dsh',ownership:'observed',role:'unknown',model:null,title:'经 seat 发来请求的 DSH 会话',task:null,
    state:'waiting',spawnedAt:at(60),since:at(3),lastActivity:at(3),tokens:null,costUsd:null,messages:null,unread:'因快照上限未读入',children:[],report:null,stateDetail:{kind:'seat'}};
  nodes.push(o1,o2,sd);
  events.push({t:o1.spawnedAt,type:'delegate',from:'you',to:o1.id,task:o1.task,via:'orchestra'},{t:o2.spawnedAt,type:'delegate',from:'you',to:o2.id,task:o2.task,via:'orchestra'});
  var att=[];
  if(apA){var a1=JSON.parse(JSON.stringify(apA));a1.nodeId=o1.id;a1.chain=[o1.id];a1.openedAt=at(2.5);a1.deadline=iso(t0+12.5*60e3);att.push(a1);
    events.push({t:a1.openedAt,type:'approval',node:o1.id,subkind:a1.subkind,risk:a1.risk,ask:a1.ask,deadline:a1.deadline});}
  if(seatA){var a2=JSON.parse(JSON.stringify(seatA));a2.nodeId=sd.id;a2.chain=[sd.id];att.push(a2);
    events.push({t:a2.openedAt,type:'seat_request',node:sd.id,requesterClaimed:a2.requesterClaimed,verified:a2.verified,ask:a2.ask,deadline:a2.deadline});}
  if(infA){var a3=JSON.parse(JSON.stringify(infA));a3.nodeId=nodes[3].id;a3.chain=[nodes[3].id];a3.openedAt=nodes[3].lastActivity;att.push(a3);}
  var capped=[],dsh=[];
  for(var c2=1;c2<=718;c2++)capped.push({k:'stub',st:'没画出',s:'Claude 子会话文件 '+c2+'：因快照上限没有读，只知道磁盘上有它'});
  for(var d2=1;d2<=92;d2++)dsh.push({k:'stub',st:'未读入',s:'DeepSeek Harness 会话 '+d2+'：因上限未读入；在跑、空闲还是已结束都不知道'});
  S.nodes=nodes;S.attention=att;S.events=events;S.capped=capped;S.dshUnread=dsh;S.sparse=true;
  S.dispatch={drafts:[]};
  return S;
}
D=build('rich');

function N(id){return D.byId.get(id);}
function kids(id){
  if(id==='you') return D.nodes.filter(function(n){return n.parent==='you';});
  var n=N(id); return n?n.children.map(N).filter(Boolean):[];
}
function desc(id){var out=[],q=kids(id).slice();while(q.length){var n=q.shift();out.push(n);q.push.apply(q,kids(n.id));}return out;}
function projOf(pid){return D.projects.filter(function(p){return p.id===pid;})[0];}
function projNodes(pid){return D.nodes.filter(function(n){return n.project===pid;});}
function projRoots(pid){return D.nodes.filter(function(n){return n.project===pid && n.parent==='you';});}
function chainOf(id){var c=[],n=N(id);while(n){c.unshift(n);n=N(n.parent);}return c;}
function est(n){return (n.state==='waiting' && n.stateDetail && n.stateDetail.inferred)?'maybe':n.state;}
function groups(list){
  var g={};list.forEach(function(n){var k=est(n);(g[k]=g[k]||[]).push(n);});
  return Object.keys(g).sort(function(a,b){return ST[a].o-ST[b].o;}).map(function(k){return {k:k,label:ST[k].l,nodes:g[k]};});
}
function msgs(list){var s=0,u=[];list.forEach(function(n){if(n.messages==null)u.push(n);else s+=n.messages;});return {s:s,u:u};}
function openAtt(){return D.attention.filter(function(a){return a.status==='open';});}
/* 正式的等你和 ≈ 推测分开数（P8） */
function formalAtt(){return openAtt().filter(function(a){return a.kind!=='inferred';});}
function infAtt(){return openAtt().filter(function(a){return a.kind==='inferred';});}
function attRows(l){return l.map(function(x){return {k:'att',id:x.id};});}
/* 层的名字：只有一套叫法 */
function hasDel(n){return D.events.some(function(e){return e.type==='delegate'&&e.to===n.id;});}
function lvName(key){
  if(key==='g')return '全局';if(key.indexOf('p:')===0)return '项目';if(key.indexOf('r:')===0)return '原文';
  var n=N(key);if(!n)return '';
  if(n.depth===1)return (n.ownership==='foreign'||!hasDel(n))?'来源不明':(n.role==='plan'?'领头':'主会话');
  return '第 '+n.depth+' 层';
}
function lvLong(key){
  var n=key.indexOf(':')<0&&key!=='g'?N(key):null;
  if(n&&n.depth===1&&lvName(key)==='来源不明')return '挂在你下面（来源不明）';
  return lvName(key);
}
function sortAtt(l){return l.slice().sort(function(a,b){var da=a.deadline?T(a.deadline):Infinity,db=b.deadline?T(b.deadline):Infinity;if(da!==db)return da-db;return T(a.openedAt)-T(b.openedAt);});}
function attFor(id){return openAtt().filter(function(a){return a.nodeId===id;});}
function nm(id){if(id==='you')return '你';var n=N(id);return n?'「'+n.title+'」':id;}
function hLabel(n){return n.harness&&D.harnesses[n.harness]?D.harnesses[n.harness].label:'未知 harness';}
function cmdOf(a){return a.ask.replace(/^运行命令：/,'').replace(/^写文件：/,'');}
function verbOf(a){
  if(a.kind==='approval') return a.subkind==='write'?'要写文件':'要跑命令';
  if(a.kind==='seat') return '请求派会话'; if(a.kind==='question') return '在问你';
  if(a.kind==='inferred') return '≈ 可能在等你'; return '在等你';
}
function kindLabel(a){
  if(a.kind==='approval') return a.subkind==='write'?'批准写文件':'批准命令';
  if(a.kind==='seat') return '派会话请求'; if(a.kind==='question') return '回答问题';
  if(a.kind==='inferred') return '推测，不是正式请求'; return '等你';
}
function needOf(a){
  if(a.kind==='seat' && a.verified===false) return '未核实';
  if(a.kind==='approval' && a.risk==='high') return cmdOf(a).split(/\s+/).slice(0,2).join(' ');
  return null;
}
var OUT={approved:'已批准',rejected:'已拒绝',dispatched:'已派出',answered:'已回答',expired:'超时自动拒',dismissed:'在这里收起（那边没处理）',braked:'随刹车撤销'};

function evText(e){
  switch(e.type){
    case 'delegate': return nm(e.from)+' 派给 '+nm(e.to)+'：'+e.task+(e.via==='observed-start'?'（你在终端里开的，观察到）':e.via==='seat'?'（应 seat 请求）':'');
    case 'message': return nm(e.node)+' 与 '+nm(e.with)+' 来回 '+e.count+' 条；最后一条：「'+e.last+'」';
    case 'report': return nm(e.from)+' 回报给 '+nm(e.to)+'：'+e.status+(e.truncated?'（摘要已截断）':'');
    case 'approval': return nm(e.node)+' 请求批准：'+e.ask+(e.resolved?'（'+(e.resolved.by==='timeout'?'超时自动拒':e.resolved.decision==='approved'?'你批准了':'你拒绝了')+'）':'');
    case 'seat_request': return nm(e.node)+' 经 seat 请求开会话，发起人'+e.requesterClaimed+(e.verified?'':'（未核实）');
    case 'question': return nm(e.node)+' 问你：'+e.ask;
    case 'error': return nm(e.node)+' 出错：'+e.msg;
    case 'end': return nm(e.node)+' 会话退出（退出码 '+e.exitCode+'）';

function foldKids(keys,lvl,kinds){
  var nodes=keys.filter(function(k){return k.indexOf(':')<0;}).map(N);
  var fold={};
  if(nodes.length>=4){groups(nodes).forEach(function(g){if(g.nodes.length>=3&&NOFOLD.indexOf(g.k)<0)fold[g.k]=g;});}
  var done={},out=[];
  keys.forEach(function(k){
    var n=k.indexOf(':')<0?N(k):null,g=n&&fold[est(n)];

    var m=msgs(g.nodes),withDel=g.nodes.filter(hasDel).length;
    var names=g.nodes.slice(0,3).map(function(x){return esc(x.title);}).join('、')+(g.nodes.length>3?' 等':'');

function nextKeys(key){

  var dshRoute=route&&route.harness==='dsh';
  h+='<div class="acts"><button class="btn pri" data-act="ds-go"'+(noAgent||dshRoute?' disabled':'')+'>派出</button><button class="btn" data-act="close">取消</button>'+(noAgent?'<span class="note">这条建议你自己看，不派 agent。</span>':'')+(dshRoute?'<span class="note">DSH 子会话只能由 DSH 自己开；Orchestra 只能开 Claude Code 或 Codex。选另一条路由，或去 DSH 里派。</span>':'')+'</div>';
  $('#panel').className='panel';$('#panel').innerHTML=h;
}
function doDispatch(){
  var text=(ds.text||'').trim();if(!text){toast('先写一句要做什么。');return;}
  var p=ds.parent==='you'?null:N(ds.parent),id='you.new'+(++newSeq);
  var proj=p?p.project:(ds.project||(path[1]?path[1].slice(2):D.projects[0].id));
  var route=ds.draft&&ds.draft.routes[ds.route];
  if(route&&route.harness==='dsh'){toast('DSH 子会话只能由 DSH 自己开。');return;}
  var harness=route&&route.harness?route.harness:ds.harness;
  var nn={id:id,parent:p?p.id:'you',depth:p?p.depth+1:1,project:proj,harness:harness,ownership:'owned',role:p?'unknown':'plan',model:route?route.model:null,
    title:text.length>18?text.slice(0,18)+'…':text,task:text,state:'dispatched',spawnedAt:iso(now()),since:iso(now()),lastActivity:iso(now()),tokens:0,costUsd:0,messages:0,children:[],stateDetail:{kind:'dispatched'},report:null};
  D.nodes.push(nn);D.byId.set(id,nn);if(p)p.children.push(id);
  pushEv({type:'delegate',from:'you',to:id,task:text,via:'orchestra'});
  closeSheet();flashId=id;
  if(p)goTo(p.id);else goTo('p:'+proj);
  renderQueue();
  toast('已派出：挂在'+(p?'「'+p.title+'」':'你')+'下面，'+hm(now()));
}

/* ---------- 刹车：先看波及范围，再确认 ---------- */
var ACTIVE=['running','waiting','maybe','unknown','idle','dispatched','resumed','rejected','error','reported'];
function openBrake(id){
  var n=N(id),sub=[n].concat(desc(id)),act=sub.filter(function(x){return ACTIVE.indexOf(est(x))>=0&&x.state!=='reported';}),rest=sub.filter(function(x){return act.indexOf(x)<0;});
  var ids=new Set(sub.map(function(x){return x.id;})),at=openAtt().filter(function(a){return ids.has(a.nodeId);});
  var h='<h2>'+(n.ownership==='owned'?'刹车':'停进程树')+'：「'+esc(n.title)+'」和它下面整棵</h2><p class="sub">这一档往下所有会话的进程都会停。先看清会波及谁。</p>';
  h+='<div class="field"><label>会停下 '+act.length+' 个会话</label>'+act.map(function(x){return rowHtml({k:'node',id:x.id});}).join('')+'</div>';
  if(rest.length)h+='<div class="field"><label>不受影响 '+rest.length+' 个（已回报、已结束或已被刹车，进程已不在）</label>'+rest.map(function(x){return rowHtml({k:'node',id:x.id});}).join('')+'</div>';
  if(at.length)h+='<div class="field"><label>会一起撤销的等你条目 '+at.length+' 件</label>'+at.map(function(a){return rowHtml({k:'att',id:a.id});}).join('')+'</div>';
  if(n.ownership==='owned'){
    h+='<div class="acts"><button class="btn warn" id="brakeGo" data-act="brake-go" data-id="'+id+'">刹车</button><button class="btn" data-act="close">取消</button><span class="note">3 秒内点两次才生效</span></div>';
  } else {
    h+='<p class="note">这是只读会话。正常处理请回 '+esc(hLabel(n))+'；这里只能在本机进程层面停掉它的进程树。</p><input class="typed" style="width:100%;height:32px;border:1px solid var(--err);background:var(--bg);color:var(--ink);padding:0 8px;font:13px var(--mono)" id="brakeTyped" placeholder="键入 '+esc(n.title)+' 确认">'+
      '<div class="acts"><button class="btn warn" id="brakeGo2" data-act="brake-go2" data-id="'+id+'" disabled>停进程树</button><button class="btn" data-act="close">取消</button></div>';
  }
  $('#panel').className='panel';$('#panel').innerHTML=h;openSheet();
}
function doBrake(id){
  var n=N(id),sub=[n].concat(desc(id)),t=now();
  sub.forEach(function(x){if(['ended','braked','reported'].indexOf(x.state)<0){x.state='braked';x.stateDetail={kind:'braked',by:'you',why:'你在 '+hm(t)+' 刹住'+(x===n?'':'（随上级「'+n.title+'」整棵）')};}});
  var ids=new Set(sub.map(function(x){return x.id;}));
  openAtt().forEach(function(a){if(ids.has(a.nodeId)){a.status='braked';a.resolvedAt=t;}});
  markQ();pushEv({type:'brake',node:id,by:'you'});
  closeSheet();renderAll();toast('已刹住「'+n.title+'」整棵：'+sub.length+' 个会话');
}

/* ---------- 对话页（J8） ---------- */
function openConvo(id){
  var n=N(id),evs=evsOf(id);
  var h='<header><div class="note">你 → '+chainOf(id).map(function(x){return esc(x.title);}).join(' → ')+'</div><h2 style="margin:2px 0">'+esc(n.title)+' 的完整对话</h2>'+
    '<div class="meta">'+ownTag(n)+esc(hLabel(n))+'　'+(n.messages==null?'消息数未知':n.messages+' 条消息')+'　<button class="btn" data-act="close" style="height:26px">回到阶梯（Esc）</button></div></header>';
  h+='<div class="msgs">'+(n.task?'<div class="msg"><div class="who">任务</div>'+esc(n.task)+'</div>':'')+
    evs.map(function(e){return '<div class="msg"><div class="who">'+hms(T(e.t))+'</div>'+esc(evText(e))+'</div>';}).join('')+
    '<p class="note">消息正文按会话文件原样加载；这份数据只带了守护进程的记录。</p></div>';
  if(n.ownership==='owned') h+='<footer><input placeholder="给「'+esc(n.title)+'」发消息"><button class="btn pri" data-act="send">发送</button></footer>';
  else h+='<footer><span class="note">'+(n.ownership==='observed'?'只读会话：要打字请回 '+esc(hLabel(n))+' 里。':'归属不明：只能看。')+'</span></footer>';
  $('#panel').className='panel wide convo';$('#panel').innerHTML=h;openSheet();
}

/* ---------- 列表弹层（每个数字点开就是它） ---------- */
function rowHtml(r){
  if(r.k==='node'){var n=N(r.id),k=est(n);return '<button class="lrow" data-go="'+n.id+'"><span class="st s-'+k+'">'+ST[k].l+'</span><span><b>'+esc(n.title)+'</b><small>你 → '+chainOf(n.id).map(function(x){return esc(x.title);}).join(' → ')+'</small></span></button>';}
  if(r.k==='proj'){var p=projOf(r.id);return '<button class="lrow" data-go="p:'+p.id+'"><span class="st">项目</span><span><b>'+esc(p.name)+'</b><small>'+projNodes(p.id).length+' 个 agent</small></span></button>';}
  if(r.k==='att'){var a=D.attention.filter(function(x){return x.id===r.id;})[0];return '<button class="lrow" data-go="'+a.nodeId+'" data-pick="'+a.id+'"><span class="st s-waiting">'+(a.status==='open'?(a.deadline?'剩 '+mmss(T(a.deadline)-now()):'不限时'):OUT[a.status])+'</span><span><b>'+esc(N(a.nodeId).title)+'</b>：'+esc(a.ask)+'</span></button>';}
  if(r.k==='ev'){var e=r.e;return '<button class="lrow" data-go="'+evNode(e)+'"><span class="tt">'+hms(T(e.t))+'</span><span>'+esc(evText(e))+'</span></button>';}
  if(r.k==='html')return '<p class="sent" style="font-size:16px">'+r.html+'</p>';
  if(r.k==='stub')return '<div class="lrow"><span class="st unk">'+esc(r.st)+'</span><span>'+esc(r.s)+'</span></div>';
  if(r.k==='text')return '<div class="lrow"><span class="st">截断</span><span>'+esc(r.s)+'</span></div>';
  return '';
}
function openList(i){
  var ks=String(i).split(':'),L=(REGS[ks[0]]||[])[+ks[1]];if(!L)return;
  $('#panel').className='panel';
  $('#panel').innerHTML='<h2>'+esc(L.title)+(L.nocount?'':'　<span class="mono">'+L.rows.length+'</span>')+'</h2><p class="sub">'+(L.nocount?'':'这里的行数就是那个数字。')+'点一行跳到阶梯上对应的那一层。</p>'+(L.rows.length?L.rows.map(rowHtml).join(''):'<p class="note">这张列表是空的。</p>');
  openSheet();
}
function openAbout(){
  var rows=[['一层一句','每一层都是下一层的摘要：全局、项目、领头，再往下第 2 层到第 5 层，最底是对话原文。句子由守护进程按记录算出来，不用 agent 的自述'],
    ['祖先收成一行','往下走时，走过的每一层收成一行留在上面，点哪行回哪层；你在的那一层写全文，不截'],
    ['竖杆上的边','焦点层往下的竖杆分出每一句的短边，边的形状就是它和上一层的关系（见下）'],
    ['最近的交接','全局、项目和每个焦点层都列出最近 30 分钟的派出和回报，左边是上一层，右边是下一层'],
    ['并排短竖线','同一层同时挂着的兄弟，一根一根并排：黑在跑、荧光等你、红出错、斜线状态未知、矮的是空闲或已回报'],
    ['荧光笔','压不下去的事：等你。不管多深都冒到全局那一句，≈ 推测的另外计数'],
    ['已截断','按版面宽度放不下的部分，切在标点处并加「…」；命令、问题、倒计时整段保留或整段省略；点开看全文']];
  var h='<h2>这一页怎么读</h2><p class="sub">往下走一步，信息放大一层；你始终知道自己在哪一层、上面压掉了什么、截掉了什么。</p>';
  h+='<table class="note-tbl">'+rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join('')+'</table>';
  h+='<p class="sub" style="margin-top:4px">边的画法（不读字也能分）：</p>'+legendHtml(['del','rep','wait','winf','err','none','end','brk','rev','back']);
  h+='<p class="note" style="margin-top:10px">复核和打回的边已经定好画法，但守护进程眼下没有记下这两类事件，所以阶梯上不会出现。</p>';
  h+='<div class="acts"><button class="btn" data-act="close">关上</button></div>';
  $('#panel').className='panel';$('#panel').innerHTML=h;openSheet();
}
function openSheet(){$('#sheet').classList.add('on');}
function closeSheet(){$('#sheet').classList.remove('on');brakeArm=null;}
var toastT;function toast(s){var t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},2800);}

/* ---------- 事件 ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target;
  var hb=el.closest('[data-hold]');if(hb){if(!hb.disabled&&!holdDone)toast('按住 1 秒才算数，松手就取消。');holdDone=false;return;}
  var li=el.closest('[data-list]');if(li){ev.preventDefault();openList(li.getAttribute('data-list'));return;}
  var mk=el.closest('mark[data-aid]');if(mk){pickAtt(mk.getAttribute('data-aid'));return;}
  var act=el.closest('[data-act]');
  if(act){var a=act.getAttribute('data-act');handleAct(a,act,ev);return;}
  var pick=el.closest('[data-pick]');if(pick){closeSheet();pickAtt(pick.getAttribute('data-pick'));return;}
  var go=el.closest('[data-go]');if(go){if($('#sheet').classList.contains('on'))closeSheet();goTo(go.getAttribute('data-go'));return;}
  if(el===$('#sheet'))closeSheet();
});
function findAtt(id){return D.attention.filter(function(x){return x.id===id;})[0];}
function pickAtt(id){var a=findAtt(id);if(!a)return;selQ=a.id;goTo(a.nodeId);renderQueue();var q=$('.queue [data-aid="'+id+'"]');if(q&&q.scrollIntoView)q.scrollIntoView({block:'nearest'});}
function doYes(aid){
  var at=findAtt(aid);
  if(!at||at.status!=='open'||!guard())return;
  var need=needOf(at);if(need&&(typed[aid]||'').trim()!==need){toast('先键入「'+need+'」');return;}
  if(at.kind==='seat')seatDispatch(at);else{resolve(at,'approved');toast('已批准：'+N(at.nodeId).title);}
}
/* 高风险：按住 1 秒才算数（带进度环），松手、移开就取消 */
var holdT=null,holdEl=null,holdDone=false;
function holdStart(b){if(!b||b.disabled||holdT)return;holdEl=b;b.classList.add('pressing');
  holdT=setTimeout(function(){holdT=null;b.classList.remove('pressing');holdDone=true;doYes(b.getAttribute('data-hold'));},1000);}
function holdStop(){if(holdT){clearTimeout(holdT);holdT=null;}if(holdEl){holdEl.classList.remove('pressing');holdEl=null;}}
document.addEventListener('pointerdown',function(ev){var b=ev.target.closest&&ev.target.closest('[data-hold]');if(b&&ev.button===0){holdDone=false;holdStart(b);}});
['pointerup','pointercancel'].forEach(function(t){document.addEventListener(t,holdStop);});
document.addEventListener('pointerout',function(ev){if(holdEl&&ev.target.closest&&ev.target.closest('[data-hold]')===holdEl&&!holdEl.contains(ev.relatedTarget))holdStop();});
document.addEventListener('keyup',function(ev){if(ev.key===' '||ev.key==='Enter')holdStop();});
function handleAct(a,el,ev){
  var aid=el.getAttribute('data-aid'),id=el.getAttribute('data-id'),at=aid?findAtt(aid):null;
  switch(a){
    case 'sel': if(selQ===aid){selQ=null;renderQueue();}else pickAtt(aid);break;
    case 'yes': doYes(aid);break;
    case 'no': if(!at||!guard())return;resolve(at,'rejected');toast('已拒绝：'+N(at.nodeId).title);break;
    case 'answer': if(!at||N(at.nodeId).ownership!=='owned'||!guard())return;resolve(at,'answered',at.options[+el.getAttribute('data-opt')]);toast('已回答');break;
    case 'dismiss': if(!at)return;resolve(at,'dismissed');break;
    case 'dispatch': openDispatch(el.getAttribute('data-parent'),el.getAttribute('data-draft'));break;
    case 'draft': ds.text=$('#dsText').value;applyDraft(id);renderDispatch();break;
    case 'ds-go': ds.text=$('#dsText').value;doDispatch();break;
    case 'close': closeSheet();break;
    case 'rep': repOpen[id]=!repOpen[id];renderLadder();break;
    case 'up': upOne();break;
    case 'convo': openConvo(id);break;
    case 'send': toast('已发给对方（这一页不连守护进程）');break;
    case 'stop1': toast('已向「'+N(id).title+'」发出中断：只停当前回合，会话保留');break;
    case 'stop2': toast('已请求结束「'+N(id).title+'」：它下面的子会话不受影响');break;
    case 'brake': openBrake(id);break;
    case 'brake-go':
      if(brakeArm&&brakeArm.id===id&&Date.now()<brakeArm.until){doBrake(id);return;}
      brakeArm={id:id,until:Date.now()+3000};el.classList.add('armed');el.textContent='3 秒内再点一次';
      setTimeout(function(){if(brakeArm&&brakeArm.id===id&&Date.now()>=brakeArm.until){brakeArm=null;var b=$('#brakeGo');if(b){b.classList.remove('armed');b.textContent='刹车';}}},3050);
      break;
    case 'brake-go2': doBrake(id);break;
    case 'mode': setMode(el.getAttribute('data-v'));break;
    case 'mode-n': setMode(mode==='rich'?'sparse':'rich');break;
    case 'pause': if(paused){clockBase=pausedAt;clockStart=Date.now();paused=false;}else{pausedAt=now();paused=true;}$('#pauseBtn').textContent=paused?'继续时钟':'暂停时钟';break;
    case 'theme': toggleTheme();break;
    case 'qtoggle': $('#queue').classList.toggle('open');renderQueue();break;
    case 'about': openAbout();break;
  }
}
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.hasAttribute('data-typed')){var id=t.getAttribute('data-typed'),a=findAtt(id);typed[id]=t.value;
    $$('[data-typed="'+id+'"]').forEach(function(x){if(x!==t)x.value=t.value;});
    $$('[data-yes="'+id+'"]').forEach(function(b){b.disabled=t.value.trim()!==needOf(a);});}
  if(t.id==='dsFind'){ds.q=t.value;var sel=$('#dsParent');if(sel)sel.innerHTML=parentOpts();}
  if(t.id==='brakeTyped'){var b=$('#brakeGo2'),n=N(b.getAttribute('data-id'));b.disabled=t.value.trim()!==n.title;}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='lastSeen'){lastSeen=+t.value;renderAll();}
  if(t.id==='dsParent'){ds.text=$('#dsText').value;ds.parent=t.value;renderDispatch();}
  if(t.id==='dsProj'){ds.project=t.value;}
  if(t.id==='dsHarness'){ds.harness=t.value;}
  if(t.name==='route'){ds.text=$('#dsText').value;ds.route=+t.value;routeToParent();renderDispatch();}
});
document.addEventListener('keydown',function(ev){
  var tag=(ev.target.tagName||'').toLowerCase(),typing=tag==='input'||tag==='textarea'||tag==='select';
  if(ev.key==='Escape'){if($('#sheet').classList.contains('on'))closeSheet();else upOne();return;}
  if(typing)return;
  if(ev.key==='n'||ev.key==='N'){ev.preventDefault();openDispatch();}
  else if(ev.key==='Backspace'||ev.key==='ArrowLeft'){ev.preventDefault();upOne();}
  else if((ev.key===' '||ev.key==='Enter')&&ev.target.hasAttribute&&ev.target.hasAttribute('data-hold')){ev.preventDefault();if(!ev.repeat){holdDone=false;holdStart(ev.target);}}
  else if(ev.key==='Enter'&&ev.target.classList&&ev.target.classList.contains('kid')){
    var t=ev.target;if(t.hasAttribute('data-list'))openList(t.getAttribute('data-list'));else if(t.hasAttribute('data-go'))goTo(t.getAttribute('data-go'));}
});
var rzT;window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(renderLadder,150);});
var qEl=$('#queue');
qEl.addEventListener('mouseenter',function(){queueHover=true;});
qEl.addEventListener('mouseleave',function(){queueHover=false;renderQueue();});

function setMode(m){
  if(m===mode)return;mode=m;D=build(m);path=['g'];selQ=null;typed={};repOpen={};
  $$('[data-act="mode"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===m));});
  renderAll();toast(m==='sparse'?'贫瘠态：今天真实数据的形状，大多数 subagent 状态未知（本页操作已重置）':'丰富态（本页操作已重置）');
}
function curDark(){var t=document.documentElement.getAttribute('data-theme');if(t)return t==='dark';return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;}
function toggleTheme(){var d=!curDark();document.documentElement.setAttribute('data-theme',d?'dark':'light');try{localStorage.setItem('ladder-theme',d?'dark':'light');}catch(e){}syncThemeBtn();}
function syncThemeBtn(){$('#themeBtn').textContent=curDark()?'浅色':'深色';}
try{var sv=localStorage.getItem('ladder-theme');if(sv)document.documentElement.setAttribute('data-theme',sv);}catch(e){}
syncThemeBtn();

/* ---------- 每秒：倒计时、超时即拒 ---------- */
function tick(){
  var t=now();$('#clock').textContent=hms(t)+(paused?'（已暂停）':'');
  $$('[data-dl]').forEach(function(s){var left=+s.getAttribute('data-dl')-t;s.textContent=mmss(left);if(s.classList.contains('tl'))s.classList.toggle('soon',left<5*60e3);});
  $$('[data-ago]').forEach(function(s){s.textContent=ago(t-+s.getAttribute('data-ago'));});
  var exp=openAtt().filter(function(a){return a.deadline&&T(a.deadline)<=t;});
  if(exp.length){exp.forEach(function(a){resolve(a,'expired');});toast('超时自动拒：'+exp.map(function(a){return N(a.nodeId).title;}).join('、'));}
}
/* 地址里的 #theme=dark / #mode=sparse / #go=<节点> 方便直接打开某个画面 */
(function(){var h=location.hash||'',m;
  if((m=h.match(/theme=(light|dark)/))){document.documentElement.setAttribute('data-theme',m[1]);syncThemeBtn();}
  if(/mode=sparse/.test(h)){mode='sparse';D=build('sparse');$$('[data-act="mode"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-v')==='sparse'));});}
  if((m=h.match(/go=([\w.:-]+)/)))goTo(decodeURIComponent(m[1]),{silent:true});
})();
renderAll();tick();setInterval(tick,1000);
window.__ladder={D:function(){return D;},goTo:goTo,renderAll:renderAll,openList:openList,openDispatch:openDispatch,applyDraft:applyDraft,renderDispatch:renderDispatch,doDispatch:doDispatch,ds:function(){return ds;},
  openBrake:openBrake,doBrake:doBrake,resolve:resolve,seatDispatch:seatDispatch,setMode:setMode,openConvo:openConvo,openAbout:openAbout,tick:tick,lists:function(){return REGS;},cuts:function(){return CUTS;},path:function(){return path;}};
})();
</script>
