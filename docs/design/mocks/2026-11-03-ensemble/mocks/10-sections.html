<!--
方案 10「声部席位图」：乐团舞台俯视图。指挥台 = 你；台前谱架 = 唯一的等你队列；每个扇区 = 一个声部 = 一条工作线
（领头和它派出的全部会话）；同心弧 = 层级，第 1 层离你最近，第 5 层在最外圈。
回答的原则：P2 谱架就是那一个按截止排序的队列，舞台上每个等你的席位拉一条琥珀线到指挥台，处理一处两处同时消失；
  P3 第 5 层的事也直连指挥台，单子带整条来路；P5 合作画在线上：实线箭头派出、点线带小方块回报、琥珀虚线等你、
  红色断线 = 上级已出错、回报没人接收；P8 实 / ≈ / 未知三种席位画法；P6 选中任一席位，整条祖先链加粗标名；
  P1 扇区按工作线分，每格席位有上限，多出来的坐「×n」长凳；主会话超过 9 条时按曲目折成「×n 主会话」。
主动放弃：
  - 按工种分扇区（上一版的做法）：它把一条工作线拆散到整个舞台，今天的真实数据里也没有工种字段。
    工种只写在座位卡里，颜色预算留给等你和出错。
  - 工作线进度「n/m 已验证」：剧本没有复核记录，不编数字。
  - 常驻的全量连线：父子关系只画 0.6px 的淡线；舞台只画最近 30 分钟的派出和回报，各最多 8 条。
最大风险：扇区宽度随数据变，新派出一条工作线，其余扇区都会挪一点；贫瘠态里 109 个子代理状态未知，
  大多坐在长凳上，只靠长凳角上的斜纹小点和点开后的分项提示，可能被忽略。
窄屏（< 760 px）降级为「等你列表 + 缩小的舞台 + 详情在下」。
-->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>声部席位图</title>
<style>
:root{
  --bg:#E4E8EC; --stage:#F5F6F4; --stage-2:#EBEEF0; --ink:#1B2333; --ink-2:#596376; --ink-3:#8C95A4;
  --line:#C6CDD5; --brass:#A9720C; --brass-soft:#F4E4BE; --crimson:#B4232F; --crimson-soft:#F6DADC;
  --deleg:#2F63B0; --on-deleg:#FFFFFF; --report:#23786A; --spot:rgba(255,236,190,.55); --tree:#8C95A4;
  --p-shop:#5363A8; --p-paper:#2E7D6C; --p-dshplug:#86508F; --p-orch:#8A6A2E; --p-notes:#6B7280;
  --panel:#FBFBFA; --shadow:0 1px 0 rgba(27,35,51,.06), 0 8px 24px -16px rgba(27,35,51,.35);
  --sans:"Microsoft YaHei UI","PingFang SC","Segoe UI Variable",system-ui,sans-serif;
  --serif:"Songti SC","STSong","SimSun","Noto Serif SC","Source Han Serif SC",serif;
  --mono:"Cascadia Mono",Consolas,monospace;
  --pw:380px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141D; --stage:#182032; --stage-2:#1D2639; --ink:#E4E7ED; --ink-2:#9EA7B7; --ink-3:#6C7588;
    --line:#2F3950; --brass:#E5AC3E; --brass-soft:#3A2E16; --crimson:#F06571; --crimson-soft:#3C1D24;
    --deleg:#82A9EA; --on-deleg:#0E1525; --report:#5EC3AA; --spot:rgba(255,214,140,.10); --tree:#7A849A;
    --p-shop:#97A6EA; --p-paper:#6FC7B2; --p-dshplug:#CA95D3; --p-orch:#D2B072; --p-notes:#A3AAB8;
    --panel:#151C2B; --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#10141D; --stage:#182032; --stage-2:#1D2639; --ink:#E4E7ED; --ink-2:#9EA7B7; --ink-3:#6C7588;
  --line:#2F3950; --brass:#E5AC3E; --brass-soft:#3A2E16; --crimson:#F06571; --crimson-soft:#3C1D24;
  --deleg:#82A9EA; --on-deleg:#0E1525; --report:#5EC3AA; --spot:rgba(255,214,140,.10); --tree:#7A849A;
  --p-shop:#97A6EA; --p-paper:#6FC7B2; --p-dshplug:#CA95D3; --p-orch:#D2B072; --p-notes:#A3AAB8;
  --panel:#151C2B; --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);overflow-x:hidden;
  height:100vh;min-height:600px;display:grid;grid-template-rows:auto minmax(0,1fr)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--deleg);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}

/* 顶栏：只放曲目、数据态和时钟；一行放得下 */
.bar{display:flex;align-items:center;gap:6px 16px;padding:18px 20px 8px;position:relative;flex-wrap:wrap}
.brand{font:600 19px/1 var(--serif);letter-spacing:.06em;white-space:nowrap}
.programs{display:flex;gap:2px;align-items:flex-end;min-width:0;flex-wrap:wrap}
.prog{border:0;background:none;padding:6px 9px 5px;border-bottom:2px solid transparent;color:var(--ink-2);font-family:var(--serif);font-size:14px;white-space:nowrap;max-width:14em;overflow:hidden;text-overflow:ellipsis}
.prog[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.prog .n{font-family:var(--sans);font-size:11.5px;margin-left:4px;color:var(--brass);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{border:0;background:none;padding:2px 9px;font-size:12.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tools{display:flex;gap:6px;align-items:center;margin-left:auto}
.ghost{border:1px solid var(--line);background:none;border-radius:3px;padding:2px 8px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.clock{font:600 14px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.mark{position:absolute;top:2px;right:12px;font-size:11px;color:var(--ink-3);display:flex;gap:8px}
.mark a{color:var(--ink-2)}

/* 主体 */
.layout{display:grid;grid-template-columns:minmax(0,1fr) var(--pw);min-height:0;position:relative}
.hall{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0;position:relative}
.hall-top{display:flex;align-items:center;gap:6px 10px;padding:4px 16px 0;flex-wrap:wrap;min-height:30px;position:relative;z-index:6}
.since{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.since select{border:1px solid var(--line);background:var(--panel);border-radius:3px;color:var(--ink-2);padding:1px 2px;font-size:12.5px}
.chip{border:1px solid var(--line);background:var(--stage);border-radius:3px;padding:1px 8px;font-size:12.5px;white-space:nowrap}
.chip b{font-weight:600;margin-right:3px}
.chip.err b{color:var(--crimson)}
.hall-tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.pop{position:relative}
.pop > summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:3px;padding:1px 8px;font-size:12.5px;color:var(--ink-2);background:var(--stage)}
.pop > summary::-webkit-details-marker{display:none}
.pop[open] > summary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.pop .body{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:12px 14px;z-index:30;max-height:70vh;overflow:auto;font-size:12.5px;color:var(--ink-2)}
.legend-grid{display:grid;grid-template-columns:34px 1fr;gap:4px 8px;align-items:center;width:300px}
.notes{width:min(520px,90vw);line-height:1.6}
.notes h4{font:600 13.5px var(--serif);color:var(--ink);margin:12px 0 4px}
.notes h4:first-child{margin-top:0}
.notes table{border-collapse:collapse;width:100%}
.notes td{border-top:1px solid var(--line);padding:3px 6px 3px 0;vertical-align:top}
.notes td:first-child{white-space:nowrap;color:var(--ink);padding-right:12px}
.notes ol,.notes ul{margin:0;padding-left:18px}
.notes li{margin:2px 0}
.drawer-tab{display:none}

.stage-wrap{position:relative;min-height:0;overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none}
.ov{position:absolute;inset:0;pointer-events:none}
.ov .lb{position:absolute;white-space:nowrap;pointer-events:auto;font-size:12px;line-height:1.3;color:var(--ink-2)}
.lb.seatl{font-size:12px;color:var(--ink);text-shadow:0 0 3px var(--stage),0 0 3px var(--stage),0 0 2px var(--stage);pointer-events:none}
.lb.seatl.chain{font-weight:600}
.lb.seatl.dim{opacity:.4}
.lb.secl{text-align:center;max-width:180px}
.lb.secl .nm{display:block;border:0;background:none;padding:0;font:600 13.5px/1.25 var(--serif);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.lb.secl .ct{border:0;background:none;padding:0;font-size:11.5px;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.lb.secl .bar-p{display:inline-block;width:10px;height:3px;vertical-align:middle;margin-right:4px}
.lb.ringl{font-size:11px;color:var(--ink-3);pointer-events:none}
.lb.foldl{font-size:11.5px;color:var(--ink-2);pointer-events:none}
.lb.capt{font-size:12px;color:var(--ink-3);white-space:normal;max-width:380px;pointer-events:auto}
.lb.capt button{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px;font-size:12px}
.waitn{border:0;background:none;padding:2px 4px;font-size:13px;color:var(--brass);font-weight:600}
.waitn.none{color:var(--ink-3);font-weight:400}
.dispatch{border:0;border-radius:999px;background:var(--deleg);color:var(--on-deleg);padding:6px 16px;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.dispatch kbd{border-color:currentColor;margin-left:6px}

/* SVG */
.sector{fill:var(--stage)}
.sector.alt{fill:var(--stage-2)}
.sector.fold{fill:none;stroke:var(--line);stroke-dasharray:3 4}
.ring{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:1 5}
.seat{cursor:pointer}
.seat .hit{fill:transparent}
.seat:hover .body,.seat:focus-visible .body{stroke-width:2.6}
.seat:focus{outline:none}
.seat:focus-visible .hit{stroke:var(--deleg);stroke-width:1.5}
.e-tree{stroke:var(--tree);stroke-width:.6;fill:none;opacity:.55}
.e-tree.unk{stroke-dasharray:1 3;opacity:.7}
.e-deleg{stroke:var(--deleg);stroke-width:1.6;fill:none}
.e-report{stroke:var(--report);stroke-width:1.8;fill:none;stroke-dasharray:1.5 4;stroke-linecap:round}
.e-wait{stroke:var(--brass);stroke-width:1.5;fill:none;stroke-dasharray:6 4}
.e-wait.inf{stroke-dasharray:1.5 5;stroke-linecap:round;opacity:.75;stroke-width:1.4}
.e-chain{stroke:var(--ink);stroke-width:2.6;fill:none;opacity:.85}
.e-claim{stroke:var(--crimson);stroke-width:1.3;fill:none;stroke-dasharray:2 3}
.e-broken{stroke:var(--crimson);stroke-width:1.6;fill:none}
.live{stroke-dasharray:10 7;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-34}}
.no-motion .live{animation:none}
@media (prefers-reduced-motion:reduce){.live{animation:none}}
.bench rect{fill:var(--panel);stroke:var(--ink-3);stroke-width:1}
.bench text{font:600 11.5px var(--sans);fill:var(--ink-2)}
.podium-t{font:700 17px var(--serif)}
.dim{opacity:.32}

/* 谱架（等你的事） */
.stand{position:relative;padding:14px 16px 14px;display:flex;gap:10px;align-items:stretch;border-top:1px solid var(--line)}
.stand::before{content:"";position:absolute;left:8%;right:8%;top:-2px;height:3px;border-radius:2px;background:var(--ink-3);opacity:.5}
.stand-h{flex:0 0 auto;align-self:center;font-size:13px;color:var(--ink-2);width:78px;line-height:1.35}
.stand-h b{display:block;font:700 22px/1.1 var(--serif);color:var(--brass)}
.stand-h b.none{color:var(--ink-3)}
.sheet{flex:1 1 140px;min-width:0;max-width:210px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:2px 2px 6px 6px;padding:8px 10px 9px;box-shadow:var(--shadow);position:relative;min-height:112px;display:flex;flex-direction:column;gap:3px}
.sheet[aria-current="true"]{outline:2px solid var(--ink)}
.sheet .cd{font:700 20px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.sheet .cd small{font:12px var(--sans);color:var(--ink-2);margin-left:4px}
.sheet .kind{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .ask{font-size:12.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sheet .route{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet.hot{border-color:var(--brass);background:linear-gradient(var(--brass-soft),var(--panel) 46%)}
.sheet.urgent .cd{color:var(--crimson)}
.sheet.inferred{border-style:dashed;box-shadow:none;background:none}
.sheet .seal{align-self:flex-start;font-size:11px;line-height:1.4;color:var(--crimson);border:1px solid var(--crimson);border-radius:2px;padding:0 4px;margin-bottom:1px}
.more{flex:0 0 auto;align-self:center;border:1px dashed var(--ink-3);background:none;border-radius:3px;padding:10px 12px;color:var(--ink);font-weight:600}
.empty-stand{color:var(--ink-2);font-size:13px;padding:24px 0;align-self:center}

/* 右侧面板 */
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:18px 20px 40px;min-height:0}
.panel .close{display:none;float:right;border:1px solid var(--line);background:none;border-radius:3px;padding:1px 8px;font-size:12.5px;color:var(--ink-2)}
.panel h2{font:600 19px/1.3 var(--serif);margin:0 0 4px}
.panel h3{font:600 13.5px var(--sans);margin:18px 0 6px;color:var(--ink-2)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:1px 0;flex-wrap:wrap}
.conf{font-size:11px;border:1px solid var(--line);border-radius:2px;padding:0 4px;color:var(--ink-2)}
.conf.unk{border-style:dotted}
.conf.inf{border-style:dashed;color:var(--brass);border-color:var(--brass)}
.chain{list-style:none;margin:0;padding:0;position:relative}
.chain li{position:relative;padding:2px 0 2px 18px;font-size:13px}
.chain li::before{content:"";position:absolute;left:5px;top:0;bottom:0;border-left:1px solid var(--line)}
.chain li::after{content:"";position:absolute;left:2px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.chain li.cur{font-weight:600}
.chain li.cur::after{background:var(--ink)}
.chain li.gap::after{background:none;border:1px dotted var(--ink-3)}
.chain li:first-child::before{top:10px}
.chain li:last-child::before{bottom:calc(100% - 10px)}
.linkish{border:0;background:none;padding:0;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;text-align:left}
.wait{border-left:3px solid var(--ink-3);padding:6px 10px;background:var(--stage-2);font-size:13.5px}
.wait.you{border-color:var(--brass);background:var(--brass-soft)}
.wait.err{border-color:var(--crimson);background:var(--crimson-soft)}
.report{border:1px solid var(--line);padding:10px 12px;font-size:13px;background:var(--panel)}
.report .st{font-size:12px;color:var(--ink-2)}
.trunc{color:var(--crimson);font-size:12px;margin-top:6px}
.refs{margin:6px 0 0;padding-left:16px;font-family:var(--mono);font-size:12px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:2px 10px;font-size:13px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0}
.verbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--panel);border-radius:3px;padding:6px 14px;font-weight:600;position:relative;overflow:hidden}
.btn.sec{background:none;color:var(--ink);border-color:var(--line);font-weight:400}
.btn.warn{background:var(--crimson);border-color:var(--crimson);color:#fff}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(127,127,127,.35)}
.btn.holding .fill{width:100%;transition:width 1s linear}
.typed{display:block;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.typed input{display:block;width:100%;margin-top:4px;padding:6px 8px;border:1px solid var(--crimson);background:var(--panel);border-radius:3px;font-family:var(--mono)}
.note{font-size:12.5px;color:var(--ink-2);margin-top:8px}
.ro{border:1px dashed var(--line);padding:8px 10px;font-size:13px;color:var(--ink-2)}
.cmd{font-family:var(--mono);font-size:13px;background:var(--stage-2);padding:8px 10px;border-radius:3px;word-break:break-all}
.rows{list-style:none;padding:0;margin:0}
.rows li{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.rows li .t{font:12px var(--mono);color:var(--ink-3);flex:0 0 40px}
.rows li .s{margin-left:auto;font-size:12px;color:var(--ink-2);white-space:nowrap}
.rows li.grp{border-bottom:0;padding-top:12px;font-weight:600;font-family:var(--serif)}
.progrow{padding:10px 0;border-bottom:1px solid var(--line)}
.progrow .pn{font:600 15px var(--serif)}
.counts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;margin-top:4px}
.counts button{border:0;background:none;padding:0;color:var(--ink-2)}
.counts button b{color:var(--ink);font-weight:600;margin-right:2px}
.counts button.e b{color:var(--crimson)}
.counts button.w b{color:var(--brass)}
.unread{border:1px dotted var(--ink-3);padding:8px 10px;font-size:13px;margin-top:10px;color:var(--ink-2)}
.unread b{color:var(--ink)}
textarea,select.inp,input.inp{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:7px 9px}
select.inp:disabled{opacity:.7}
textarea{min-height:76px;resize:vertical}
.draft{border:1px solid var(--line);padding:8px 10px;margin-top:6px;font-size:12.5px;text-align:left;background:none;width:100%}
.draft:hover{border-color:var(--ink-3)}
.rule{font-size:12px;color:var(--ink-2);margin-top:3px}
.back{border:0;background:none;color:var(--ink-2);padding:0;margin-bottom:10px;font-size:12.5px}
.quote{border-left:2px solid var(--line);padding:2px 0 2px 10px;color:var(--ink-2);font-size:13px;margin:6px 0}
.quote cite{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3)}

/* 对话页 */
.convo{position:absolute;top:0;bottom:0;left:0;right:var(--pw);background:var(--stage);z-index:15;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.convo[hidden]{display:none}
.convo header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.convo .log{flex:1;overflow-y:auto;padding:16px 20px;max-width:760px}
.convo .msg{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.convo footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px}
.convo footer input{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:8px}

.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:3px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.toast.on{opacity:1}
kbd{font:11px var(--mono);border:1px solid currentColor;border-radius:2px;padding:0 3px;opacity:.75}

/* 1280 以下：右栏收成抽屉 */
@media (max-width:1279px){
  .layout{grid-template-columns:minmax(0,1fr)}

/* ---------- 工具 ---------- */

/* ---------- 几何 ---------- */

// 扇区 = 工作线（领头和它派出的全部会话）。扇区里用径向树排：子会话落在父会话的方位附近。

    var allMem = [].concat.apply([], groups.map(function(g){ return g.members; }));

  }
  var total = sectors.reduce(function(s, x){ return s + x.need; }, 0) + GAP * Math.max(0, sectors.length - 1);
  var k = Math.min(1.8, SWEEP / total), gapDeg = (SWEEP - sectors.reduce(function(s, x){ return s + x.need * k; }, 0)) / Math.max(1, sectors.length - 1) * 180 / Math.PI;

  if (selected && byId[selected]) [byId[selected]].concat(ancestors(byId[selected])).forEach(function(x){ chain[x.id] = 1; });
  function prio(n){ return chain[n.id] ? 0 : itemFor(n.id) ? 1 : n.state === "error" ? 2 : n._new ? 3 : (byId[n.parent] && byId[n.parent].state === "error") ? 4 : n.ownership === "owned" ? 5 : n.state === "running" ? 6 : n.state === "reported" ? 7 : 9; }

        benches.push(b);
        g.members.forEach(function(m){ pos[m.id] = {x: b.x, y: b.y, d: m.depth, bench: b.id}; });
      });
      return;
    }
    // 理想方位：按子树大小分角度区间（径向树）
    var ideal = {};
    (function assign(n, lo, hi){
      ideal[n.id] = (lo + hi) / 2;
      var kids = (n.children || []).map(function(c){ return byId[c]; }).filter(function(c){ return c && visSet[c.id]; });
      var leaves = function(x){ var ks = (x.children || []).map(function(c){ return byId[c]; }).filter(Boolean); return ks.length ? ks.reduce(function(t, y){ return t + leaves(y); }, 0) : 1; };
      var tot = kids.reduce(function(t, c){ return t + leaves(c); }, 0), cur = hi;

    Object.keys(s.byD).forEach(function(dk){
      var d = +dk, r = R(d), list = s.byD[d].slice().sort(function(x, y){ return ideal[y.id] - ideal[x.id]; });
      var minSep = SP / r * 180 / Math.PI, capR = Math.max(1, Math.floor((s.a0 - s.a1) / minSep));
      var shown = list, folded = [];
      if (list.length > capR) {
        var rk = list.slice().sort(function(x, y){ return prio(x) - prio(y) || ideal[y.id] - ideal[x.id]; });
        var ks = {}; rk.slice(0, Math.max(0, capR - 1)).forEach(function(x){ ks[x.id] = 1; });
        shown = list.filter(function(x){ return ks[x.id]; }); folded = list.filter(function(x){ return !ks[x.id]; });

      items.sort(function(x, y){ return y.ang - x.ang; });

      items.forEach(function(it){

}

/* ---------- 席位画法 ---------- */
function circ(x, y, r, attrs){ return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(1) + '" ' + attrs + '/>'; }

  var s = n.state, c = conf(n), g = "";

  if (itemFor(n.id) && c !== "inf") g += circ(x, y, r + 7.5, 'fill="none" stroke="var(--brass)" stroke-width="1.6"');

      '<rect x="' + (x - 1.1).toFixed(1) + '" y="' + (y - r * .55).toFixed(1) + '" width="2.2" height="' + (r * .62).toFixed(1) + '" fill="#fff"/>' + circ(x, y + r * .42, 1.3, 'fill="#fff"');
  } else if (c === "inf" && s === "waiting") {
    body = circ(x, y, r, 'class="body" fill="var(--stage)" stroke="var(--brass)" stroke-width="1.6" stroke-dasharray="3 2.4"') +
      '<text x="' + x.toFixed(1) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="middle" font-size="' + (r + 2) + '" fill="var(--brass)">≈</text>';
  } else if (c === "inf") {
    body = circ(x, y, r, 'class="body" fill="var(--stage)" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="3 2.4"') +
      '<text x="' + x.toFixed(1) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="middle" font-size="' + (r + 2) + '" fill="var(--ink)">≈</text>';
  } else if (s === "waiting") {
    body = circ(x, y, r, 'class="body" fill="var(--brass)" stroke="var(--brass)" stroke-width="1.5"');
  } else if (s === "running") {
    body = circ(x, y, r, 'class="body" fill="var(--ink)" stroke="var(--ink)" stroke-width="1.5"');
  } else if (s === "unknown") {
    body = circ(x, y, r, 'class="body" fill="url(#hatch)" stroke="var(--ink-2)" stroke-width="1.3" stroke-dasharray="1 2.6" stroke-linecap="round"') +
      '<text x="' + x.toFixed(1) + '" y="' + (y + 3.6).toFixed(1) + '" text-anchor="middle" font-size="' + Math.max(9, r) + '" font-weight="700" fill="var(--ink-2)">?</text>';

      '<rect x="' + (x - r * .42).toFixed(1) + '" y="' + (y - r * .42).toFixed(1) + '" width="' + (r * .84).toFixed(1) + '" height="' + (r * .84).toFixed(1) + '" fill="var(--report)"/>';

      '<line x1="' + (x - q).toFixed(1) + '" y1="' + (y + q).toFixed(1) + '" x2="' + (x + q).toFixed(1) + '" y2="' + (y - q).toFixed(1) + '" stroke="var(--ink-2)" stroke-width="1.5"/>';

      '<line x1="' + (x - r * .6).toFixed(1) + '" y1="' + (y - 1).toFixed(1) + '" x2="' + (x + r * .6).toFixed(1) + '" y2="' + (y - 1).toFixed(1) + '" stroke="var(--ink-3)" stroke-width="1"/>' +
      '<rect x="' + (x - r * .4).toFixed(1) + '" y="' + (y - 1).toFixed(1) + '" width="' + (r * .8).toFixed(1) + '" height="' + (r * .35).toFixed(1) + '" fill="var(--ink-3)"/>';

function curve(a, b, bend){
  var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y;

function placeLabels(list, obstacles){
  var ov = $("ov"), wrap = $("stageWrap"), svg = $("stage");
  var sr = svg.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
  var s = sr.width ? Math.min(sr.width / VB.w, sr.height / VB.h) : 1;
  var ox = sr.left - wr.left + (sr.width - VB.w * s) / 2, oy = sr.top - wr.top + (sr.height - VB.h * s);
  ov.innerHTML = list.map(function(l, i){
    return '<div class="lb ' + (l.cls || "") + '" data-i="' + i + '"' + (l.title ? ' title="' + esc(l.title) + '"' : '') + (l.aria === false ? ' aria-hidden="true"' : '') + (l.maxw ? ' style="max-width:' + Math.round(l.maxw) + 'px"' : '') + '>' + l.html + '</div>';
  }).join("");
  var els = ov.children, placed = [];
  function setPos(el, l, c){
    var x = ox + (l.x - VB.x) * s, y = oy + (l.y - VB.y) * s, off = (l.off || 0) * s + 3, tf;
    switch (c) {
      case "top": y -= off; tf = "translate(-50%,-100%)"; break;
      case "bot": y += off; tf = "translate(-50%,0)"; break;
      case "right": x += off; tf = "translate(0,-50%)"; break;
      case "left": x -= off; tf = "translate(-100%,-50%)"; break;
      case "end": tf = "translate(-100%,-50%)"; break;
      case "start": tf = "translate(0,-50%)"; break;
      case "bl": tf = "translate(0,-100%)"; x = 8; break;
      case "radial": var a = l.ang * Math.PI / 180; tf = "translate(" + (-50 + 50 * Math.cos(a)).toFixed(1) + "%," + (-50 - 50 * Math.sin(a)).toFixed(1) + "%)"; break;
      default: tf = "translate(-50%,-50%)";
    }
    el.style.left = x + "px"; el.style.top = y + "px"; el.style.transform = tf;
    var r = el.getBoundingClientRect();
    if (r.left < wr.left + 2) el.style.left = (x + wr.left + 2 - r.left) + "px";
    else if (r.right > wr.right - 2) el.style.left = (x - (r.right - wr.right + 2)) + "px";
    if (r.top < wr.top + 2) el.style.top = (y + wr.top + 2 - r.top) + "px";
  }
  // 标签不压别的标签，也不压别的席位
  var obs = (obstacles || []).map(function(o){ var cx = wr.left + ox + (o.x - VB.x) * s, cy = wr.top + oy + (o.y - VB.y) * s, rr = o.r * s; return {left: cx - rr, right: cx + rr, top: cy - rr, bottom: cy + rr, id: o.id}; });
  function over(r, p, pad){ return r.left < p.right + pad && r.right > p.left - pad && r.top < p.bottom + 1 && r.bottom > p.top - 1; }
  function hits(r, own){
    for (var i = 0; i < placed.length; i++) if (over(r, placed[i], 2)) return true;
    for (var j = 0; j < obs.length; j++) if (obs[j].id !== own && over(r, obs[j], 0)) return true;
    return false;
  }
  var order = list.map(function(l, i){ return i; }).sort(function(a, b){ return list[a].prio - list[b].prio; });
  order.forEach(function(i){
    var l = list[i], el = els[i], cands = l.cands || [l.c], ok = false;
    for (var c = 0; c < cands.length; c++) {
      setPos(el, l, cands[c]);
      if (cands.length === 1 && l.prio <= 0) { ok = true; break; }
      if (!hits(el.getBoundingClientRect(), l.own)) { ok = true; break; }
    }
    if (!ok && l.prio <= 0) { setPos(el, l, cands[0]); ok = true; }
    if (!ok) { el.style.visibility = "hidden"; return; }
    placed.push(el.getBoundingClientRect());
  });
}

function currentOrder(){ return sortQueue(queue).map(function(q){ return q.id; }); }
function standFit(){
  if (isNarrow()) return 6;

function sheetCd(it){ var rem = remaining(it); return rem == null ? "无期限" : mss(rem) + "<small>后自动拒</small>"; }
function renderStand(){
  var ids = frozen && standOrder.length ? standOrder.filter(function(id){ return queue.some(function(q){ return q.id === id; }); }).concat(currentOrder().filter(function(id){ return standOrder.indexOf(id) < 0; })) : currentOrder();
  standOrder = ids;
  var order = ids.map(function(id){ return queue.filter(function(q){ return q.id === id; })[0]; });
  var fit = standFit(), shown = order, rest = [];
  if (order.length > fit) { shown = order.slice(0, Math.max(1, fit - 1)); rest = order.slice(shown.length); }
  var h = ['<div class="stand-h"><b class="' + (queue.length ? "" : "none") + '">' + queue.length + '</b>件等你<br><span class="faint" style="font-size:11.5px">按离自动拒排</span></div>'];

    var route = routeOf(it);

      '<span class="ask">' + esc(it.ask.replace(/^运行命令：|^写文件：/, "")) + '</span>' +
      '<span class="route" title="' + esc(route.full) + '">' + esc(route.short) + '</span></button>');
  });

  $("stand").innerHTML = h.join("");

function routeOf(it){
  var n = byId[it.nodeId];

function waitLine(n){
  var it = itemFor(n.id), d = n.stateDetail || {}, kids = (n.children || []).map(function(c){ return byId[c]; }).filter(Boolean);
  var par = byId[n.parent];
  if (it && conf(n) === "inf") return '<div class="wait you">≈ 可能在等你（推测，不是正式请求）：' + esc(d.why || it.why || "") + '</div>';
  if (it) return '<div class="wait you">等你：' + esc(it.ask) + (it.deadline ? '，剩 <span data-cd-plain="' + it.id + '">' + mss(remaining(it)) + '</span> 自动拒' : '') + ' <button class="linkish" data-act="item" data-id="' + it.id + '">去谱架处理</button></div>';
  if (n.state === "error") {
    var sib = par ? (par.children || []).map(function(c){ return byId[c]; }).filter(function(x){ return x && x.id !== n.id; }) : [];
    var runKids = kids.filter(function(k){ return k.state === "running" || k.state === "unknown"; });
    var extraT = "";
    if (runKids.length) extraT += '<br>它派出的 ' + runKids.map(function(k){ return '<button class="linkish" data-act="seat" data-id="' + k.id + '">' + esc(short(k)) + '</button>（' + esc(stateText(k)) + '）'; }).join("、") + '；上级已退出，它们的回报没人接收。';
    if (sib.length) extraT += '<br>同一上级派出的兄弟：' + sib.map(function(k){ return '<button class="linkish" data-act="seat" data-id="' + k.id + '">' + esc(short(k)) + '</button>（' + stateText(k) + '）'; }).join("、") + '。';
    if (n.brakeNote) extraT += '<br>' + esc(n.brakeNote);
    return '<div class="wait err">出错：' + esc(d.error) + (d.exitCode != null ? '（退出码 ' + d.exitCode + '）' : '') + extraT + '</div>';
  }
  if (par && par.state === "error" && (n.state === "running" || n.state === "unknown")) return '<div class="wait err">' + esc(stateText(n)) + '，但派它的「' + esc(short(par)) + '」已出错退出：它的回报没人接收。</div>';

// 预览和执行共用同一个过滤：刹车只改还没停的；出错、已回报、已结束、已刹住的不改状态
var STOPPABLE = ["running", "waiting", "unknown", "idle"];
function brakePlan(n){
  var all = [n].concat(subtree(n));
  return {stop: all.filter(function(k){ return STOPPABLE.indexOf(k.state) >= 0; }), keep: all.filter(function(k){ return STOPPABLE.indexOf(k.state) < 0; })};
}
function renderBrake(id){

  }
  if (!plan.stop.length) { h.push('<p class="note">这棵树里没有还在跑或状态未知的会话，刹车不会改任何东西。</p>'); return h.join(""); }

function resolve(it, text){
  queue = queue.filter(function(q){ return q !== it; });
  changed();
  log.push({t: new Date(sim).toISOString(), type: "decision", node: it.nodeId, text: text});
}
// 处理完以后，不替守护进程编状态：先记成「≈ 可能在跑」，等守护进程下一次报状态
function afterDecision(n, what){
  if (!n) return;
  n.state = "running";
  n.stateDetail = {kind: "after-decision", inferred: true, why: what + "；守护进程还没报它的新状态，这里是推测"};
}
function decide(id, yes){
  var it = queue.filter(function(q){ return q.id === id; })[0]; if (!it) return;
  if (Date.now() - lastQueueChange < 750) { toast("谱架刚变过，再确认一次"); return; }
  var n = byId[it.nodeId], t = hm(sim);
  if (it.kind === "seat") {
    if (yes) {
      var task = (it.ask.match(/「([^」]+)」/) || [])[1] || it.ask;
      var nn = addNode({parent: n.id, harness: "codex", role: "test", text: task});
      resolve(it, "你派出了 " + short(n) + " 请求的 Codex 会话");
      afterDecision(n, "你在 " + t + " 派出了它请求的会话");
      selected = nn.id; setView({kind: "seat", id: nn.id});
      toast("已派出：新席位坐在「" + short(n) + "」下面");
    } else {
      resolve(it, "你拒绝了 " + short(n) + " 的派会话请求");
      afterDecision(n, "你在 " + t + " 拒绝了它的派会话请求");
      selected = n.id; setView({kind: "seat", id: n.id});
      toast("已拒绝派会话请求");
    }
  } else {
    resolve(it, (yes ? "你批准了 " : "你拒绝了 ") + short(n) + "：" + it.ask);
    afterDecision(n, "你在 " + t + (yes ? " 批准了" : " 拒绝了") + "它的请求");
    selected = n.id; setView({kind: "seat", id: n.id});
    toast(yes ? "已批准；等守护进程报它的新状态" : "已拒绝；它会在这一回合里收到拒绝");

function addNode(o){

  var n = {id: id, parent: o.parent, depth: depth, project: par ? par.project : o.project, harness: o.harness, ownership: "owned", role: o.role || null, model: null,
    title: title, task: o.text, state: "running", spawnedAt: new Date(sim).toISOString(), messages: 0, tokens: 0, costUsd: 0, children: [], stateDetail: null, report: null, link: "registered", _new: true};
  nodes.push(n); byId[id] = n; if (par) par.children.push(id);
  log.push({t: new Date(sim).toISOString(), type: "delegate", from: o.parent, to: id, task: o.text, via: "orchestra", id: "ev-" + id});

function brake(id){
  var n = byId[id], plan = brakePlan(n), t = hm(sim);

  queue.filter(function(it){ return plan.stop.some(function(k){ return k.id === it.nodeId; }); }).forEach(function(it){ resolve(it, "刹车连带撤下：" + it.ask); });
  log.push({t: new Date(sim).toISOString(), type: "brake", node: id, by: "you"});

function endSession(id){
  var n = byId[id]; n.state = "ended"; n.stateDetail = {kind: "ended", why: "你在 " + hm(sim) + " 结束了会话"};
  queue.filter(function(it){ return it.nodeId === id; }).forEach(function(it){ resolve(it, "结束会话连带撤下：" + it.ask); });
  log.push({t: new Date(sim).toISOString(), type: "decision", node: id, text: "你结束了 " + short(n)});

    '<tr><td>谱架</td><td>唯一的等你队列，按离自动拒的远近排；舞台上每个等你的席位拉一条琥珀线到指挥台，和谱架上的单子是同一个对象。</td></tr>' +
    '<tr><td>声部（扇区）</td><td>一条工作线：一个领头和它派出的全部会话。不按工种分。</td></tr>' +
    '<tr><td>同心弧</td><td>层级。第 1 层离你最近，第 5 层最外；深度靠半径，不靠缩进。</td></tr>' +
    '<tr><td>席位</td><td>一个会话。画法 = 状态 + 置信度（实、≈ 推测、未知各一种）。</td></tr>' +
    '<tr><td>底环</td><td>自有会话，可以对它下手；没有底环的是只读。</td></tr>' +
    '<tr><td>长凳 ×n</td><td>一格坐不下的会话；主会话太多时整条工作线也坐长凳。点开就是那张列表。</td></tr>' +
    '<tr><td>线</td><td>派出、回报、等你、断（上级出错）四种，加上常驻的父子淡线。</td></tr></table>' +
    '<h4>重押的原则</h4><ul>' +
    '<li>P2 只有一个等你队列、按截止排：谱架就是它，处理一处两处一起消失。</li>' +
    '<li>P3 再深的事也冒到顶、带来路：第 5 层的 rm -rf 直连指挥台，单子上写整条来路。</li>' +
    '<li>P5 合作画在线上：派出、回报、等你、断各一种线型，不读字也分得开。</li>' +
    '<li>P8 实 / ≈ / 未知三种画法：未知是斜纹问号，不和空心的空闲混。</li>' +
    '<li>P6 一次只完整展开一条祖先链：选中任一席位，从你到它整条加粗标名，其余降到三分之一透明度。</li></ul>' +
    '<h4>主动放弃</h4><ul>' +
    '<li>按工种分扇区（上一版的做法）：会把一条工作线拆散到整个舞台，而且今天的真实数据没有工种字段。工种只写在座位卡里；子代理按 subagent_type 推断，推断不出就写未知。</li>' +
    '<li>工作线进度「n/m 已验证」：剧本里没有复核记录，不编。</li>' +
    '<li>常驻的全量交接线：舞台只画最近 30 分钟，派出和回报各最多 8 条；顶栏切到 3 小时只改计数，不改舞台。</li></ul>' +
    '<h4>十对张力，各站哪边</h4><ol>' +
    '<li>合作可感对安静：偏合作。父子关系常驻但只有 0.6px；交接线只画最近 30 分钟。</li>' +
    '<li>空间对列表：舞台给全局感，扫等你的事靠谱架这一排列表。</li>' +
    '<li>全局对焦点：全局常驻；选中时祖先链加粗，等你的和出错的不降亮度。</li>' +
    '<li>实时对稳定：偏稳定。指针或焦点在谱架上时排序冻结；谱架刚变过 750 毫秒内批准无效。</li>' +
    '<li>丰富对贫瘠：同一套画法；贫瘠态里 26 条主会话只露 9 条，其余按曲目折成长凳，109 个未知子代理大多坐长凳。</li>' +
    '<li>诗意对说人话：主文案是等你、出错、在跑；「声部」「谱架」只在这块说明和图例里。</li>' +
    '<li>深度对宽度：5 层用半径表达，1024 宽也不横向滚动；1280 以下右栏收成抽屉。</li>' +
    '<li>压缩对进对话：自有会话一步「进入对话」；舞台上不放对话文字。</li>' +
    '<li>agent 主动对人是权威：回报写「自述，未经复核」；seat 请求的自称画成红色点线「自称？」。</li>' +
    '<li>只读对自有：自有多一道实色底环；只读的详情里只有只读查看和本机进程刹车（要键入确认）。</li></ol>' +
    '<h4>自己觉得最弱的一点</h4><p style="margin:0">扇区宽度随数据变：新派出一条工作线，其余扇区都会挪一点，空间记忆会漂。深的工作线（复现表 3 有 5 层）和浅的挤在同一个半圆里，浅的扇区显得空。贫瘠态里「哪条折起的线在动」要点开长凳才知道。</p>';
})();

/* ---------- 时钟 ---------- */
function tick(){
  if (paused) return;
  sim += 1000;
  var timedOut = queue.filter(function(it){ return it.deadline && Date.parse(it.deadline) <= sim; });
  timedOut.forEach(function(it){
    queue = queue.filter(function(q){ return q !== it; }); changed();
    log.push({t: new Date(sim).toISOString(), type: "timeout", node: it.nodeId, ask: it.ask});
    afterDecision(byId[it.nodeId], "请求在 " + hm(sim) + " 超时自动拒");
    toast("超时自动拒：" + nameOf(it.nodeId));
  });
  $("clock").textContent = hms(sim);
  if (timedOut.length) { renderAll(); return; }
  // 只改倒计时文字，不重建按钮；排序变了且焦点和指针都不在谱架上时才重画
  Array.prototype.forEach.call(document.querySelectorAll("[data-cd]"), function(el){
    var it = queue.filter(function(q){ return q.id === el.getAttribute("data-cd"); })[0]; if (!it) return;
    el.innerHTML = sheetCd(it);
    var rem = remaining(it), sh = el.closest(".sheet"); if (sh) sh.classList.toggle("urgent", rem != null && rem < 5 * 60e3);
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-cd-plain]"), function(el){
    var it = queue.filter(function(q){ return q.id === el.getAttribute("data-cd-plain"); })[0]; if (it && remaining(it) != null) el.textContent = mss(remaining(it));
  });
  if (!frozen && currentOrder().join() !== standOrder.join()) renderStand();
  if (Math.round((sim - T0) / 1000) % 30 === 0) { renderTop(); renderStage(); }
}

loadWorld();
window.__ensemble = {
  renderAll: renderAll, layout: layout, decide: decide, addNode: addNode, brake: brake, brakePlan: brakePlan, tick: tick,
  state: function(){ return {queue: queue, nodes: nodes, log: log, byId: byId, view: view, LAST: LAST}; },
  setMode: function(m){ mode = m; loadWorld(); program = "all"; selected = null; view = {kind: "overview"}; renderAll(); },
  setPaused: function(p){ paused = p; renderTop(); },
  select: function(id){ selected = id; setView({kind: "seat", id: id}); renderAll(); },
  addMany: function(parent, n, extraProps){ for (var i = 0; i < n; i++) { var x = addNode({parent: parent, harness: "claude", role: null, text: "批量子会话 " + (i + 1)}); x._new = false; x.state = "unknown"; x.ownership = "observed"; for (var k in (extraProps || {})) x[k] = extraProps[k]; } renderAll(); }
};
renderAll();
setInterval(tick, 1000);
})();
</script>
