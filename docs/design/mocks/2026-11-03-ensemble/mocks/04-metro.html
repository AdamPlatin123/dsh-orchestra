<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>线网图</title>
<!--
方案 04：地铁线路图（第二版，按评审改）。
回答的原则：P2 唯一的等你队列做成左侧「发车信息屏」，按剩余时间排；P3 每条带用线路色画的「你→…→该站」来路条，
  同一条在图上亮红信号、沿来路描红线；悬停信息屏的一条，图上那条来路加粗，悬停图上的红站，信息屏滚到那一条。
  P1 只画有事的站及其来路：安静的下级折成「+n」，安静的领头折成项目级「+n 条线」，首屏随等你和出错的数目长。
  P5 合作画在边上：▶ 派活、刻度 = 往来、包裹 = 回报、时间牌 = 最近一次，自你上次看以来累积，并可整段回放。
  P6 选中任一站只亮它那条线，右栏竖排全部祖先；右栏宽度预留好，站位不跳。P8 粗实轨 = 自有、细轨 = 只读、
  虚线 = 推出来的挂接；状态未知画成大问号，不像空闲。P12 时间窗默认从你上次看的时刻算。
主动放弃：P4 的「等另一个 agent」——剧本里没有结构化的等待关系，不编；边上和右栏留了位置，写「没有等待记录」。
  跨线路的乐手互发消息（剧本里没有）也画不了：版式本质上是一棵横向的树。线路颜色按项目，颜色预算留给红信号。
最大风险：等你的事一旦遍布各层，「只看有事的」会退化成一棵横向的树（「全部」视图能看到）；
  一段轨道上要挤下 ▶、刻度、时间牌、包裹，站距小于 100px 时时间牌让位，只能悬停看。
-->
<style>
[hidden]{display:none!important}
:root{
  --bg:#ECEEF0; --surface:#F8F9FA; --ink:#121518; --ink2:#394047; --muted:#6A737C; --hair:#D2D7DC; --hair2:#E2E5E8;
  --station:#FFFFFF; --dead:#B3BAC1; --signal:#D3172D; --signal-soft:rgba(211,23,45,.13);
  --l-shop:#DC8300; --l-paper:#00877A; --l-dshplug:#6849C2; --l-x:#8C949C;
  --board:#0D1013; --board-2:#171c21; --board-ink:#E9ECEF; --board-muted:#8C959E; --board-rule:#242a30; --board-btn:#4a535c;
  --led-dot:rgba(255,255,255,.04);
  --led:#FFC21A; --led-red:#FF4A5C;
  --btn:#121518; --btn-ink:#FFFFFF;
  --f-ui:"Microsoft YaHei UI","PingFang SC","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --f-sign:"Bahnschrift","DIN Alternate","Segoe UI Variable Display","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
  --f-mono:"Cascadia Mono",Consolas,"SFMono-Regular",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E11; --surface:#11151A; --ink:#E6E9EC; --ink2:#C0C6CC; --muted:#8B959F; --hair:#262E36; --hair2:#1B2127;
    --station:#11151A; --dead:#48515A; --signal:#FF4459; --signal-soft:rgba(255,68,89,.17);
    --l-shop:#F4A428; --l-paper:#22B6A4; --l-dshplug:#9C82F2; --l-x:#7A838C;
    --board:#211C17; --board-2:#2B251F; --board-ink:#F1EBE3; --board-muted:#A79C8F; --board-rule:#3A3229; --board-btn:#5f564b;
    --led-dot:rgba(255,194,26,.07);
    --btn:#E6E9EC; --btn-ink:#0B0E11; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E11; --surface:#11151A; --ink:#E6E9EC; --ink2:#C0C6CC; --muted:#8B959F; --hair:#262E36; --hair2:#1B2127;
  --station:#11151A; --dead:#48515A; --signal:#FF4459; --signal-soft:rgba(255,68,89,.17);
  --l-shop:#F4A428; --l-paper:#22B6A4; --l-dshplug:#9C82F2; --l-x:#7A838C;
  --board:#211C17; --board-2:#2B251F; --board-ink:#F1EBE3; --board-muted:#A79C8F; --board-rule:#3A3229; --board-btn:#5f564b;
  --led-dot:rgba(255,194,26,.07);
  --btn:#E6E9EC; --btn-ink:#0B0E11; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.5 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button[disabled]{cursor:not-allowed}
code,.mono{font-family:var(--f-mono);font-size:12px}
a{color:inherit}

/* 顶栏 */
.top{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--hair);background:var(--surface);position:relative}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-sign);font-size:17px;letter-spacing:.01em;white-space:nowrap}
.brand b{font-weight:600}
.brand span{color:var(--muted);font-weight:400}
.dispatch{display:inline-flex;align-items:center;gap:9px;height:34px;padding:0 12px 0 10px;border-radius:17px;border:0;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:14px}
.dispatch:hover{filter:brightness(1.12)}
.dispatch kbd{font-family:var(--f-sign);font-size:11px;padding:0 5px;border-radius:4px;border:1px solid currentColor;opacity:.6}
.top .sp{flex:1}
.iconbtn{height:30px;min-width:30px;padding:0 9px;border-radius:6px;border:1px solid var(--hair);background:transparent;color:var(--ink2);font-size:12px}
.iconbtn:hover{border-color:var(--muted)}
.tag{position:fixed;top:3px;right:10px;font-size:10.5px;color:var(--muted);z-index:60;display:flex;gap:8px;align-items:center}
.tag button{border:0;background:none;padding:0;color:inherit;font-size:inherit;text-decoration:underline dotted}
.top .tools{margin-top:10px;display:flex;gap:6px;align-items:center}
.demo{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);border:1px dashed var(--hair);border-radius:7px;padding:2px 3px 2px 8px}
.demo button{height:24px;padding:0 8px;border-radius:5px;border:1px solid var(--hair);background:var(--bg);font-size:11.5px;color:var(--ink2)}
.demo b{font-family:var(--f-mono);font-weight:400;color:var(--ink2);font-variant-numeric:tabular-nums;padding:0 4px}
.lt-only{display:none}

/* 主体：左信息屏，中地图，右栏（宽度预留，地图站位不随选中跳动） */
.grid{display:grid;grid-template-columns:clamp(300px,24vw,352px) minmax(0,1fr) clamp(320px,25vw,380px);height:calc(100vh - 52px)}

/* 发车信息屏（等你队列）——全页唯一的深色块 */
.board{background-color:var(--board);background-image:radial-gradient(var(--led-dot) .9px,transparent 1.1px);background-size:5px 5px;color:var(--board-ink);overflow:auto;border-right:1px solid var(--board-rule)}
.bh{padding:14px 16px 10px;border-bottom:1px solid var(--board-rule);position:sticky;top:0;background:inherit;background-color:var(--board);z-index:2}
.bh .row{display:flex;align-items:flex-end;gap:12px}
.bn{font-family:var(--f-sign);font-size:46px;line-height:.9;color:var(--led);font-variant-numeric:tabular-nums;font-weight:600;background:none;border:0;padding:0}
.bh .row b{font-size:17px;display:block;letter-spacing:.04em}
.bh small{color:var(--board-muted);font-size:11.5px}
.berr{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:9px;font-size:12px;color:var(--board-muted)}
.berr button{border:0;background:none;padding:0;color:var(--board-ink);font-size:12px;text-decoration:underline dotted;text-underline-offset:3px}
.berr button b{font-family:var(--f-sign);font-size:15px;color:var(--led-red);font-weight:600;margin:0 2px}
.berr button.u b{color:var(--board-ink)}
.qi{display:grid;grid-template-columns:58px minmax(0,1fr);gap:0 10px;padding:12px 16px 12px;border-bottom:1px solid var(--board-rule);position:relative;cursor:default}
.qi:hover{background:var(--board-2)}
.qi.focus{background:var(--board-2);box-shadow:inset 3px 0 0 var(--led)}
.cd{font-family:var(--f-sign);font-size:24px;line-height:1;font-variant-numeric:tabular-nums;color:var(--led);font-weight:600;display:block}
.cd.hot{color:var(--led-red)}
.cd.none{font-size:13px;color:var(--board-muted);font-weight:400;padding-top:4px}
.cdl{font-size:10.5px;color:var(--board-muted);display:block;margin-top:3px}
.qk{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--board-muted)}
.qk b{color:var(--board-ink);font-weight:600;font-size:12.5px}
.risk{font-size:10.5px;padding:0 6px;border-radius:3px;border:1px solid var(--board-muted);line-height:17px}
.risk.high{border-color:var(--led-red);color:var(--led-red)}
.risk.medium{border-color:var(--led);color:var(--led)}
.ask{margin:5px 0 4px;font-size:12.5px;line-height:1.45;word-break:break-all}
.ask code{color:var(--board-ink);background:#ffffff14;padding:1px 4px;border-radius:3px}
.why{font-size:11.5px;color:var(--board-muted);margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi.open .why,.qi:focus-within .why{white-space:normal}
.why em{font-style:normal;color:var(--board-ink)}
.route{display:flex;flex-wrap:wrap;align-items:center;row-gap:3px;font-size:11px;color:var(--board-muted);margin:4px 0 2px}
.route .r{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.route .r i{width:8px;height:8px;border-radius:50%;border:2px solid var(--c);background:var(--board);flex:none}
.route .r.you i{border-color:var(--board-ink);background:var(--board-ink)}
.route .r.end{color:var(--led-red);font-weight:600}
.route .r.end i{border-color:var(--led-red);background:var(--led-red)}
.route .k{width:12px;height:3px;background:var(--c);margin:0 3px;border-radius:2px;flex:none}
.route .k.ro{height:1.5px}
.qa{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qa button{height:28px;padding:0 11px;border-radius:5px;border:1px solid var(--board-btn);background:transparent;color:var(--board-ink);font-size:12px}
.qa button.go{background:var(--led);border-color:var(--led);color:#14100a;font-weight:600}
.qa button:hover{filter:brightness(1.15)}
.qa .note{font-size:11.5px;color:var(--board-muted);line-height:28px}
.hold{position:relative;overflow:hidden}
.hold::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:#14100a}
.hold.holding::after{width:100%;transition:width 1s linear}
.typed{margin-top:8px;padding:8px;border:1px solid var(--led-red);border-radius:6px;background:#ff4a5c12}
.typed label{display:block;font-size:11.5px;color:var(--board-ink);margin-bottom:5px;line-height:1.5}
.typed input{width:100%;height:28px;border-radius:4px;border:1px solid var(--board-btn);background:#000;color:#fff;font-family:var(--f-mono);font-size:12px;padding:0 7px}
.typed .qa{margin-top:6px}
.typed button.go[disabled]{opacity:.35}
.opts{margin:4px 0 0;padding:0;list-style:none;font-size:12px}
.opts li{padding:1px 0;color:var(--board-ink)}
.opts li::before{content:"○ ";color:var(--board-muted)}
.bsec{padding:14px 16px 6px;font-size:12px;color:var(--board-muted);display:flex;justify-content:space-between;gap:8px}
.bsec b{color:var(--board-ink);font-weight:600}
.erow{display:grid;grid-template-columns:58px minmax(0,1fr);gap:0 10px;padding:8px 16px;border:0;background:none;width:100%;text-align:left;color:var(--board-ink);border-bottom:1px solid var(--board-rule)}
.erow:hover{background:var(--board-2)}
.erow .x{font-family:var(--f-sign);color:var(--led-red);font-size:13px}
.erow small{display:block;color:var(--board-muted);font-size:11.5px}
.done{padding:6px 16px;font-size:11.5px;color:var(--board-muted);border-bottom:1px solid var(--board-rule)}
.done s{opacity:.7}
.elsewhere{font-size:11.5px;color:var(--board-muted);margin-top:6px}

/* 地图区 */
.mapwrap{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);position:relative}
.mhead{display:flex;align-items:center;gap:8px 12px;padding:8px 16px;border-bottom:1px solid var(--hair);flex-wrap:wrap;background:var(--bg)}
.since{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1 1 320px;min-width:0}
.lab{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:6px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:0 9px;height:26px;font-size:12px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chipn{display:inline-flex;align-items:baseline;gap:5px;height:26px;padding:0 9px;border-radius:13px;border:1px solid var(--hair);background:var(--surface);font-size:12px;color:var(--ink2);white-space:nowrap}
.chipn b{font-family:var(--f-sign);font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.chipn.sig b{color:var(--signal)}
.chipn:hover{border-color:var(--muted)}
.replay{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.replay b{font-family:var(--f-sign);font-size:15px;font-variant-numeric:tabular-nums}
.rpbar{width:140px;height:4px;border-radius:2px;background:var(--hair);overflow:hidden;display:inline-block}
.rpbar i{display:block;height:100%;width:0;background:var(--ink)}
.views{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mapScroll{flex:1;overflow-y:scroll;overflow-x:hidden;position:relative;scrollbar-gutter:stable}
.map{position:relative}
.map svg{position:absolute;left:0;top:0;overflow:visible}
.trk{fill:none;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.trk.ro{stroke-width:2.2}
.trk.inf{stroke-dasharray:7 6}
.trk.ro.inf{stroke-dasharray:4 4}
.hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke}
.hair{fill:none;stroke:var(--signal);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hair.inf{stroke-dasharray:3 4}
.hair.hot{stroke-width:3.2}
.aboutl{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:3 3}
.dim{opacity:.22}
.halo{fill:var(--signal-soft)}
.halo.hot{stroke:var(--signal);stroke-width:1.5}
.sf{fill:var(--station)}
.stn{cursor:pointer}
.q{font:700 9px var(--f-sign);fill:var(--muted);text-anchor:middle}
.q.big{font:700 13px var(--f-sign);fill:var(--ink2)}
.selring{fill:none;stroke:var(--ink);stroke-width:1.5}
.blastring{fill:none;stroke:var(--signal);stroke-width:1.6;stroke-dasharray:3 3}
.ybar{fill:var(--ink)}
.tick{stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;opacity:.75}
.tpill rect{fill:var(--bg);stroke-width:1.2}
.tpill text{font:500 9.5px var(--f-mono);fill:var(--ink2);text-anchor:middle}
.parcel rect{fill:var(--station);stroke-width:1.6}
.parcel.trunc rect{stroke-dasharray:2.5 1.6}
.train .body{fill:var(--ink)}
.train.msg .body{fill:var(--bg);stroke:var(--ink);stroke-width:1.6}
.train .win{fill:var(--bg)}
.train.msg .win{fill:var(--ink)}
.motion .train.fresh .tm{animation:tfade 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes tfade{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.motion .train.fresh .tm{animation:none}}
.labels{position:absolute;left:0;top:0}
.st{position:absolute;transform:translate(-50%,-26px);width:calc(var(--colw) - 12px);height:64px;display:grid;grid-template-rows:18px 16px 30px;text-align:center;pointer-events:none;border-radius:6px;outline:none}
.st>span{pointer-events:auto;cursor:pointer;min-width:0}
.st:focus-visible{box-shadow:0 0 0 2px var(--ink)}
.st .nm{display:flex;justify-content:center;align-items:flex-end;gap:3px;font-weight:600;font-size:12.5px;line-height:1.3}
.st .nm .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .nm .qm{font-style:normal;font-family:var(--f-sign);font-weight:700;color:var(--ink2)}
.st.ro .nm{font-weight:400;color:var(--ink2)}
.st.lead .nm{font-size:13.5px}
.st .ss{grid-row:3;font-size:11px;line-height:1.3;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-top:1px}
.st .ss.sig{color:var(--signal);font-weight:600}
.st .ss.sig.inf{font-weight:400}
.st .ss.err{color:var(--signal)}
.st .ss.unk{font-style:italic}
.st.dim{opacity:.3}
.st.sel .nm .t{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.chip{flex:none;border:1px dashed var(--muted);background:var(--bg);color:var(--ink2);border-radius:9px;font-size:10.5px;line-height:15px;padding:0 5px;font-family:var(--f-sign);font-weight:600}
.chip:hover{border-style:solid;color:var(--ink)}
.badge{position:absolute;transform:translate(-50%,-50%);min-width:19px;height:19px;border-radius:5px;color:#fff;font:600 12px/19px var(--f-sign);text-align:center;padding:0 4px;pointer-events:none}
.badge.ro{background:var(--station)!important;color:var(--ink2);border:1.5px solid var(--c);line-height:16px}
.phead{position:absolute;font-size:12px;color:var(--muted);white-space:nowrap;display:flex;gap:8px;align-items:baseline}
.phead b{font-size:13px}
.phead .nl{color:var(--ink2);font-style:italic}
.fold{position:absolute;transform:translateY(-50%);border:1px dashed var(--muted);background:var(--bg);color:var(--ink2);border-radius:13px;font-size:12px;height:26px;padding:0 10px;white-space:nowrap}
.fold b{font-family:var(--f-sign);font-size:14px;color:var(--ink);margin-right:2px}
.fold:hover{border-style:solid}
.youbtn{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px}
.legend{font-size:11.5px;color:var(--ink2)}
.legend h4{margin:10px 0 4px;font-size:12px;font-weight:600;color:var(--ink)}
.legend h4:first-child{margin-top:0}
.legend table{border-collapse:collapse}
.legend td{padding:2px 8px 2px 0;vertical-align:middle;line-height:1.4}
.legend svg{display:block}
.legend p{margin:8px 0 0;color:var(--muted)}
#legendPop{position:absolute;right:16px;top:50px;background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:12px 14px;box-shadow:0 8px 24px #0002;z-index:5;display:none;max-width:420px;max-height:calc(100% - 70px);overflow:auto}
#legendPop.on{display:block}
.foot{border-top:1px solid var(--hair);padding:7px 16px;font-size:11.5px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;background:var(--bg)}
.foot button{border:0;background:none;padding:0;color:var(--ink2);text-decoration:underline dotted;text-underline-offset:3px;font-size:inherit}
.foot .grp{display:flex;gap:9px;flex-wrap:wrap}
.foot .nl{color:var(--ink)}

/* 右栏：未选中时是图例，选中时是这一站 */
.rail{background:var(--surface);border-left:1px solid var(--hair);overflow:auto;min-width:0}
#drawer{display:none}
body.drawer-open #drawer{display:block}
body.drawer-open #railLegend{display:none}
#railLegend{padding:16px}
#railLegend .rt{font-size:15px;font-weight:600;margin:0 0 10px}
.dh{display:flex;align-items:flex-start;gap:8px;padding:14px 16px 8px}
.dh h2{font-size:17px;margin:0;line-height:1.3;flex:1}
.dh .x{border:0;background:none;font-size:18px;color:var(--muted);padding:0 4px;line-height:1}
.dmeta{padding:0 16px;color:var(--muted);font-size:12px}
.dsec{padding:12px 16px;border-top:1px solid var(--hair2)}
.dsec h3{font-size:12px;color:var(--muted);font-weight:400;margin:0 0 6px}
.vroute{list-style:none;margin:0;padding:0}
.vroute li{display:grid;grid-template-columns:22px 1fr;align-items:center;min-height:23px;position:relative;font-size:12.5px}
.vroute li::before{content:"";position:absolute;left:9px;top:-50%;height:100%;width:var(--w,4px);margin-left:calc((4px - var(--w,4px)) / 2);background:var(--c);border-radius:2px}
.vroute li:first-child::before{display:none}

      } else { st.brake = { id: id, t: Date.now() }; st.endArm = null; st.sel = id; renderAll(); setTimeout(function(){ if (st.brake && st.brake.id === id && Date.now() - st.brake.t >= 3000){ st.brake = null; renderAll(); } }, 3100); }

    } break;
    case 'view-key': st.all = false; st.expanded.clear(); st.expandedLeads.clear(); renderAll(); break;

  if (id === st.focusQ) return;
  st.focusQ = id;
  doc.querySelectorAll('.board .qi').forEach(function(el){ el.classList.toggle('focus', el.getAttribute('data-q') === id); });
  if (fromMap){ var card = doc.querySelector('.board [data-q="' + id + '"]'); if (card && card.scrollIntoView) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  if (!st.replay) renderMap(true);
});

/* 每秒：只改倒计时数字；到点自动拒；时钟在走时每 5 秒刷新一次图上的列车 */
var tickN = 0;
function tick(){
  var now = simNow();
  doc.querySelectorAll('[data-dl]').forEach(function(el){ var ms = +el.getAttribute('data-dl') - now; el.textContent = mmss(ms); if (el.classList.contains('cd')) el.classList.toggle('hot', ms < 5 * 60e3); });
  var ct = $('#clkT'); if (ct) ct.textContent = hms(now);
  queue.filter(function(a){ return a.status === 'open' && a.deadline && Date.parse(a.deadline) <= now; }).forEach(function(a){ resolve(a, 'timeout'); });
  if (clock.running && !st.replay && (++tickN % 5 === 0)) renderMap(true);
}
setInterval(tick, 1000);
var rT = null;
window.addEventListener('resize', function(){ clearTimeout(rT); rT = setTimeout(function(){ renderMap(); }, 80); });

try { var th = localStorage.getItem('metro-theme'); if (th) doc.documentElement.setAttribute('data-theme', th); } catch (e) {}
WORLDS = { rich: buildRich(), poor: buildPoor() };
useWorld(WORLDS.rich);
renderAll();
window.__metro = { st: st, clock: clock, worlds: function(){ return WORLDS; }, W: function(){ return W; }, visibleSet: visibleSet, foldedLeads: foldedLeads, hiddenUnder: hiddenUnder, openQueue: openQueue, eff: eff, cstate: cstate, edgeStats: edgeStats, bucketList: bucketList, BUCKETS: BUCKETS, resolve: resolve, spawn: spawn, findQ: findQ, drawerHTML: drawerHTML, cardHTML: cardHTML, renderAll: renderAll, onAct: onAct, select: select, confirmWord: confirmWord, simNow: simNow };
})();
</script>
