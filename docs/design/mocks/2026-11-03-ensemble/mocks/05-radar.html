<!doctype html>
<!--
方案 05-radar 指挥雷达。中心是你；第 1~5 环是层级；扇区是项目；agent 是回波。
主角：每件等你的事画成一条从回波沿祖先链回到中心「你」的紫线；左栏是按截止排的队列，每张卡写全来路。
     悬停任何一张卡，雷达上只亮它那条链（P3 冒泡带来路、P2 一个按截止排的队列）。
其余重押：P1 杂波抑制——第 1 层也参与折叠，只有带等你、出错、自有或 10 分钟内有动静的主会话单独成回波，
     其余按 扇区×层 折成一段可点开的分色弧，标签按优先级只放前 K 个并做避让；
     P5 派活（实线箭头）、回报（实心包裹带时间）、等你链三种边可钉在图上；agent 互等与复核预留了边型，数据没登记就写「未知」；
     P6 选中第 5 层时整条祖先链在图上加粗、在读数里列成梯子。
敌我识别：自有会话带外圈（IFF），只有它们出现操作按钮。
来源未核实的 seat 请求要键入签名链上真正的发起方；高风险批准按住 1 秒，按住时按钮上显示后果。
贫瘠态按简报 §7.4 的形状生成（计数取自 §7.4，名字借 SCENARIO）：24 个主会话、111 个 subagent、
     718 个被裁、DeepSeek Harness 92 个未读入画成虚线扇区。
主动放弃：雷达扫描线常转与循环脉冲（只在载入扫一次；等你刚出现时沿链跑一次光点，剩不到 5 分钟时慢闪）；
     按项目上色（颜色只给等你与出错）；按声部切扇区（声部改成调暗筛选，不打乱树链）；完整时间流。
最大风险：极坐标对扫读不友好，窄屏时大部分标签让位只剩悬停；回波方位随派活轻微漂移。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指挥雷达</title>
<style>
:root{
  --paper:#E6ECEA; --panel:#F1F5F3; --scope:#F8FAF9; --ink:#1C2A2F; --ink-2:#4E6066; --ink-3:#8D9DA1;
  --grid:#C8D3D1; --grid-2:#DCE4E2; --you:#4636D6; --you-2:rgba(70,54,214,.12); --you-ink:#FFFFFF;
  --err:#C83A23; --err-2:rgba(200,58,35,.11); --hatch:#B9C6C4;
  --sans:"Segoe UI Variable Text","Segoe UI Variable","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SFMono-Regular",monospace;
  --k:1;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D181D; --panel:#122028; --scope:#091317; --ink:#DAE5E3; --ink-2:#9AAFB1; --ink-3:#5B7277;
    --grid:#21353B; --grid-2:#182A30; --you:#A59DFF; --you-2:rgba(165,157,255,.15); --you-ink:#0D0B2E;
    --err:#FF7D67; --err-2:rgba(255,125,103,.13); --hatch:#2A4047; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D181D; --panel:#122028; --scope:#091317; --ink:#DAE5E3; --ink-2:#9AAFB1; --ink-3:#5B7277;
  --grid:#21353B; --grid-2:#182A30; --you:#A59DFF; --you-2:rgba(165,157,255,.15); --you-ink:#0D0B2E;
  --err:#FF7D67; --err-2:rgba(255,125,103,.13); --hatch:#2A4047; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.55 var(--sans);font-variant-numeric:tabular-nums;overflow-x:hidden}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--you);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:12.5px}

/* 顶部 */
.strip{display:flex;justify-content:flex-end;align-items:center;gap:14px;padding:4px 16px 0;font-size:11.5px;color:var(--ink-3)}
.strip a{color:var(--ink-2)}
.strip button{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;cursor:pointer;font-size:11.5px}
header.bar{display:flex;align-items:center;gap:8px 14px;padding:4px 16px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-size:17px;font-weight:650;letter-spacing:.01em}
.brand .clock{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.brand .clock.paused{color:var(--you)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink-2);font-size:12px;text-decoration:underline;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--grid);border-radius:7px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.seg button + button{border-left:1px solid var(--grid)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tool,.voicesel{background:none;border:1px solid var(--grid);border-radius:7px;padding:4px 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.voicesel{background:var(--paper)}
.go{background:var(--you);color:var(--you-ink);border:0;border-radius:8px;padding:7px 16px;font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.go kbd{font-family:var(--mono);font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.8}

/* 主体 */
main{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;grid-template-areas:"queue scope readout";height:calc(100vh - 74px);min-height:600px}
main.ro-min{grid-template-columns:300px minmax(0,1fr) 44px}
.queue{grid-area:queue;overflow:auto;padding:2px 12px 32px 16px;border-right:1px solid var(--grid-2)}
.scope-wrap{grid-area:scope;position:relative;min-width:0;display:flex;align-items:center;justify-content:center;padding:4px 6px}
.readout{grid-area:readout;overflow:auto;padding:2px 14px 32px 14px;border-left:1px solid var(--grid-2);background:var(--panel)}
main.ro-min .readout{padding:8px 0;overflow:hidden}
.ro-rail{writing-mode:vertical-rl;background:none;border:0;cursor:pointer;color:var(--ink-2);font-size:13px;padding:10px 12px;width:100%}
.ro-top{display:flex;justify-content:flex-end;margin-top:6px}
#scope{width:100%;height:100%;max-height:calc(100vh - 86px);display:block}

/* 等你队列 */
.qhead{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
.qhead h2{font-size:22px;font-weight:650;margin:0}
.countbtn{background:none;border:0;padding:0 2px;cursor:pointer;color:var(--you);font-weight:650;font-size:22px;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.qsplit{display:flex;flex-wrap:wrap;gap:4px 6px;margin:2px 0 6px}
.qsplit button{background:none;border:1px solid var(--grid);border-radius:12px;padding:0 9px;font-size:12px;color:var(--ink-2);cursor:pointer}
.qsplit button b{color:var(--ink);font-weight:650;margin-left:3px}
.qsplit button:hover{border-color:var(--ink-3)}
.qsub{font-size:12px;color:var(--ink-3);margin:0 0 8px}
.errs{margin:0 0 10px;padding:6px 0 6px 10px;border-left:3px solid var(--err);background:var(--err-2);border-radius:0 6px 6px 0}
.errhead{background:none;border:0;padding:0;cursor:pointer;color:var(--err);font-weight:650;font-size:14px;display:flex;align-items:center;gap:6px}
.errhead b{text-decoration:underline;text-underline-offset:3px}
.errrow{display:flex;width:100%;gap:8px;align-items:baseline;background:none;border:0;padding:2px 8px 2px 0;cursor:pointer;text-align:left;font-size:12.5px}
.errrow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.errrow .n{color:var(--ink-3);font-size:11.5px;white-space:nowrap}
.errrow:hover .t{text-decoration:underline}
.freeze{font-size:11.5px;color:var(--ink-3);margin:0 0 4px}
.qi{position:relative;padding:8px 0 10px 12px;margin:0 0 4px;border-left:3px solid var(--you);cursor:pointer}
.qi + .qi{border-top:1px solid var(--grid-2)}
.qi.inf{border-left-style:dashed;border-left-color:var(--ink-3)}
.qi.ro{border-left-color:var(--ink-3)}
.qi.sel,.qi.hot{background:var(--you-2)}
.qi.gone{cursor:default;border-left-color:var(--grid);color:var(--ink-3);font-size:12.5px;padding:6px 0 6px 12px}
.qi-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dl{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--you);line-height:1.1}
.qi.first .dl{font-size:26px}
.dl.none{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink-2)}
.dlu{font-size:12px;color:var(--ink-2)}
.risk{margin-left:auto;font-size:11.5px;padding:0 6px;border-radius:4px;border:1px solid var(--err);color:var(--err);white-space:nowrap}
.risk.med{border-color:var(--ink-3);color:var(--ink-2)}
.qi-who{font-weight:600;margin-top:4px}
.qi-who small{font-weight:400;color:var(--ink-3);margin-left:6px}
.qi-ask{margin-top:4px;word-break:break-word}
.qi-ask code{display:block;margin-top:3px;padding:5px 7px;background:var(--scope);border:1px solid var(--grid-2);border-radius:5px;white-space:pre-wrap;word-break:break-all}
.qi-meta{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.qi-meta b{font-weight:600;color:var(--ink)}
.claim{color:var(--err)}
.path{font-size:12px;color:var(--ink-2);margin-top:6px;line-height:1.8}
.path .d{display:inline-block;min-width:16px;text-align:center;font-size:10.5px;border:1px solid var(--grid);border-radius:8px;margin-right:2px;color:var(--ink-3)}
.path .d.me{border-color:var(--you);color:var(--you);font-weight:650}
.path .sep{color:var(--you);margin:0 3px}
.path b{color:var(--you);font-weight:600}
.qc1{display:flex;align-items:baseline;gap:8px;min-width:0}
.qc1 .dl{font-size:15px}
.qc1 .w{font-weight:600;white-space:nowrap}
.qc1 .a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);font-size:12.5px}
.qc2{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);margin-top:2px}
.qc2 .d{display:inline-block;min-width:16px;text-align:center;font-size:10.5px;border:1px solid var(--you);border-radius:8px;color:var(--you)}
.qc2 .risk{margin-left:auto}
.qi-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.btn{background:transparent;border:1px solid var(--grid);border-radius:6px;padding:4px 12px;cursor:pointer;color:var(--ink);font-size:13px}
.btn:hover{border-color:var(--ink-3)}
.btn.yes{background:var(--you);border-color:var(--you);color:var(--you-ink);font-weight:600}
.btn.yes:disabled{opacity:.35;cursor:not-allowed}
.btn.warn{border-color:var(--err);color:var(--err)}
.btn.warn.armed{background:var(--err);color:var(--scope)}
.hold{position:relative;overflow:hidden;background:transparent;border:1px solid var(--err);color:var(--err);font-weight:600;border-radius:6px;padding:4px 12px;cursor:pointer;font-size:13px;max-width:100%;text-align:left;touch-action:none;user-select:none}
.hold .fill{position:absolute;inset:0;background:var(--err);transform-origin:left;transform:scaleX(0);opacity:.22}
.hold.holding .fill{transform:scaleX(1);transition:transform 1s linear}
.hold .lab{position:relative}
.typed{width:100%;font:13px var(--mono);padding:5px 7px;border:1px solid var(--err);border-radius:5px;background:var(--scope);color:var(--ink)}
.typed-l{font-size:12px;color:var(--err);width:100%;cursor:text}
.ro-note{font-size:12.5px;color:var(--ink-2);margin-top:8px}
.done-zone{margin-top:14px;font-size:12px;color:var(--ink-3)}
.done-zone div{padding:3px 0}

/* 读数 */
.readout h2{font-size:17px;margin:10px 0 2px;font-weight:650}
.readout h3{font-size:13.5px;margin:18px 0 6px;font-weight:650;color:var(--ink)}
.back{background:none;border:0;padding:0;color:var(--ink-2);cursor:pointer;font-size:12.5px;margin-top:8px;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.chip{font-size:11.5px;border:1px solid var(--grid);border-radius:10px;padding:0 8px;color:var(--ink-2)}
.chip.own{border-color:var(--ink-2);color:var(--ink)}
.rowbtn{display:flex;width:100%;align-items:center;gap:8px;padding:6px 0;background:none;border:0;border-bottom:1px solid var(--grid-2);cursor:pointer;text-align:left}
.rowbtn:hover{background:var(--you-2)}
.rowbtn .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowbtn .n{color:var(--ink-3);font-size:12px;white-space:nowrap}
.since{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.since-row{display:flex;align-items:center;border-bottom:1px solid var(--grid-2)}
.since-row .rowbtn{border:0;padding:4px 0}
.since-row .rowbtn .k{font-weight:650;min-width:22px;text-align:right}
.pin{background:none;border:1px solid var(--grid);border-radius:5px;font-size:11px;padding:0 5px;cursor:pointer;color:var(--ink-3);white-space:nowrap}
.pin[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--scope)}
.mini{display:inline-flex;align-items:center;gap:2px;margin-right:8px;background:none;border:0;padding:0;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.mini:hover{color:var(--ink);text-decoration:underline}
.gl{width:14px;height:14px;flex:none;vertical-align:-2px;overflow:visible}
.ladder{list-style:none;margin:6px 0 0;padding:0}
.ladder li{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.ladder li .d{width:20px;height:20px;border-radius:50%;border:1px solid var(--grid);font-size:11px;display:grid;place-items:center;color:var(--ink-3);flex:none}
.ladder li.me .d{border-color:var(--ink);color:var(--ink);font-weight:650}
.ladder li.you .d{border-color:var(--you);color:var(--you)}
.ladder li:hover span.t{text-decoration:underline}
.state-line{display:flex;gap:8px;align-items:center;font-weight:600;flex-wrap:wrap}
.why{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.conf{font-size:11.5px;color:var(--ink-3);font-weight:400}
.quote{margin:6px 0;padding:6px 10px;border-left:2px solid var(--grid);color:var(--ink-2);font-size:13px}
.quote cite{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);margin-top:3px}
.trunc{font-size:12px;color:var(--err);margin-top:4px}
.refs{margin:4px 0 0;padding-left:18px}
.refs li{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.brakebox{margin-top:10px;padding:10px 12px;border:1px solid var(--err);border-radius:8px;background:var(--err-2)}
.brakebox ul{margin:6px 0;padding-left:0;list-style:none;max-height:180px;overflow:auto}
.brakebox li{font-size:12.5px;display:flex;gap:6px;align-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12.5px;color:var(--ink-2)}
.kv b{font-weight:500;color:var(--ink)}
.note{font-size:12px;color:var(--ink-3);margin-top:8px}
.wl{padding:8px 0;border-bottom:1px solid var(--grid-2)}
.wl-h{display:flex;gap:6px;align-items:center}
.wl-h .t{font-weight:600;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-h .t:hover{text-decoration:underline}
.pill{font-size:11.5px;padding:0 7px;border-radius:9px;background:var(--you);color:var(--you-ink);font-weight:600;border:0;cursor:pointer;white-space:nowrap}
.pill.err{background:var(--err);color:var(--scope)}
.quietbtn{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--grid-2);padding:7px 0;cursor:pointer;color:var(--ink-2);font-size:12.5px}
.quietbtn:hover{color:var(--ink);text-decoration:underline}
.sincepick{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--ink-3);margin-bottom:4px;flex-wrap:wrap}
.sincepick button{background:none;border:1px solid transparent;border-radius:5px;padding:0 6px;cursor:pointer;color:var(--ink-2);font-size:12px}
.sincepick button[aria-pressed="true"]{border-color:var(--ink-2);color:var(--ink)}
.unk{font-size:12px;color:var(--ink-2);margin-top:10px;padding:6px 8px;border:1px dashed var(--grid);border-radius:6px}

/* 雷达 */
.disc{fill:var(--scope)}
.ring{fill:none;stroke:var(--grid);stroke-width:1}
.ring.outer{stroke:var(--ink-3);stroke-width:1.2}
.tick{stroke:var(--grid);stroke-width:1}
.ring-lbl{fill:var(--ink-3);text-anchor:middle;paint-order:stroke;stroke:var(--scope)}
.ssep{stroke:var(--grid);stroke-width:1;stroke-dasharray:2 5}
.bezel{fill:var(--ink-2);font-weight:600}
.bezel a{cursor:pointer}
.scnt{fill:var(--you);font-weight:650}
.scnt.err{fill:var(--err)}
a:hover > .scnt,a:focus > .scnt{text-decoration:underline}
.unread-zone{fill:url(#hatch);stroke:var(--ink-3);stroke-width:1;stroke-dasharray:4 4}
.unread-t{fill:var(--ink-2);text-anchor:middle;paint-order:stroke;stroke:var(--scope)}
.unread-t.big{fill:var(--ink);font-weight:650}
.trim{fill:none;stroke:var(--ink-3);stroke-dasharray:1 5;stroke-linecap:round;opacity:.8}
.trim-t{fill:var(--ink-3);text-anchor:middle;paint-order:stroke;stroke:var(--scope)}
.spoke{stroke:var(--ink-3);stroke-width:1;opacity:.55}
.spoke.obs{stroke-dasharray:2 4}
.chain-you{fill:none;stroke:var(--you);stroke-width:calc(2px * var(--k));opacity:.85;stroke-linejoin:round;transition:opacity .15s}
.chain-you.urgent{stroke-width:calc(3.2px * var(--k))}
.chain-you.inf{stroke-dasharray:5 6;opacity:.6;stroke:var(--ink-3)}
svg.qhot .chain-you{opacity:.12}
svg.qhot .chain-you.hot{opacity:1;stroke-width:calc(4px * var(--k))}
.chain-sel{fill:none;stroke:var(--ink);stroke-width:calc(2.6px * var(--k));stroke-linejoin:round}
.brake-zone{fill:none;stroke:var(--err);stroke-width:1.5;stroke-dasharray:3 3}
.flow{fill:none;stroke:var(--ink-2);stroke-width:calc(1.5px * var(--k));stroke-linejoin:round}
.flow.del{marker-end:url(#mArrow)}
.flow.rep{stroke-dasharray:7 5}
.flow.wait{stroke:var(--ink);stroke-dasharray:3 4;marker-end:url(#mArrow)}
.flow.rev{stroke:var(--ink)}
.pkt{fill:var(--ink-2);stroke:var(--scope);stroke-width:1}
.flow-t{fill:var(--ink-2);paint-order:stroke;stroke:var(--scope);font-family:var(--mono)}
.mk{fill:var(--ink-2)}
.band{fill:none;stroke-linecap:butt;cursor:pointer}
.band-hit{fill:none;stroke:transparent;cursor:pointer}
.band-n{fill:var(--ink-2);text-anchor:middle;cursor:pointer;font-weight:600;paint-order:stroke;stroke:var(--scope)}
.band-g:hover .band-n,.band-g:focus .band-n{fill:var(--ink);text-decoration:underline}
.band-g:focus{outline:none}
.band-g:focus .band-hit{stroke:var(--you-2)}
.b-running{stroke:var(--ink-2)} .b-reported{stroke:var(--ink-3)} .b-idle{stroke:var(--grid)}
.b-unknown{stroke:var(--ink-2);stroke-dasharray:1.5 3.5}
.b-error{stroke:var(--err)} .b-waiting,.b-inferred{stroke:var(--you)} .b-braked,.b-ended{stroke:var(--grid-2)}
.blip{cursor:pointer}
.blip:focus{outline:none}
.blip:focus .hit{stroke:var(--you);stroke-width:1.5;fill:var(--you-2)}
.blip.dim{opacity:.2}
.g-run{fill:var(--ink)}
.g-halo{fill:var(--ink);opacity:.12}
.g-wait{fill:var(--you)}
.g-wait-ring{fill:none;stroke:var(--you);stroke-width:1.4}
.g-wait-ring.urgent{animation:slowblink 2.4s ease-in-out infinite}
@keyframes slowblink{0%,100%{opacity:1}50%{opacity:.2}}
body.still .g-wait-ring.urgent{animation:none}
.g-inf{fill:var(--scope);stroke:var(--you);stroke-width:1.6;stroke-dasharray:3 2.5}
.g-err{fill:var(--err)}
.g-rep-o{fill:var(--scope);stroke:var(--ink-2);stroke-width:1.6}
.g-rep-i{fill:var(--ink-2)}

<script src="../scenario.js"></script>
<script>
(function(){
'use strict';
const S = window.SCENARIO;
const doc = document;
const $ = id => doc.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 剧本时钟（可暂停、可从头开始） ---------- */
const NOW0 = Date.parse(S.meta.now);
const realMs = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
const clk = { t0: realMs(), pausedAt: null, pausedTotal: 0 };
const simNow = () => NOW0 + ((clk.pausedAt != null ? clk.pausedAt : realMs()) - clk.t0 - clk.pausedTotal);
function togglePause() { if (clk.pausedAt == null) clk.pausedAt = realMs(); else { clk.pausedTotal += realMs() - clk.pausedAt; clk.pausedAt = null; } }
const ms = t => typeof t === 'number' ? t : Date.parse(t);
const hhmm = t => t == null ? '未知' : new Date(ms(t) + 8 * 3600e3).toISOString().slice(11, 16);
const hhmmss = t => new Date(ms(t) + 8 * 3600e3).toISOString().slice(11, 19);
const left = d => { const s = Math.max(0, Math.round((ms(d) - simNow()) / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const minsLeft = d => (ms(d) - simNow()) / 60000;
const agoMin = t => Math.max(0, Math.round((simNow() - ms(t)) / 60000));

/* ---------- 词表 ---------- */
const STATE_LABEL = { running: '在跑', waiting: '等你', inferred: '≈ 可能在等你', idle: '空闲', reported: '已回报', error: '出错', unknown: '状态未知', braked: '被刹车', ended: '已结束' };
const STATE_ORDER = ['waiting', 'inferred', 'error', 'running', 'unknown', 'reported', 'idle', 'braked', 'ended'];
const OWN_LABEL = { owned: '自有', observed: '只读', foreign: '归属不明' };
const KIND_LABEL = { approval: '审批', seat: '派活请求', question: '提问', inferred: '推测' };
const harnessLabel = h => (S.harnesses[h] || {}).label || '未知';
const modelLabel = m => (m && S.models[m]) || '未知';
const voiceLabel = v => ((S.voices.find(x => x.id === v) || {}).label) || '未知';
const shortTitle = n => n ? String(n.title).replace(/\s*·\s*领头$/, '') : '';
const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;

/* ---------- 两份数据：丰富态取 SCENARIO；贫瘠态按简报 §7.4 的形状生成 ---------- */
const clone = o => JSON.parse(JSON.stringify(o));
function makeRich() {
  return { kind: 'rich', nodes: clone(S.nodes), events: clone(S.events),
    items: clone(S.attention).map(it => Object.assign(it, { status: 'open' })), extra: { trimmed: null, unread: [] } };
}
// 简报 §7.4（本机真实数据的一次只读抽样）里的计数；名字和文案从 SCENARIO 借。
const SHAPE_74 = { mainsByProject: [9, 9, 6], alive: [0, 1, 2, 3, 4, 9, 10, 11, 12, 18, 19, 20, 21], running: [0, 9, 18], inferred: 3,
  subSpread: [16, 12, 9, 8, 7, 7, 6, 6, 5, 5, 4, 4, 4, 3, 3, 3, 2, 2, 2, 1, 1, 1, 0, 0], matched: 2, trimmed: 718, dshUnread: 92 };
function makePoor() {
  const iso = m => new Date(NOW0 - m * 60000).toISOString();
  const nodes = [], events = [], items = [];
  const apSrc = S.attention.find(a => a.kind === 'approval' && a.risk === 'high');
  const seatSrc = S.attention.find(a => a.kind === 'seat');
  const infSrc = S.attention.find(a => a.kind === 'inferred');
  const mains = [];
  S.projects.forEach((p, pi) => {
    const pool = [...new Set(S.nodes.filter(n => n.project === p.id && n.ownership !== 'owned').map(shortTitle))];
    for (let k = 0; k < (SHAPE_74.mainsByProject[pi] || 0); k++) { const i = mains.length; mains.push({ i, project: p.id, title: pool[k] || ('Claude 会话 ' + (i + 1)) }); }
  });
  const alive = new Set(SHAPE_74.alive), run = new Set(SHAPE_74.running);
  const blank = { tokens: null, costUsd: null, messages: null, model: null, role: 'unknown', task: null, spawnedAt: null, report: null };
  mains.forEach(m => {
    const a = alive.has(m.i);
    const state = run.has(m.i) ? 'running' : m.i === SHAPE_74.inferred ? 'waiting' : a ? 'idle' : 'unknown';
    const sd = state === 'running' ? null : state === 'waiting' ? { kind: 'inferred', inferred: true, why: infSrc.why }
      : state === 'idle' ? { kind: 'idle', why: '在 registry 里；没有挂起的请求' }
      : { kind: 'unknown', why: '不在 registry 里：会话文件还在，进程是否还开着不知道' };
    nodes.push(Object.assign({}, blank, { id: 'm' + (m.i + 1), parent: 'you', depth: 1, project: m.project, harness: 'claude', ownership: 'observed',
      title: m.title, state, since: a ? iso(state === 'running' ? 6 + m.i % 5 : 30 + m.i) : null,
      lastActivity: state === 'running' ? iso(.5 + (m.i % 3) * .7) : state === 'waiting' ? iso(14) : a ? iso(25 + m.i * 2) : null,
      children: [], stateDetail: sd }));
  });
  // Orchestra 自有的 Codex 会话（0~3 个，这里 2 个）：一个等你批准，一个在跑
  const apNode = S.nodes.find(n => n.id === apSrc.nodeId);
  const cx2src = S.nodes.find(n => n.ownership === 'owned' && n.harness === 'codex' && n.state === 'running' && n.project === apNode.project) || apNode;
  nodes.push(Object.assign(clone(apNode), { id: 'cx1', parent: 'you', depth: 1, harness: 'codex', children: [], report: null }));
  nodes.push(Object.assign(clone(cx2src), { id: 'cx2', parent: 'you', depth: 1, harness: 'codex', state: 'running', stateDetail: null, children: [], report: null, lastActivity: iso(1) }));
  // subagent：111 个，最多 16 个挂同一个主会话；能对上派活的 2 个，其余状态、任务都未知
  const matchedSrc = S.nodes.filter(n => n.report && n.state === 'reported').slice(0, SHAPE_74.matched);
  mains.forEach(m => {
    const pid = 'm' + (m.i + 1); const par = nodes.find(n => n.id === pid);
    for (let k = 0; k < (SHAPE_74.subSpread[m.i] || 0); k++) {
      const id = pid + '.s' + (k + 1); let n;
      const src = k === 0 ? matchedSrc[m.i] : null;
      if (src) {
        n = Object.assign(clone(src), { id, parent: pid, depth: 2, project: m.project, harness: 'claude', ownership: 'observed', children: [],
          since: iso(m.i ? 12 : 18), lastActivity: iso(m.i ? 12 : 18), stateDetail: null });
        n.report = Object.assign(clone(src.report), { to: pid, at: iso(m.i ? 12 : 18) });
        events.push({ t: iso(m.i ? 55 : 40), type: 'delegate', from: pid, to: id, task: src.task, id: 'pv-d' + m.i });
        events.push({ t: n.report.at, type: 'report', from: id, to: pid, status: src.report.status, summary: src.report.summary, refs: src.report.refs, truncated: src.report.truncated, truncatedNote: src.report.truncatedNote, id: 'pv-r' + m.i });
      } else {
        n = Object.assign({}, blank, { id, parent: pid, depth: 2, project: m.project, harness: 'claude', ownership: 'observed', title: 'subagent ' + (k + 1),
          state: 'unknown', since: null, lastActivity: null, children: [],
          stateDetail: { kind: 'unknown', why: '只知道它属于「' + m.title + '」（按会话文件位置）；状态、任务都没有登记，也对不上是哪一次派活' } });
      }
      nodes.push(n); par.children.push(id);
    }
  });
  // seat 请求：DeepSeek Harness 的会话树没有读入，只从 seat 通道知道请求方
  const seatNode = S.nodes.find(n => n.id === seatSrc.nodeId);
  nodes.push(Object.assign({}, blank, { id: seatNode.id, parent: 'you', depth: 1, project: '_dsh', harness: 'dsh', ownership: 'observed', title: seatNode.title,
    state: 'waiting', since: seatSrc.openedAt, lastActivity: seatSrc.openedAt, children: [], _depthUnknown: true,
    stateDetail: { kind: 'seat', why: '只从 seat 通道收到了它的请求；它所在的 DeepSeek Harness 会话树因上限没有读入，层级和上级都未知' } }));
  const seatEv = S.events.find(e => e.type === 'seat_request'); if (seatEv) events.push(clone(seatEv));
  items.push(Object.assign(clone(apSrc), { nodeId: 'cx1', status: 'open' }));
  items.push(Object.assign(clone(seatSrc), { status: 'open' }));
  items.push(Object.assign(clone(infSrc), { nodeId: 'm' + (SHAPE_74.inferred + 1), status: 'open' }));
  return { kind: 'poor', nodes, events, items,
    extra: { trimmed: SHAPE_74.trimmed, unread: [{ id: '_dsh', label: 'DeepSeek Harness', harness: 'dsh', count: SHAPE_74.dshUnread }] } };
}
let DATA = { rich: makeRich(), poor: makePoor() };
let D = DATA.rich;
let added = 0;

const reduced = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
const freshState = () => ({
  clutter: 'focus', data: 'rich', motion: !reduced, voice: '',
  sel: null, mode: 'home', listKey: null, brake: null, brakeArmedAt: 0,
  since: Date.parse('2026-11-03T15:00:00+08:00'), layers: new Set(['report', 'delegate']), expanded: new Set(),
  lastQueueChange: 0, frozen: null, qOpen: new Set(), typed: {}, boot: true, roMin: false, bandList: null
});
let st = freshState();
const seen = new Set();
const recentDone = [];

/* ---------- 视图 ---------- */
let V = null;
function computeView() {
  D = DATA[st.data];
  const nodes = D.nodes;
  const byId = new Map(nodes.map(n => [n.id, n]));
  const open = D.items.filter(it => it.status === 'open' && byId.has(it.nodeId))
    .sort((a, b) => (a.kind === 'inferred') - (b.kind === 'inferred') || (a.deadline ? ms(a.deadline) : 9e15) - (b.deadline ? ms(b.deadline) : 9e15) || ms(a.openedAt) - ms(b.openedAt));
  const kids = new Map(); nodes.forEach(n => { if (!kids.has(n.parent)) kids.set(n.parent, []); kids.get(n.parent).push(n); });
  V = { nodes, byId, events: D.events, open, kids };
  return V;
}
const node = id => V.byId.get(id);
const childrenOf = id => V.kids.get(id) || [];
function chainOf(id) { const out = []; let n = node(id); while (n) { out.unshift(n.id); n = node(n.parent); } return out; }
function subtree(id) { const out = []; const walk = n => { out.push(n); childrenOf(n.id).forEach(walk); }; const n = node(id); if (n) walk(n); return out; }
function vstate(n) { return n.state === 'waiting' && n.stateDetail && n.stateDetail.inferred ? 'inferred' : n.state; }
function itemFor(id) { return V.open.find(it => it.nodeId === id); }
const recent = n => n.state === 'running' && n.lastActivity && simNow() - ms(n.lastActivity) <= 10 * 60000;
const depthTxt = n => n._depthUnknown ? '?' : String(n.depth);
function conf(n) {
  const v = vstate(n);
  if (v === 'unknown') return { k: 'unk', t: '不知道' };
  if (v === 'inferred') return { k: 'inf', t: '≈ 推测（看日志推出来的，不是正式请求）' };
  return { k: 'real', t: '守护进程登记' };
}
const isActHere = it => it.kind === 'seat' || ((it.kind === 'approval' || it.kind === 'question') && node(it.nodeId).ownership === 'owned');
const isRo = it => (it.kind === 'approval' || it.kind === 'question') && node(it.nodeId).ownership !== 'owned';
function hasThing(lead) {
  const sub = subtree(lead.id);
  return lead.ownership === 'owned' || recent(lead) || lead._new || sub.some(x => x.state === 'error' || x._new) || V.open.some(it => chainOf(it.nodeId).includes(lead.id));
}

/* ---------- 列表注册（T3：每个计数就是这里列表的长度） ---------- */
function sinceEvents(type, pred) { return V.events.filter(e => e.type === type && ms(e.t) > st.since && ms(e.t) <= simNow() && (!pred || pred(e))); }
const SINCE_ROWS = [
  ['report', '回报到达', () => sinceEvents('report'), true],

/* ---------- 时钟：倒计时、超时即拒；只改变化的属性，不整块重画 ---------- */
function tick() {
  $('clock').textContent = hhmmss(simNow()) + (clk.pausedAt != null ? ' 已暂停' : '');
  doc.querySelectorAll('[data-dl]').forEach(e => { e.textContent = (e.dataset.pre || '') + left(e.dataset.dl); });
  doc.querySelectorAll('#scope .chain-you[data-urg]').forEach(p => { const d = p.dataset.urg; p.classList.toggle('urgent', !!d && minsLeft(d) < 5); });
  V.open.forEach(it => {
    if (!it.deadline || minsLeft(it.deadline) >= 5) return;
    const b = doc.querySelector(`#scope .blip[data-id="${CSS.escape(it.nodeId)}"] .g-wait-ring`); if (b) b.classList.add('urgent');
  });
  let changed = false;
  D.items.filter(it => it.status === 'open' && it.deadline && ms(it.deadline) <= simNow()).forEach(it => {
    const n = D.nodes.find(x => x.id === it.nodeId);
    n.state = 'running'; n.stateDetail = { kind: 'note', why: '你没在时限内处理，审批已自动拒绝；回合继续' };
    D.events.push({ t: new Date(simNow()).toISOString(), type: 'approval', node: n.id, ask: it.ask, resolved: { by: 'timeout', decision: 'rejected', at: new Date(simNow()).toISOString() }, id: 'ev-local-' + D.events.length });
    resolve(it, 'timeout', `超时自动拒：${shortTitle(n)}`); changed = true;
  });
  if (changed) { renderAll(); toast('有一件到点没处理，已自动拒绝。'); }
}

/* ---------- 启动 ---------- */
window.__radar = { computeView, layout, renderAll, act, listDef, countOf, get st() { return st; }, get D() { return D; }, get V() { return V; } };
// 深链：?data=poor&theme=light&sel=<会话 id>&clutter=all，便于逐个审阅时直接打开某个画面
try {
  const q = new URLSearchParams(location.search);
  if (q.get('data') === 'poor') st.data = 'poor';
  if (q.get('clutter') === 'all') st.clutter = 'all';
  if (q.get('theme') === 'light' || q.get('theme') === 'dark') doc.documentElement.setAttribute('data-theme', q.get('theme'));
  if (q.get('paused')) togglePause();
  if (q.get('sel')) { st.sel = q.get('sel'); st.mode = 'node'; if (q.get('brake')) st.brake = q.get('sel'); }
  if (q.get('list')) { st.mode = 'list'; st.listKey = q.get('list'); }
} catch (e) { /* 没有 location 时忽略 */ }
bind(); renderLegend(); renderNotes(); renderAll(); tick(); setInterval(tick, 1000);
if (st.sel && !node(st.sel)) { st.sel = null; st.mode = 'home'; renderAll(); }
})();
</script>
