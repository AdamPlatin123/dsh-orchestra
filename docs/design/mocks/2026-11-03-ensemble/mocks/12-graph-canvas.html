<!doctype html>
<!--
方案 12-graph-canvas「活图画布」
回答的原则：P2/P3 左边那堵墙就是「你」，等你的事挂在墙上按剩余时间从上到下排，墙不缩放、字号恒定；
  每张票直接写压缩的来路（你 › 复现… › … › 对比分词输出 › 清理旧缓存），同一件事在深处长成就地可处理的
  黄色卡片，三处处理的是同一个条目。P1 每条泳道最左是工作线头（名字、整棵子树的分项条、回报数），
  平静的工作线收成一行；P7 两个以上平静节点才收进胶囊，单个画成小点；P6/P4 悬停或选中一张票，
  才画出它那根牵线并把整条祖先链加粗；常驻的只有沿树边往上的淡黄等待链，链尾（你）最亮；
  P5 派活是箭头实线、回报是贴近发送方、口朝上级的信封；P8 实心 / 虚线 / 斜纹三种置信度。
主动放弃：不做自由拖拽、平移和连线编辑；常驻牵线（会交叉成网）；持续流动的消息粒子；P12 的叙述段落。
  高风险批准用按住 1 秒（C12），只有来源无法核实的 seat 请求才要键入确认。
最大风险：图仍随层数变宽，1024 宽下图缩到 0.86 倍；贫瘠态 24 条工作线是一长列，要靠「只看要紧的」把
  平静工作线压成一行，等你的事多到墙放不下时墙内会滚动。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestra 活图</title>
<script src="../scenario.js"></script>
<style>
[hidden]{display:none!important}
:root{
  --ui:"Microsoft YaHei UI","PingFang SC","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --num:"Bahnschrift","DIN Alternate","Segoe UI Variable Display","Microsoft YaHei UI",sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",monospace;
  --paper:#E9ECE8; --panel:#F5F6F2; --sheet:#FFFFFF;
  --ink:#1B2433; --ink2:#525C6B; --ink3:#8A929C;
  --line:#BEC4C1; --grid:#CDD3CF; --band:rgba(27,36,51,.028);
  --hl:#FFD21F; --hl-ink:#2E2500; --hl-soft:#FFF0A6; --tether:#D9A400;
  --err:#C2341F; --err-soft:#F7DDD7;
  --focus:#1B2433;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#151920; --panel:#1B2029; --sheet:#222833;
    --ink:#DDE3EB; --ink2:#9AA3B1; --ink3:#69727F;
    --line:#3A424E; --grid:#262C36; --band:rgba(221,227,235,.025);
    --hl:#FFD21F; --hl-ink:#231C00; --hl-soft:#3D3510; --tether:#FFD21F;
    --err:#FF7462; --err-soft:#3A1E1B; --focus:#FFD21F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151920; --panel:#1B2029; --sheet:#222833;
  --ink:#DDE3EB; --ink2:#9AA3B1; --ink3:#69727F;
  --line:#3A424E; --grid:#262C36; --band:rgba(221,227,235,.025);
  --hl:#FFD21F; --hl-ink:#231C00; --hl-soft:#3D3510; --tether:#FFD21F;
  --err:#FF7462; --err-soft:#3A1E1B; --focus:#FFD21F;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--ui)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 372px;grid-template-rows:auto minmax(0,1fr) 68px;height:100vh}

/* 顶栏 */
.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;min-height:52px;padding:6px 16px;border-bottom:1px solid var(--line);background:var(--paper);min-width:0}
.brand{font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand small{font-weight:400;color:var(--ink2);margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{border:1px solid var(--line);background:none;border-radius:4px;padding:2px 9px;cursor:pointer;white-space:nowrap;font-size:13px}
.chip b{font:600 15px/1 var(--num);margin-right:3px}
.chip.wait{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.chip.err{border-color:var(--err);color:var(--err)}
.chip.err.zero{border-color:var(--line);color:var(--ink2)}
.grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
.seg button{border:0;background:none;padding:3px 9px;cursor:pointer;font-size:13px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tool{border:1px solid var(--line);background:none;border-radius:4px;padding:3px 9px;cursor:pointer;font-size:13px;white-space:nowrap}
#ovBtn{display:none}
.dispatch{background:var(--ink);color:var(--paper);border:0;border-radius:4px;padding:6px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.dispatch kbd{font:12px var(--mono);opacity:.7;margin-left:6px}
.mark{font-size:11px;color:var(--ink3);white-space:nowrap;text-align:right;line-height:1.35}
.mark a{color:var(--ink2)}
.mark details{position:relative}
.mark summary{cursor:pointer;list-style:none}
.mark summary::-webkit-details-marker{display:none}
.about{position:absolute;right:0;top:20px;width:470px;max-width:calc(100vw - 32px);max-height:78vh;overflow:auto;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:14px 16px;text-align:left;font-size:12.5px;line-height:1.6;color:var(--ink);z-index:40;box-shadow:0 12px 32px rgba(0,0,0,.18);white-space:normal}
.about h4{margin:10px 0 4px;font-size:13px}
.about table{border-collapse:collapse;width:100%}
.about td{border-top:1px solid var(--line);padding:3px 4px;vertical-align:top}
.about td:first-child{white-space:nowrap;color:var(--ink2)}
.about p{margin:4px 0}

/* 工作区：左边那堵墙（你 + 等你的队列，1:1 不缩放）+ 右边的图（只有它缩放） */
.work{grid-row:2;grid-column:1;position:relative;display:grid;grid-template-columns:228px minmax(0,1fr);min-height:0;min-width:0;overflow:hidden}
.wall{border-right:4px solid var(--ink);background:var(--panel);overflow-y:auto;overflow-x:hidden;padding:12px 14px 18px 14px;display:flex;flex-direction:column;gap:9px;min-height:0;position:relative;z-index:2}
.you{display:flex;align-items:center;justify-content:space-between;border:2px solid var(--ink);background:var(--sheet);border-radius:6px;padding:6px 8px;flex:none}
.you .me{font:700 30px/1 var(--ui);padding-left:4px}
.you button{border:0;background:var(--ink);color:var(--paper);border-radius:4px;font-size:14px;font-weight:600;padding:8px 14px;cursor:pointer}
.qh{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:4px;font-size:12.5px;color:var(--ink2)}
.qh b{font:600 15px var(--num);color:var(--ink)}
.qempty{font-size:13px;color:var(--ink2);border:1px dashed var(--line);border-radius:5px;padding:10px}
.tk{position:relative;flex:none;background:var(--hl);color:var(--hl-ink);border-radius:5px;padding:7px 10px 8px;cursor:pointer;border:0;text-align:left;display:flex;flex-direction:column;gap:2px;width:100%}
.tk::after{content:"";position:absolute;right:-14px;top:50%;width:14px;height:3px;margin-top:-1.5px;background:var(--hl)}
.tk.inf{background:var(--sheet);border:2px dashed var(--tether);color:var(--ink)}
.tk.inf::after{background:none;border-top:2px dashed var(--tether);height:0}
.tk .r1{display:flex;align-items:baseline;gap:8px;min-width:0}
.tk .cd{font:600 22px/1 var(--num);font-variant-numeric:tabular-nums;flex:none}
.tk.first .cd{font-size:32px}
.tk .cd.none{font:600 13px/1.4 var(--ui)}
.tk .k{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tk .path{font-size:11.5px;line-height:1.4;opacity:.78;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tk .w{font-size:13px;font-weight:700;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .w small{font-weight:400;font-size:11.5px;opacity:.75;margin-left:4px}
.tk.urgent{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--hl)}
.tk.sel{outline:3px solid var(--ink);outline-offset:3px}
.tk.hov{transform:translateX(2px)}

.graph{position:relative;overflow:auto;min-width:0;min-height:0;
  background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:22px 22px}
#stageSize{position:relative}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.stage svg{position:absolute;left:0;top:0;overflow:visible}
.col{position:absolute;top:0}
.col.alt{background:var(--band)}
.lane{position:absolute;height:0;border-top:1px dashed var(--line)}
.lay{position:absolute;top:7px;font-size:12px;color:var(--ink3);white-space:nowrap}
.lay.calm{color:var(--ink2)}
.trim{position:absolute;border:1px dotted var(--ink3);border-radius:6px;padding:8px 12px;font-size:12.5px;color:var(--ink2);background:repeating-linear-gradient(135deg,transparent 0 6px,var(--grid) 6px 7.5px),var(--panel)}
.trim b{font:600 15px var(--num);color:var(--ink)}
.tov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:6;overflow:visible}
.tov .tether{fill:none;stroke:var(--tether);stroke-width:3.2;stroke-dasharray:.5 6.5;stroke-linecap:round;stroke-linejoin:round}
.tov .tether.inf{stroke-dasharray:6 5;stroke-width:2;stroke-linecap:butt}
.tov .tend{fill:var(--tether)}

/* 节点 */
.nd{position:absolute;border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:6px 8px;cursor:pointer;text-align:left;overflow:hidden;display:block;transition:opacity .2s}
.nd .r1,.nd .r2,.nd .ask,.nd .s{height:18px;line-height:18px}
.nd .r1{display:flex;align-items:center;gap:6px;min-width:0}
.nd .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.nd .h{font-size:10.5px;color:var(--ink3);flex:none}
.nd .s{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.nd .r2{display:flex;align-items:center;gap:6px;min-width:0}
.nd .r2 .s{flex:1;min-width:0}
.nd.own-owned{border:2px solid var(--ink)}
.nd.own-foreign{border:1px dotted var(--ink2)}
.nd.st-unknown,.nd.st-unread,.nd.st-rescan{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--band) 6px 7px),var(--sheet);border-style:dotted;border-color:var(--ink3)}
.nd.st-unknown .t,.nd.st-unread .t,.nd.st-rescan .t{font-weight:500;color:var(--ink2)}
.nd.st-unread{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--grid) 5px 6.5px),var(--sheet)}
.nd.st-settling,.nd.st-stillwait{border-style:dashed}
.nd.st-ended .t,.nd.st-braked .t{color:var(--ink2)}
.nd.st-error{border-color:var(--err);background:var(--err-soft)}
.nd.st-error .s{color:var(--err)}
.nd.st-spawning{border:2px dashed var(--ink)}
.nd.orphan{box-shadow:inset 3px 0 0 var(--err)}
/* 工作线头：每条泳道最左那一格，首屏一级元素 */
.nd.k-head{padding:7px 10px;box-shadow:inset 4px 0 0 var(--ink3)}
.nd.k-head.own-owned{box-shadow:inset 4px 0 0 var(--ink)}
.nd.k-head .t{font-size:14px}
.nd .hb{display:flex;height:4px;margin:5px 0 3px;border-radius:2px;overflow:hidden;gap:1px;background:var(--grid)}
.nd .hb i{display:block;height:100%}
.nd .r3{display:flex;align-items:center;gap:10px;height:20px;font-size:12px;color:var(--ink2);white-space:nowrap;min-width:0}
.nd .r3 .ln{border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font-size:12px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.nd .r3 .ln b{font:600 13px var(--num)}
.nd .r3 .cp{margin-left:auto}
.nd.k-compact{padding:7px 10px;background:var(--panel);box-shadow:inset 4px 0 0 var(--line)}
.nd.k-compact .t{font-weight:500}
.nd.k-compact .kz{font-size:11.5px;color:var(--ink3);flex:none}
.nd.k-dot{border:0;background:none;padding:3px 6px;box-shadow:none}
.nd.k-dot .t{font-weight:400;font-size:12px;color:var(--ink2)}
.nd.k-dot .r1{height:18px}
.nd.card{background:var(--hl);color:var(--hl-ink);border:0;padding:7px 10px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:none}
.nd.card .s,.nd.card .h,.nd.card .r3,.nd.card .r3 .ln{color:var(--hl-ink)}
.nd.card .h{opacity:.8}
.nd.card.inf{background:var(--sheet);color:var(--ink);border:2px dashed var(--tether)}
.nd.card.inf .s,.nd.card.inf .h,.nd.card.inf .r3,.nd.card.inf .r3 .ln{color:var(--ink2)}
.nd .ask{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.nd .ask code{font:11.5px var(--mono)}
.nd .acts{display:flex;gap:4px;align-items:center;height:24px;white-space:nowrap}
.nd .acts .cd{font:600 14px/1 var(--num);font-variant-numeric:tabular-nums;margin-right:auto}
.nd .acts .cd.sm{font:500 12px var(--ui)}
.mini{border:1px solid currentColor;background:none;border-radius:3px;padding:0 5px;font-size:11.5px;cursor:pointer;line-height:18px;white-space:nowrap;flex:none}
.mini.solid{background:var(--hl-ink);color:var(--hl);border-color:var(--hl-ink)}
.nd.card.inf .mini.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cp{flex:none;display:inline-flex;align-items:center;gap:4px;height:18px;line-height:16px;position:relative;overflow:hidden;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:0 7px 0 5px;cursor:pointer;font:600 12px var(--num);white-space:nowrap}
.cp .g{width:8px;height:8px}
.cp .cu{font:500 11px var(--ui);color:var(--ink2);margin-left:2px}
.cp .bar{position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:0;gap:0}
.cp:hover{border-color:var(--ink)}
.cp.blast{outline:2px solid var(--err)}
.nd.card .cp{background:transparent;border-color:currentColor;color:inherit}
.bar{display:flex;height:4px;border-radius:2px;overflow:hidden;gap:1px}
.bar i{display:block;height:100%}
.stage.dim .nd:not(.onc){opacity:.42}
.stage.dim .nd.card{opacity:1}
.nd.sel{outline:3px solid var(--ink);outline-offset:3px}
.nd.blast{outline:2px solid var(--err);outline-offset:2px;opacity:1}

/* 状态字形：实心=登记；虚线=推测；斜纹=未知 */
.g{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block;vertical-align:-1px}
.g.running{background:var(--ink)}
.g.inferred{border:1.6px dashed var(--ink)}
.g.unknown,.g.unread{border:1px dotted var(--ink2);background:repeating-linear-gradient(135deg,var(--ink3) 0 1.2px,transparent 1.2px 3.4px)}
.g.idle{border:1.6px solid var(--ink2)}
.g.reported{border-radius:2px;border:1.6px solid var(--ink2);background:linear-gradient(to bottom right,transparent 46%,var(--ink2) 48% 54%,transparent 56%)}
.g.error{background:var(--err);border-radius:1px;width:9px;height:9px;transform:rotate(45deg)}
.g.waiting{background:var(--hl);border:1.6px solid var(--hl-ink)}
.g.braked{border-radius:1px;border:3px solid var(--ink2);width:10px;height:10px}
.g.ended{border:1.6px solid var(--ink3);background:radial-gradient(var(--ink3) 0 28%,transparent 32%)}
.g.spawning{border:1.6px dashed var(--ink);background:radial-gradient(var(--ink) 0 26%,transparent 30%)}

/* 边 */
.e{fill:none;stroke:var(--ink3);stroke-width:1.3;transition:opacity .2s}
.e.del{stroke:var(--ink2);stroke-width:1.7}
.e.struct{stroke:var(--line);stroke-width:1.2}
.e.orphan{stroke:var(--err);stroke-width:1.6;stroke-dasharray:5 4}
.stage.dim .e:not(.chain):not(.blastE){opacity:.3}
.e.chain{stroke:var(--ink);stroke-width:2.6;opacity:1}
.e.blastE{stroke:var(--err);stroke-width:2.4}
.chev{fill:var(--ink2)}
.chev.orph{fill:var(--err)}
.stage.dim .chev:not(.chain){opacity:.3}
.chev.chain{fill:var(--ink)}
.wch{fill:none;stroke:var(--tether);stroke-width:1.5;stroke-linecap:round;transition:stroke-width .15s}
.wch.inf{stroke-dasharray:4 4}
.wch.hot{stroke-width:3.4;opacity:1 !important}
.parcel rect{fill:var(--sheet);stroke:var(--ink);stroke-width:1.3}
.parcel path{fill:none;stroke:var(--ink);stroke-width:1.1}
.parcel .torn{fill:var(--sheet);stroke:var(--err);stroke-width:1.3}
.stack rect{fill:var(--sheet);stroke:var(--ink2);stroke-width:1.1}
.stack text{font:600 10.5px var(--num);fill:var(--ink2)}
.mdot{fill:var(--ink2)}
.fxdot{fill:var(--ink)}
.fxdot.rep{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}
.fxring{fill:none;stroke:var(--hl);stroke-width:3}
.fxring.err{stroke:var(--err)}

/* 时间轴 */
.tl{grid-row:3;grid-column:1;border-top:1px solid var(--line);display:flex;flex-direction:column;padding:4px 16px 4px;min-width:0;background:var(--paper)}
.since{display:flex;align-items:center;gap:10px;font-size:13px;white-space:nowrap;overflow:hidden;min-width:0}
.since .lbl{color:var(--ink2)}
.since button.num{border:0;background:none;cursor:pointer;padding:0 2px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.since button.num b{font:600 15px var(--num)}
.since .sp{flex:1}
.tlsvg{flex:1;width:100%;min-height:30px;display:block;cursor:default}
.tlsvg .ax{stroke:var(--line)}
.tlsvg text{font:10.5px var(--num);fill:var(--ink3)}
.tlsvg .hist{fill:var(--grid)}
.tlsvg .seen{fill:var(--ink);cursor:ew-resize}
.tlsvg .seenline{stroke:var(--ink);stroke-width:1.5}
.tlsvg .seenwash{fill:var(--band)}

/* 右栏 */
.panel{grid-row:2/4;grid-column:2;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px 18px 28px;min-width:0}
.pclose{display:none;float:right;border:1px solid var(--line);background:none;border-radius:4px;padding:2px 9px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.panel h2{font-size:17px;margin:0 0 4px;line-height:1.35}
.panel h3{font-size:13px;margin:18px 0 6px;color:var(--ink2);font-weight:600}
.panel p{margin:4px 0}
.crumbs{font-size:12px;color:var(--ink2);line-height:1.7}
.crumbs button{border:0;background:none;padding:0;cursor:pointer;color:var(--ink2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px;font-size:12px}
.crumbs .sep{margin:0 4px;color:var(--ink3)}
.kv{display:grid;grid-template-columns:72px 1fr;gap:3px 10px;font-size:13px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ulink{border:0;background:none;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px;font-size:13px}
.quote{border-left:3px solid var(--line);padding:4px 10px;margin:6px 0;font-size:13px}
.quote cite{display:block;font-style:normal;color:var(--ink2);font-size:12px;margin-top:2px}
.trunc{font-size:12.5px;color:var(--err);margin:4px 0}
.refs{margin:4px 0 0;padding:0;list-style:none;font:12px var(--mono)}
.refs li{padding:2px 0;color:var(--ink2)}
.rows{list-style:none;margin:0;padding:0}
.rows li{border-top:1px solid var(--line);padding:6px 0;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.rows li button.link{border:0;background:none;padding:0;cursor:pointer;text-align:left;flex:1;min-width:0}
.rows .tm{font:12px var(--num);color:var(--ink3);flex:none;width:38px;padding-top:2px}
.rows .meta{color:var(--ink2);font-size:12px}
.acts2{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:1px solid var(--ink);background:none;border-radius:4px;padding:5px 12px;cursor:pointer;font-size:13px}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.warn{border-color:var(--err);color:var(--err)}
.btn.warn.armed{background:var(--err);color:var(--sheet)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--hl);pointer-events:none}
.hold span{position:relative}
.hold.holding i{width:100%;transition:width 1s linear}
.hold.holding span{color:var(--hl-ink)}
.note{font-size:12.5px;color:var(--ink2)}
.ro{font-size:13px;border:1px dashed var(--line);border-radius:4px;padding:8px 10px;color:var(--ink2);margin-top:10px}
.sheet-cd{font:600 40px/1 var(--num);font-variant-numeric:tabular-nums}
.sheet-cd small{font:400 14px var(--ui);margin-left:6px;color:var(--ink2)}
.timebar{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin:6px 0 10px}
.timebar i{display:block;height:100%;background:var(--hl)}
pre.cmd{font:12.5px/1.5 var(--mono);background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}
.confirm{display:block;margin-top:10px;font-size:13px}
.confirm input{width:100%;margin-top:4px;font:14px var(--ui);padding:6px 8px;border:1px solid var(--ink);border-radius:4px;background:var(--sheet);color:var(--ink)}
.lock{font-size:12px;color:var(--err);min-height:18px}
.leg{display:grid;grid-template-columns:24px 1fr;gap:5px 8px;font-size:12.5px;align-items:center}
.leg svg{display:block}
.wl{border-top:1px solid var(--line);padding:8px 0}
.wl .hd{display:flex;align-items:center;gap:6px;cursor:pointer;border:0;background:none;padding:0;width:100%;text-align:left}
.wl .hd .t{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl .hd .h{font-size:11px;color:var(--ink3)}
.wl .bar{height:6px;margin:5px 0 4px}
.wl .cnt{font-size:12px;color:var(--ink2);line-height:1.8}
.wl .cnt button{border:0;background:none;padding:0 1px;cursor:pointer;color:var(--ink);font-size:12px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
textarea,select{font:14px var(--ui);color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%}
textarea{min-height:72px;resize:vertical}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:4px;padding:6px 8px;margin:6px 0;cursor:pointer;font-size:13px;background:var(--sheet)}
.opt input{margin-top:3px}
.draft{display:block;width:100%;text-align:left;border:1px dashed var(--line);background:none;border-radius:4px;padding:6px 8px;margin:4px 0;cursor:pointer;font-size:12.5px}
.rule{font-size:12px;color:var(--ink2);margin:2px 0}

.toast{position:absolute;left:244px;bottom:14px;background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:4px;font-size:13px;max-width:440px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:none}
.conv{position:absolute;inset:0;background:var(--paper);z-index:15;display:none;flex-direction:column}
.conv.on{display:flex}
.conv header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.conv .log{flex:1;overflow:auto;padding:12px 16px;max-width:760px}
.conv .msg{border-left:2px solid var(--line);padding:4px 10px;margin:6px 0;font-size:13.5px}
.conv .msg .meta{font-size:12px;color:var(--ink2)}
.conv footer{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;max-width:760px}
.narrow{display:none}

/* 1400 以下：右栏改成浮层，把宽度让给图 */
@media (min-width:761px){
  .app.float{grid-template-columns:minmax(0,1fr)}
  .app.float #ovBtn{display:inline-block}
  .app.float .pclose{display:inline-block}
  .app.float .panel{position:fixed;right:0;top:52px;bottom:0;width:min(380px,92vw);z-index:30;transform:translateX(105%);transition:transform .18s;box-shadow:-12px 0 32px rgba(0,0,0,.2)}
  .app.float.popen .panel{transform:none}
}

  .brand small,.dispatch kbd{display:none}

}

  .app{display:block;height:auto}
  .top{flex-wrap:wrap;height:auto;padding:8px 16px;gap:8px}

  .chips{flex-wrap:wrap}

}
.narrow h3{font-size:13px;color:var(--ink2);margin:10px 0 6px}
.nq{display:flex;gap:10px;align-items:center;width:100%;border:0;border-radius:5px;background:var(--hl);color:var(--hl-ink);padding:8px 10px;margin:6px 0;text-align:left;cursor:pointer}
.nq.inf{background:none;border:2px dashed var(--tether);color:var(--ink)}

.nq .x .p{font-size:11.5px;opacity:.75}
@media (prefers-reduced-motion:reduce){.nd,.toast,.e,.wch,.panel{transition:none}}

<body>
<div class="app" id="app">
  <div class="top">
    <div class="brand">Orchestra<small>活图</small></div>
    <div class="chips" id="chips"></div>
    <div class="grow"></div>
    <div class="seg" role="group" aria-label="数据"><button data-mode="rich" aria-pressed="true">丰富态</button><button data-mode="poor" aria-pressed="false">贫瘠态</button></div>
    <div class="seg" role="group" aria-label="收拢程度" id="dens"><button data-d="0">只看要紧的</button><button data-d="1">加上最近交接</button><button data-d="2">全部展开</button></div>
    <button class="tool" id="motion" aria-pressed="true">动效 开</button>
    <button class="tool" id="theme">深浅</button>
    <button class="tool" id="ovBtn">工作线与图例</button>
    <button class="dispatch" id="dispatchBtn">派活<kbd>n</kbd></button>
    <div class="mark">
      <details>
        <summary>方案 12-graph-canvas：活图画布</summary>
        <div class="about" id="about"></div>
      </details>
      <a href="../index.html">返回画廊</a>
    </div>
  </div>
  <div class="work" id="work">
    <section class="wall" id="wall" aria-label="你和等你的事"></section>
    <div class="graph" id="graph"><div id="stageSize"><div class="stage" id="stage"></div></div></div>
    <svg class="tov" id="tov" aria-hidden="true"></svg>
    <div class="conv" id="conv"></div>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <div class="narrow" id="narrow"></div>
  <div class="tl">
    <div class="since" id="since"></div>
    <svg class="tlsvg" id="tlsvg" aria-label="三小时时间轴"></svg>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
<script>
(function(){
'use strict';
var S = window.SCENARIO;
var NOW0 = Date.parse(S.meta.now), WIN0 = Date.parse(S.meta.windowStart);
var MIN = 60000;
var perf = function(){ return (typeof performance !== 'undefined') ? performance.now() : Date.now(); };
var perfBase = perf();
function now(){ return NOW0 + (perf() - perfBase); }

/* ---------- 文案 ---------- */
var HS = { claude:'CC', codex:'CX', dsh:'DSH' };
var OWN = { owned:'自有', observed:'只读', foreign:'来源不明' };
var STATE_WORD = { running:'在跑', waiting:'等你', idle:'空闲', reported:'已回报', error:'出错', unknown:'状态未知', braked:'被刹住', ended:'已结束', spawning:'已派出，等接手', inferred:'≈ 可能在等你', unread:'因上限未读入',
  settling:'≈ 在跑，等守护进程确认', stillwait:'≈ 可能还在等（你处理过）', rescan:'状态待下一次扫描' };
var SEV = ['error','waiting','inferred','stillwait','settling','unknown','rescan','unread','spawning','running','idle','reported','braked','ended'];
var BARC = { error:'var(--err)', waiting:'var(--hl)', inferred:'var(--tether)', stillwait:'var(--tether)', settling:'var(--ink2)', unknown:'var(--ink3)', rescan:'var(--ink3)', unread:'var(--ink3)', spawning:'var(--ink)', running:'var(--ink)', idle:'var(--ink2)', reported:'var(--ink2)', braked:'var(--line)', ended:'var(--line)' };
var GLY = { settling:'inferred', stillwait:'inferred', rescan:'unknown' };
var KIND_WORD = { approval:{command:'批准命令', write:'批准写文件'}, seat:'派会话请求', question:'回答提问', inferred:'≈ 可能在等你' };
var DECIDED = { approved:'已批准', rejected:'已拒绝', expired:'超时自动拒', dispatched:'已派出', answered:'已回答', dismissed:'已移出队列', braked:'因刹车撤销' };

function pad2(n){ return (n<10?'0':'')+n; }
function clock(ms){ var d=new Date(ms + 8*3600000); return pad2(d.getUTCHours())+':'+pad2(d.getUTCMinutes()); }
function left(ms){ if(ms<0) ms=0; var s=Math.floor(ms/1000); return Math.floor(s/60)+':'+pad2(s%60); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function iso(ms){ var d=new Date(ms+8*3600000); return d.toISOString().slice(0,19)+'+08:00'; }
function bare(t){ return String(t||'').replace(/ · 领头$/,''); }
function cut(s,n){ s=bare(s); return s.length>n ? s.slice(0,n-1)+'…' : s; }
function glyphCls(vs){ return GLY[vs]||vs; }
function kindWord(a){ return a.kind==='approval' ? KIND_WORD.approval[a.subkind] : KIND_WORD[a.kind]; }

/* ---------- 你做过的事（跨两态保留） ---------- */
var ACT = { resolved:{}, dispatched:[], braked:{}, seq:0 };

/* ---------- 两种数据底子 ---------- */
function cloneNode(n){ var c={}; for(var k in n) c[k]=n[k]; c.children=(n.children||[]).slice(); return c; }
function baseRich(){
  return { nodes:S.nodes.map(cloneNode), events:S.events.slice(), attention:S.attention.map(function(a){ return Object.assign({},a); }), trimmed:0 };
}
/* 贫瘠态：按简报 §7.4 那次真实抽样的形状生成（数字原样用），节点名字、请求、回报都取自 SCENARIO */
var POOR = { mains:24, alive:13, running:3, subs:[16,14,12,11,9,8,8,7,6,5,4,3,3,2,1,1,1],
  known:['paper.data.dl','paper.train.ablate.k64'], trimmed:718, dsh:92, ownedAttn:'ap-1', seatAttn:'seat-1', guessAttn:'inf-1', guessAt:3 };
function basePoor(){
  var src = new Map(S.nodes.map(function(n){ return [n.id,n]; }));
  var att = function(id){ return S.attention.filter(function(a){ return a.id===id; })[0]; };
  var aOwn=att(POOR.ownedAttn), aSeat=att(POOR.seatAttn), aGuess=att(POOR.guessAttn);
  var skip = new Set([aOwn.nodeId, aGuess.nodeId].concat(POOR.known));
  var pool = S.nodes.filter(function(n){ return n.harness!=='dsh' && !skip.has(n.id); });
  var nodes=[], events=[], pi=0;
  for(var i=0;i<POOR.mains;i++){
    var s = i===POOR.guessAt ? src.get(aGuess.nodeId) : pool[(pi++) % pool.length];
    var alive = i<POOR.alive;
    var st = i<POOR.running ? 'running' : i===POOR.guessAt ? 'waiting' : alive ? 'idle' : 'unknown';
    var m = { id:'pm'+i, parent:'you', depth:1, project:s.project, harness:'claude', ownership:'observed', role:'unknown', model:null,
      title:bare(s.title), task:null, state:st, messages:alive?s.messages:null, tokens:alive?s.tokens:null, costUsd:null, children:[], report:null,
      stateDetail: st==='waiting' ? { kind:'inferred', why:aGuess.why } : st==='idle' ? { kind:'idle', why:'registry 登记：在等输入' } : st==='unknown' ? { kind:'unknown', why:'不在 registry 里；会话文件还在，不知道它还活着没有' } : null };
    nodes.push(m);
    var k = POOR.subs[i]||0;
    for(var j=0;j<k;j++){
      var kn = (i===0 && j<POOR.known.length) ? src.get(POOR.known[j]) : null;
      var c = { id:m.id+'.s'+(j+1), parent:m.id, depth:2, project:m.project, harness:'claude', ownership:'observed', role:'unknown', model:null,
        title: kn ? kn.title : '子代理 '+(j+1), task: kn ? kn.task : null, state: kn ? kn.state : 'unknown', messages:null, tokens:null, costUsd:null, children:[],
        report: kn && kn.report ? Object.assign({}, kn.report, { to:m.id }) : null,
        stateDetail: kn ? null : { kind:'unknown', why:'只知道它属于哪个主会话（按会话文件的位置）；不知道是哪次派活派出的，也不知道它在不在跑' } };
      nodes.push(c); m.children.push(c.id);
      if(kn) S.events.forEach(function(e){
        if(!((e.type==='delegate' && e.to===kn.id) || (e.type==='report' && e.from===kn.id))) return;
        var x = Object.assign({}, e, { id:'p-'+e.id });
        if(x.type==='delegate'){ x.from=m.id; x.to=c.id; } else { x.from=c.id; x.to=m.id; }
        events.push(x);
      });
    }
  }
  var so = src.get(aOwn.nodeId);
  var own = Object.assign(cloneNode(so), { id:'po.own', parent:'you', depth:1, children:[] });
  nodes.push(own);
  events.push({ t:so.spawnedAt, type:'delegate', from:'you', to:own.id, task:so.task, via:'orchestra', id:'p-own-del' });
  events.push({ t:aOwn.openedAt, type:'approval', node:own.id, subkind:aOwn.subkind, risk:aOwn.risk, ask:aOwn.ask, deadline:aOwn.deadline, id:'p-own-ap' });
  var ids=[]; for(var d=1; d<=POOR.dsh; d++) ids.push('DSH 会话文件 '+d);
  nodes.push({ id:'dsh.unread', parent:'you', depth:1, project:'dshplug', harness:'dsh', ownership:'observed', role:'unknown', model:null,
    title:'DeepSeek Harness 会话', task:null, state:'unread', messages:null, tokens:null, costUsd:null, children:[], report:null, unreadIds:ids,
    stateDetail:{ kind:'unread', why:'磁盘上有 '+ids.length+' 个会话，因上限一个也没读入；状态、父级、派活关系都未知' } });
  events.push({ t:aSeat.openedAt, type:'seat_request', node:null, requesterClaimed:aSeat.requesterClaimed, verified:false, ask:aSeat.ask, deadline:aSeat.deadline, id:'p-seat' });
  var attention = [
    Object.assign({}, aOwn, { nodeId:own.id }),
    Object.assign({}, aSeat, { nodeId:null, anchor:'dsh.unread', chainUnknown:true }),
    Object.assign({}, aGuess, { nodeId:'pm'+POOR.guessAt })
  ];
  return { nodes:nodes, events:events, attention:attention, trimmed:POOR.trimmed };
}

/* ---------- 世界：数据底子 + 你的动作 = 当前状态 ---------- */
function buildWorld(mode){
  var B = mode==='poor' ? basePoor() : baseRich();
  var W = { mode:mode, nodes:B.nodes, events:B.events, trimmed:B.trimmed };
  var byId = W.byId = new Map(W.nodes.map(function(n){ return [n.id,n]; }));
  // 你派出的
  ACT.dispatched.forEach(function(d){
    var p = d.parent==='you' ? null : byId.get(d.parent);
    if(d.parent!=='you' && !p) return;
    var n = { id:d.id, parent:d.parent, depth:(p?p.depth:0)+1, project:p?p.project:d.project, harness:d.harness, ownership:'owned', role:'unknown',
      model:d.model, title:d.title, task:d.task, state:'spawning', spawnedAt:iso(d.at), since:iso(d.at), lastActivity:iso(d.at),
      tokens:0, costUsd:0, messages:0, children:[], report:null, fromSeat:d.fromSeat||null,
      stateDetail:{ kind:'spawning', why:'Orchestra 已开会话，还没收到它的第一条输出' } };
    W.nodes.push(n); byId.set(n.id,n); if(p) p.children.push(n.id);
    W.events.push({ t:iso(d.at), type:'delegate', from:d.fromSeat ? d.parent : 'you', to:n.id, task:d.task, via:'orchestra', id:'mine-'+d.id, mine:true });
  });
  // 刹车：只停得了自有会话；只读会话照原样画，要去它自己的界面停
  Object.keys(ACT.braked).forEach(function(id){
    if(!byId.get(id)) return;
    var at = ACT.braked[id];
    subtree(W,id).forEach(function(n){
      if(n.ownership!=='owned' || n.state==='ended') return;
      n.state='braked'; n.stateDetail={ kind:'braked', by:'you', why:'你在 '+clock(at)+' 刹住（连同它的进程树）' };
    });
    W.events.push({ t:iso(at), type:'brake', node:id, by:'you', id:'mine-brake-'+id, mine:true });
  });
  // 已处理的等你条目：人的一次点击不是守护进程的事实，处理后的状态一律标成推测或待扫描
  W.attention = B.attention.filter(function(a){
    var r = ACT.resolved[a.id];
    var n = a.nodeId ? byId.get(a.nodeId) : null;
    if(n && n.state==='braked' && !r){ ACT.resolved[a.id] = r = { decision:'braked', at:now() }; }
    if(!r) return true;
    if(n && n.state!=='braked'){
      var at=clock(r.at);
      var note = ({ approved:'你在 '+at+' 批准了它的请求', rejected:'你在 '+at+' 拒绝了它的请求', expired:'请求在 '+at+' 超时，已自动拒',
        dispatched:'你在 '+at+' 派出了它请求的会话', answered: n.ownership==='owned' ? '你在 '+at+' 回答：'+(r.answer||'') : '你在 '+at+' 说已在原界面答复',
        dismissed:'你在 '+at+' 看过这条推测，移出了队列' })[r.decision];
      if(n.ownership!=='owned'){ n.state='stillwait'; }
      else if(r.decision==='approved' || r.decision==='answered' || r.decision==='dispatched'){ n.state='settling'; }
      else { n.state='rescan'; n.rescanShort = r.decision==='expired' ? '刚超时被拒，待扫描' : '刚被拒，待扫描'; }
      n.note = note; n.stateDetail = { kind:n.state, why:note };
    }
    W.events.push({ t:iso(r.at), type:'resolution', node:a.nodeId, attn:a.id, decision:r.decision, id:'mine-res-'+a.id, mine:true });
    return false;
  });
  W.attention.sort(function(a,b){
    var da=a.deadline?Date.parse(a.deadline):Infinity, db=b.deadline?Date.parse(b.deadline):Infinity;
    if(da!==db) return da-db; return Date.parse(a.openedAt)-Date.parse(b.openedAt);
  });
  W.attnByNode = new Map(); W.attention.forEach(function(a){ W.attnByNode.set(a.anchor||a.nodeId, a); });
  W.attnTargets = new Set(W.attention.map(function(a){ return a.nodeId; }).filter(Boolean));
  W.events.sort(function(a,b){ return Date.parse(a.t)-Date.parse(b.t); });
  return W;
}
function subtree(W,id){ var out=[]; (function walk(i){ var n=W.byId.get(i); if(!n) return; out.push(n); n.children.forEach(walk); })(id); return out; }
function ancestors(W,id){ var out=[]; var n=id?W.byId.get(id):null; while(n){ out.unshift(n); n = n.parent==='you'?null:W.byId.get(n.parent); } return out; }
function nameOf(W,id){ if(id==='you') return '你'; if(id==null) return '来路未知的 DSH 会话'; var n=W.byId.get(id); return n?n.title:id; }
function repsOf(W,id){ return subtree(W,id).filter(function(m){ return m.report && m.state!=='braked'; }); }
function kidsPhrase(W,n){
  if(n.state==='unread') return '子会话：未知（没读入）';
  if(n.state==='unknown' || n.ownership==='foreign') return '子会话：未知';
  if(W.mode==='poor' && n.ownership!=='owned') return '没读到子会话（可能被快照上限裁掉）';
  return '登记里没有子会话';
}

/* 节点的可见状态 */
function vstate(W,n){
  if(n.state==='unread') return 'unread';
  var a = W.attnByNode.get(n.id);
  if(a && a.kind==='inferred') return 'inferred';
  if(a) return 'waiting';
  if(n.state==='waiting') return 'stillwait';
  return n.state;
}
function isOrphan(W,n){
  var p = n.parent==='you'?null:W.byId.get(n.parent);
  return !!p && ['error','ended','braked'].indexOf(p.state)>=0 && ['running','unknown','idle'].indexOf(n.state)>=0;
}
/* P4：子树里有等你的事时，往上推一级「可能在等谁」 */
function waitingKids(W,n){
  return n.children.map(function(c){ return W.byId.get(c); }).filter(function(k){
    return k && subtree(W,k.id).some(function(m){ return W.attnTargets.has(m.id); });
  });
}
function upWait(W,n){
  var vs=vstate(W,n); if(['running','idle','settling'].indexOf(vs)<0) return null;
  var wk=waitingKids(W,n); if(!wk.length) return null;
  var busy = n.children.some(function(c){ if(wk.some(function(k){ return k.id===c; })) return false; var k=W.byId.get(c); return k && ['running','spawning','settling'].indexOf(vstate(W,k))>=0; });
  return { child:wk[0], kids:wk, guess:!busy };
}

function applyHighlight(){
  if(!LAY) return;

function drawTether(a, focus){
  var svg=$('tov'); if(!svg) return;
  if(!a || !focus || focus==='you'){ svg.innerHTML=''; return; }
  var head = focus; while(head.up) head = head.up;
  var tk = document.querySelector('#wall [data-tk="'+a.id+'"]'), hd = document.querySelector('#stage [data-node="'+head.id+'"]');

  var x1 = tr.right - wr.left, y1 = tr.top + tr.height/2 - wr.top;

}

    hold.addEventListener('pointerdown', function(ev){ ev.preventDefault(); start(); });
    ['pointerup','pointerleave','pointercancel','blur'].forEach(function(k){ hold.addEventListener(k, stop); });

function fly(fromIt, toIt, kind, delay, dur){

  else { el.setAttribute('r', kind==='del'?5:3.2); el.setAttribute('class','fxdot'); }
  var t0=null;

    if(t0===null) t0=ts; var p=(ts-t0-delay)/dur;

    if(!el.parentNode) fx.appendChild(el);
    var q=bez(a.x,a.y,b.x,b.y,p);
    if(kind==='rep'){ el.setAttribute('x',q.x-6); el.setAttribute('y',q.y-4.5); } else { el.setAttribute('cx',q.x); el.setAttribute('cy',q.y); }

  if(!V.motion || !it || it==='you') return;
  var fx=document.getElementById('fx'); if(!fx) return;
  var c=centerOf(it), el=document.createElementNS('http://www.w3.org/2000/svg','circle'); el.setAttribute('class','fxring '+(cls||''));
  el.setAttribute('cx',c.x); el.setAttribute('cy',c.y);
  var t0=null; function step(ts){ if(t0===null) t0=ts; var p=(ts-t0-delay)/700; if(p<0){ requestAnimationFrame(step); return; } if(p>1){ el.remove(); return; } if(!el.parentNode) fx.appendChild(el); el.setAttribute('r', 10+p*40); el.setAttribute('opacity', 1-p); requestAnimationFrame(step); }
  requestAnimationFrame(step);
}
function replay(){
  if(!V.motion){ toast('动效已关：打开「动效」再回放'); return; }
  var t=now(), from=V.lastSeen, span=Math.max(1,t-from), DUR=9000;
  var ev=W.events.filter(function(e){ var a=Date.parse(e.t); return a>=from && a<=t; });
  ev.forEach(function(e){
    var d=(Date.parse(e.t)-from)/span*DUR, A=LAY.anchor;
    if(e.type==='delegate') fly(A(e.from), A(e.to), 'del', d, 900);
    else if(e.type==='report') fly(A(e.from), A(e.to), 'rep', d, 900);
    else if(e.type==='message') fly(A(e.node), A(e.with), 'msg', d, 700);
    else if(e.type==='error') ring(A(e.node), 'err', d);
    else if(e.type==='approval'||e.type==='question'||e.type==='seat_request') ring(A(e.node), '', d);
  });
  toast('回放 '+clock(from)+' 到现在的 '+ev.length+' 个事件');
}
function flyNew(id){ if(!LAY) return; var it=LAY.byItem.get(id); if(!it) return; scrollToItem(it); fly(it.up || 'you', it, 'del', 60, 900); }
function scrollToItem(it){
  var g=$('graph'); if(!it || it==='you') return;
  var top=it.y*SC, bot=(it.y+it.bh)*SC;
  if(top < g.scrollTop || bot > g.scrollTop+g.clientHeight) g.scrollTop = Math.max(0, top - g.clientHeight/3);
}

/* 对话页（J8） */
function openConv(id){
  var n=W.byId.get(id); if(!n) return;
  var msgs=W.events.filter(function(e){ return e.type==='message' && e.node===id; });
  var c=$('conv'); c.classList.add('on');
  c.innerHTML='<header><button class="btn" data-convclose="1">回到活图（Esc）</button><b>'+esc(bare(n.title))+'</b><span class="note">'+S.harnesses[n.harness].label+'，自有，'+msgs.reduce(function(s,e){return s+e.count;},0)+' 条消息</span></header>'+
    '<div class="log">'+crumbs(id)+msgs.map(function(e){ return '<div class="msg"><div class="meta">'+clock(Date.parse(e.t))+'，与 '+esc(bare(nameOf(W,e.with)))+' 往来 '+e.count+' 条，最后一条：</div>'+esc(e.last)+'</div>'; }).join('')+'</div>'+
    '<footer><textarea id="convIn" placeholder="直接给 '+esc(bare(n.title))+' 发消息"></textarea><button class="btn solid" data-send="1">发送</button></footer>';
}

/* 窄屏：墙变成最上面的一列票，图退成右栏里的工作线列表 */
function renderNarrow(){

/* 倒计时：每秒刷新；到点即自动拒（D8）；进入最后 5 分钟的票立刻换成紧急样式 */
setInterval(function(){
  var t=now(), expired=false;
  W.attention.forEach(function(a){ if(a.deadline && Date.parse(a.deadline)<=t){ ACT.resolved[a.id]={ decision:'expired', at:Date.parse(a.deadline) }; expired=true; toast('超时自动拒：'+(a.chainUnknown?'来路未知的 seat 请求':bare(nameOf(W,a.nodeId)))); } });
  if(expired){ refresh(); return; }
  document.querySelectorAll('[data-dl]').forEach(function(el){ el.textContent = left(+el.dataset.dl - t); });
  document.querySelectorAll('[data-tdl]').forEach(function(el){ el.classList.toggle('urgent', +el.dataset.tdl - t < 5*MIN); });
  document.querySelectorAll('[data-bar]').forEach(function(el){ var p=el.dataset.bar.split('|'); el.style.width=Math.max(0,Math.min(100,(+p[1]-t)/(+p[1]-+p[0])*100))+'%'; });
}, 1000);

var toastT=null;
function toast(msg){ var el=$('toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){ el.classList.remove('on'); },2600); }

/* ---------- 事件 ---------- */
var brakeArmedAt=0;
document.addEventListener('click', function(ev){
  var b = ev.target.closest('button,[data-cap],[data-node],[role=button]'); if(!b) {
    if(ev.target.closest('#graph')){ V.sel=null; V.selAttn=null; V.blast=null; V.panel='overview'; refresh(); }
    return;
  }
  var d=b.dataset;
  if(b.id==='hold') return;
  if(d.mode){ V.mode=d.mode; V.sel=null; V.selAttn=null; V.blast=null; V.panel='overview'; document.querySelectorAll('[data-mode]').forEach(function(x){ x.setAttribute('aria-pressed', String(x.dataset.mode===V.mode)); }); refresh(); return; }
  if(d.d!==undefined && b.closest('#dens')){ V.density=+d.d; syncDens(); refresh(); return; }
  if(d.quickreject){ ev.stopPropagation(); if(locked()){ toast('队列刚变过，稍等片刻再点'); return; } decide(d.quickreject,'rejected'); return; }
  if(d.attn){
    ev.stopPropagation(); V.selAttn=d.attn; var at=W.attention.filter(function(x){return x.id===d.attn;})[0];
    V.sel = at && at.nodeId && W.byId.get(at.nodeId) ? at.nodeId : null; V.blast=null; V.panel='attn'; refresh();
    if(at && LAY) scrollToItem(LAY.anchor(at.anchor||at.nodeId)); applyHighlight(); return;
  }
  if(d.decide){ if(d.locked || locked()) return; decide(V.selAttn, d.decide, d.answer); return; }
  if(d.cap){ ev.stopPropagation(); var own=LAY.byItem.get(d.cap); if(!own||!own.cap) return; var it=own.cap; openList('收拢的 '+it.members.length+' 个会话（在「'+bare(it.parent.title)+'」下面）', it.members.map(rowNode), { cap:d.cap, note:'它们平静：没有等你、没有出错'+(V.density?'、最近 20 分钟没有交接':'') }); return; }
  if(d.expand){ V.expanded.add(d.expand); refresh(); return; }
  if(d.pclose){ V.ovOpen=false; V.panel='overview'; V.blast=null; refresh(); return; }
  if(d.act==='dispatch'){ openDispatch(d.parent); return; }
  if(d.act==='brake'){ V.blast=d.id; V.panel='brake'; brakeArmedAt=0; refresh(); return; }
  if(d.close){ V.blast=null; V.panel = V.sel?'node':'overview'; refresh(); return; }
  if(d.draft){ var dr=S.dispatch.drafts.filter(function(x){return x.id===d.draft;})[0]; DF.text=dr.text; DF.draft=dr.id; DF.parent = dr.suggestedParent && W.byId.get(dr.suggestedParent) ? dr.suggestedParent : 'you'; V.panel='dispatch'; syncFloat(); renderPanel(); return; }
  if(b.id==='dfGo'){ doDispatch(); return; }
  if(b.id==='brakeGo'){
    var t=perf();
    if(t-brakeArmedAt<3000){ ACT.braked[V.blast]=now(); toast('已刹车：'+bare(nameOf(W,V.blast))+' 和它下面的自有会话'); V.sel=V.blast; V.blast=null; V.panel='node'; refresh(); return; }
    brakeArmedAt=t; b.classList.add('armed'); b.textContent='再点一次确认刹车'; setTimeout(function(){ if(b.isConnected){ b.classList.remove('armed'); b.textContent='刹车（3 秒内再点一次）'; } },3000); return;
  }
  if(d.stop){ toast(d.stop==='turn'?'已发出：中断这一回合（mock，没有真的执行）':'已发出：结束会话（mock，没有真的执行）'); return; }
  if(d.conv){ openConv(d.conv); return; }
  if(d.convclose){ $('conv').classList.remove('on'); return; }
  if(d.send){ toast('mock：消息没有真的发出'); var ci=$('convIn'); if(ci) ci.value=''; return; }
  if(d.copy){ try{ navigator.clipboard.writeText(d.copy); }catch(e){} toast('已复制：'+d.copy); return; }
  if(d.list){
    if(d.list==='attn') return openList('等你 '+W.attention.length+' 件', W.attention.map(function(a){ var p=pathOf(W,a); return '<li><i class="g '+(a.kind==='inferred'?'inferred':'waiting')+'"></i><button class="link" data-attn="'+a.id+'">'+esc(a.ask)+'<div class="meta">'+esc(p.path+' '+p.name)+(a.deadline?'，剩 '+left(Date.parse(a.deadline)-now()):'，无期限')+'</div></button></li>'; }));
    if(d.list==='err') return openList('出错', W.nodes.filter(function(n){return n.state==='error';}).map(rowNode), { note: listUnknown().length ? '只算已知的；状态未知的会话里也可能有出错的' : '' });
    if(d.list==='unk') return openList('状态未知', listUnknown().map(rowNode), { note:'不知道它们在跑还是停了，不是空闲' });
  }
  if(d.since){ var part=sinceSummary(W).filter(function(p){return p.key===d.since;})[0]; return openList('自 '+clock(V.lastSeen)+' 以来：'+part.label, part.list.map(rowEvent)); }
  if(d.sub){ var sp=d.sub.split('|'), mem=subtree(W,sp[0]).slice(1); if(sp[1]!=='*') mem=mem.filter(function(m){ return vstate(W,m)===sp[1]; }); return openList('「'+bare(nameOf(W,sp[0]))+'」下面'+(sp[1]==='*'?'':'：'+STATE_WORD[sp[1]]), mem.map(rowNode)); }
  if(d.reps){ var rs=repsOf(W,d.reps); return openList('「'+bare(nameOf(W,d.reps))+'」这条线的回报', rs.map(function(m){ return '<li><i class="g reported"></i><button class="link" data-node="'+m.id+'">'+esc(bare(m.title))+'：'+esc(m.report.status)+(m.report.truncated?'（已截断）':'')+'<div class="meta">交给 '+esc(bare(nameOf(W,m.report.to)))+'，'+clock(Date.parse(m.report.at))+'</div></button></li>'; })); }
  if(d.unread){ var u=unreadBlock(); if(!u) return; return openList('DeepSeek Harness：因上限未读入', u.unreadIds.map(function(id){ return '<li><i class="g unread"></i><span>'+esc(id)+'<div class="meta">没读入，内容未知</div></span></li>'; })); }
  if(d.msgs){ var ms=W.events.filter(function(e){ return e.type==='message' && e.node===d.msgs; }); return openList('「'+bare(nameOf(W,d.msgs))+'」的消息 '+ms.reduce(function(s,e){return s+e.count;},0)+' 条，分 '+ms.length+' 批', ms.map(rowEvent), { note:'一行一批，每批写明条数' }); }
  if(b.id==='replay'){ replay(); return; }
  if(b.id==='reset'){ perfBase=perf(); ACT.resolved={}; ACT.dispatched=[]; ACT.braked={}; V.sel=null; V.selAttn=null; V.blast=null; V.panel='overview'; V.expanded.clear(); lastQueueSig=''; refresh(); toast('时钟回到 '+clock(NOW0)+'，你的操作已清空'); return; }
  if(b.id==='motion'){ V.motion=!V.motion; syncMotion(); return; }
  if(b.id==='theme'){ var r=document.documentElement, cur=r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); r.dataset.theme = cur==='dark'?'light':'dark'; return; }
  if(b.id==='ovBtn'){ V.ovOpen = !(V.ovOpen && V.panel==='overview'); V.panel='overview'; refresh(); return; }
  if(b.id==='dispatchBtn'){ openDispatch(); return; }
  if(d.node){ V.sel=d.node; V.selAttn=null; V.blast=null; V.panel='node'; refresh(); return; }
});
document.addEventListener('keydown', function(ev){
  var tag=(ev.target.tagName||'').toLowerCase(); var typing = tag==='input'||tag==='textarea'||tag==='select';
  if(ev.key==='Escape'){ if($('conv').classList.contains('on')){ $('conv').classList.remove('on'); return; } V.sel=null; V.selAttn=null; V.blast=null; V.panel='overview'; V.ovOpen=false; refresh(); return; }
  if(typing) return;
  if(ev.key==='n' && !ev.ctrlKey && !ev.metaKey && !ev.altKey){ ev.preventDefault(); openDispatch(); }
  if((ev.key==='Enter'||ev.key===' ') && ev.target.dataset && (ev.target.dataset.node||ev.target.dataset.cap) && ev.target.getAttribute('role')==='button'){ ev.preventDefault(); ev.target.click(); }
});

/* 拖动「上次看」 */
(function(){
  var svg=$('tlsvg'), drag=false;

/* 直达链接：#sel=节点&attn=条目&mode=poor&d=2&blast=节点&panel=dispatch&draft=dr-1&conv=节点&theme=dark */

  var p={}; (location.hash||'').replace(/^#/,'').split('&').forEach(function(kv){ var i=kv.indexOf('='); if(i>0) p[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1)); });
  if(p.theme) document.documentElement.dataset.theme=p.theme;
  if(p.mode==='poor'){ V.mode='poor'; document.querySelectorAll('[data-mode]').forEach(function(x){ x.setAttribute('aria-pressed', String(x.dataset.mode==='poor')); }); }

  if(p.attn){ V.selAttn=p.attn; V.panel='attn'; var a=S.attention.filter(function(x){return x.id===p.attn;})[0]; if(a && V.mode==='rich') V.sel=a.nodeId; }

  if(p.panel==='dispatch'){ V.panel='dispatch'; if(p.draft){ var dr=S.dispatch.drafts.filter(function(x){return x.id===p.draft;})[0]; if(dr){ DF.text=dr.text; DF.draft=dr.id; DF.parent=dr.suggestedParent||'you'; } } }
  syncDens(); refresh();
  if(p.conv) openConv(p.conv);
})();
