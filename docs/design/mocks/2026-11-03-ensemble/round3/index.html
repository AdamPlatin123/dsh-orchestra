<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第三轮方案</title>
<link rel="stylesheet" href="../round2/kit.css">
<style>
.wrap{max-width:1040px;margin:0 auto;padding:0 24px 64px}
.top{display:flex;align-items:center;gap:16px;padding:18px 0;font-size:13px}
.top a{color:var(--ink-2)}
.top .sp{flex:1}
.tbtn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;color:var(--ink-2)}
h1{font-size:26px;line-height:1.3;margin:12px 0 8px;font-weight:600}
.lead{max-width:62ch;color:var(--ink-2);margin:0 0 24px}
.lv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.lv div{background:var(--panel);padding:14px 16px}
.lv h2{font-size:14.5px;margin:0 0 4px}
.lv p{margin:0;font-size:13px;color:var(--ink-2)}
.keeps{margin:0 0 32px;padding:10px 14px 10px 30px;background:var(--wait-soft);border-radius:8px;font-size:13.5px}
.m{display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px 28px;padding:20px 0;border-top:1px solid var(--line)}
.m h3{margin:0;font-size:17px;font-weight:600}
.m h3 a{color:var(--ink);text-decoration:none}
.m h3 a:hover{color:var(--act)}
.m .open{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:8px;background:var(--act);color:var(--act-ink);font-size:13px;text-decoration:none}
.m p{margin:0}
.m dl{margin:8px 0 0;display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 10px;font-size:13px;color:var(--ink-2)}
.m dt{color:var(--ink-3)}
.m dd{margin:0}
@media (max-width:760px){.lv{grid-template-columns:minmax(0,1fr)}.m{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="../round2/index.html">回到第二轮</a><span class="sp"></span><button class="tbtn" id="theme" type="button">切换深浅</button></div>
  <h1>第三轮：bot 式界面，派发时延伸</h1>
  <p class="lead">你那句话有三种读法，各做了一个。三个方案用同一份数据，都能回放同一次派发，也都有派活权限。</p>
  <div class="lv" id="lv"></div>
  <ul class="keeps" id="keeps"></ul>
  <div id="list"></div>
</div>
<script src="../round2/scenario2.js"></script>
<script src="scenario3.js"></script>
<script>
const MOCKS = [
  ['21-roster-panel.html', '通讯录加右栏', '最接近 DS-Bot。左栏是总台、worker、team 的列表，中间聊天。派发时折叠卡出现在聊天里，右栏边上露出提示，点开才占位。', '最安静，聊天不受打扰。', '派发多了要回各自的对话里找，合作感最弱。'],
  ['22-two-wings.html', '左 worker，右 team', '照字面做。左半边是 worker 和对话，右半边是常驻的 team 区。派发时从对话那一行拉线到右半边，折叠卡长在线的末端。', '派发的来路最清楚，一眼看到这个 worker 派了什么。', '右半边只讲当前 worker，看 Ren 时看不到 Aiko 的派发。'],
  ['23-reach-rows.html', '延伸行', '把延伸当主角。一个 worker 一行，派发时这一行向右长出折叠卡，对话从行里打开。', '全局一屏看完，谁派了什么、谁在等谁都在眼前。', '对话夹在两行之间，读长对话不舒服。'],
];
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
document.getElementById('lv').innerHTML = R3.levels.map((l) => '<div><h2>' + esc(l.label) + '</h2><p>' + esc(l.note) + '</p></div>').join('');
document.getElementById('keeps').innerHTML = R3.keeps.map((k) => '<li>' + esc(k) + '</li>').join('');
document.getElementById('list').innerHTML = MOCKS.map(([f, t, how, best, weak]) =>
  '<section class="m"><div><h3><a href="' + f + '">' + esc(t) + '</a></h3><a class="open" href="' + f + '">打开</a></div><div><p>' + esc(how) + '</p><dl><dt>最强</dt><dd>' + esc(best) + '</dd><dt>最弱</dt><dd>' + esc(weak) + '</dd></dl></div></section>').join('');
document.getElementById('theme').addEventListener('click', () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
});
</script>
</body>
</html>
