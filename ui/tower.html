<!doctype html>
<html lang="zh-CN" data-theme="auto" data-view="tower" data-ready="0" data-filter="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Orchestra</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23EEF1EF'/%3E%3Cpath d='M9 7v18M9 12h8M9 20h8M17 9v6M17 17v6' stroke='%231C2530' stroke-width='2' fill='none'/%3E%3Ccircle cx='23' cy='12' r='3' fill='%2358636F'/%3E%3Ccircle cx='23' cy='20' r='3' fill='%2358636F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/ui/tower.css">
<script type="module" src="/assets/ui/app.js"></script>
</head>
<body>
<header id="bar" class="bar">
  <h1 class="brand"><span class="mark" aria-hidden="true"></span><span class="brand-name" data-t="bar.brand"></span><span class="brand-sub" data-t="bar.sub"></span><span class="test" data-slot="test" data-hide="1" data-t="bar.test"></span></h1>
  <div class="counts" role="group" aria-labelledby="counts-l">
    <span id="counts-l" class="sr" data-t="bar.counts"></span>
    <button type="button" class="count" data-filter="waiting" aria-pressed="false" data-slot="waiting"></button>
    <button type="button" class="count" data-filter="error" aria-pressed="false" data-slot="error"></button>
    <button type="button" class="count" data-filter="running" aria-pressed="false" data-slot="running"></button>
  </div>
  <p class="srcs" data-slot="srcBox" data-hide="1"><span class="sr" data-t="bar.sources"></span><span class="src-list" data-slot="srcs"></span></p>
  <p class="fresh" data-slot="fresh" data-fresh="none"><span class="fdot" aria-hidden="true"></span><span data-slot="freshT"></span></p>
  <p class="ops"><button type="button" class="op" data-act="new" data-slot="new"></button><button type="button" class="op" data-act="unlock" data-slot="unlock"></button></p>
  <p class="nav"><button type="button" class="link" data-act="about" aria-pressed="false" data-slot="about"></button><button type="button" class="link" data-act="theme" data-slot="theme"></button></p>
</header>
<p id="alert" class="alert" role="alert" data-hide="1"></p>
<p id="note" class="note" role="status" data-hide="1"></p>
<p id="live" class="sr" aria-live="polite"></p>

<main id="main" class="main">
<section id="pins" class="pins" aria-labelledby="pins-h" data-hide="1">
  <h2 id="pins-h" class="pins-h"><span data-t="pin.title"></span><span class="pins-n" data-slot="n"></span><span class="pins-note" data-slot="note"></span></h2>
  <ol class="pin-list" data-slot="list"></ol>
</section>

<div class="split">
<section id="tower" class="tower" aria-labelledby="tower-h">
  <div class="tower-head">
    <h2 id="tower-h" tabindex="-1" data-t="tree.title"></h2>
    <p class="filter" data-slot="filterBox" data-hide="1"><span data-slot="filterT"></span><button type="button" class="link" data-act="clear" data-t="tree.clear"></button></p>
    <button type="button" class="changes" data-act="apply" data-slot="changes" data-hide="1" aria-describedby="changes-hint"></button><span id="changes-hint" class="sr" data-t="tree.changesHint"></span>
  </div>
  <p class="cols" aria-hidden="true"><span class="c-name" data-t="col.name"></span><span class="c-act" data-t="col.act"></span><span class="c-kids" data-t="col.kids"></span><span class="c-age" data-t="col.age"></span><span class="c-own" data-t="col.own"></span></p>
  <p class="router"><span class="r-ico" aria-hidden="true" data-t="router.icon"></span><span class="r-name" data-t="router.you"></span><span class="r-note" data-t="router.note"></span></p>
  <p id="tree-keys" class="sr" data-t="tree.keys"></p>
  <span id="tree-name" class="sr" data-t="tree.label"></span>
  <ul id="tree" class="tree" role="tree" aria-labelledby="tower-h tree-name" aria-describedby="tree-keys" data-slot="tree"></ul>
  <p class="empty" data-slot="empty" data-hide="1"></p>
  <p class="clip-note" data-slot="clipNote" data-hide="1"></p>
</section>

<aside id="detail" class="detail" aria-labelledby="dt-title" data-mode="empty">
  <p class="dt-nav"><button type="button" class="link back" data-act="back" data-t="detail.back"></button></p>
  <header class="dt-head">
    <span class="ico" aria-hidden="true" data-slot="ico"></span>
    <div class="dt-id"><h2 id="dt-title" tabindex="-1" data-slot="title"></h2><p class="dt-sub" data-slot="sub"></p></div>
  </header>
  <p class="dt-gone" data-slot="gone" data-hide="1"></p>
  <p class="dt-empty" data-slot="empty"></p>
  <dl class="facts" data-slot="facts"></dl>
  <section class="dt-sec" data-slot="actBox" data-hide="1"><h3 data-t="detail.activity"></h3><p class="dt-act" data-slot="act"></p></section>
  <section class="dt-sec own" data-slot="ownBox" data-hide="1">
    <p class="own-st" data-slot="ownSt"></p><p class="acts" data-slot="ownActs"></p>
    <h3 data-slot="cardsH" data-hide="1"></h3><ol class="cards" data-slot="cards"></ol>
    <section data-slot="chatBox" data-hide="1"><h3 id="chat-h" data-t="own.title"></h3><p class="ev-note" data-slot="chatNote"></p><ol class="chat" data-slot="chat" tabindex="0" aria-labelledby="chat-h"></ol><p class="sr" aria-live="polite" data-slot="chatSay"></p></section>
  </section>
  <section class="dt-sec" data-slot="evBox" data-hide="1"><h3 data-t="detail.events"></h3><p class="ev-note" data-slot="evNote"></p><ol class="events" data-slot="events"></ol><p class="dt-full"><button type="button" class="link" data-act="full" data-slot="full" data-t="detail.full"></button></p></section>
</aside>
</div>

<div id="dock" class="dock" aria-disabled="true">
  <p class="dock-to" id="dock-to" data-slot="to"></p>
  <p class="dock-st" data-slot="st"></p>
  <textarea id="dock-in" class="dock-in" rows="2" aria-labelledby="dock-to" data-slot="in" data-hide="1"></textarea>
  <p class="acts" data-slot="btns"></p>
  <p class="dock-note" data-slot="note"></p>
</div>
</main>

<section id="about" class="about" aria-labelledby="about-h" data-hide="1">
  <h2 id="about-h" data-t="about.title"></h2>
  <section class="ab-sec" aria-labelledby="ab-src-h">
    <h3 id="ab-src-h" data-t="about.sources"></h3>
    <table class="ab-table">
      <thead><tr><th data-t="about.colSrc"></th><th data-t="about.colState"></th><th data-t="about.colTotal"></th><th data-t="about.colShown"></th><th data-t="about.colClipped"></th><th data-t="about.colRegistry"></th></tr></thead>
      <tbody data-slot="srcRows"></tbody>
    </table>
    <p class="ab-note" data-t="about.srcNote"></p>
    <p class="ab-clip" data-slot="clipped"></p>
  </section>
  <section class="ab-sec" aria-labelledby="ab-rules-h">
    <h3 id="ab-rules-h" data-t="about.rules"></h3>
    <p class="ab-note" data-t="about.rulesNote"></p>
    <ul class="rules" data-slot="rules"></ul>
    <p class="ab-note" data-slot="noRules" data-hide="1"></p>
  </section>
  <section class="ab-sec" aria-labelledby="ab-h-h">
    <h3 id="ab-h-h" data-t="about.honest"></h3>
    <ul class="honest"><li data-t="about.h1"></li><li data-t="about.h2"></li><li data-t="about.h3"></li><li data-t="about.h4"></li><li data-t="about.h5"></li><li data-t="about.h6"></li><li data-t="about.h7"></li><li data-t="about.h8"></li><li data-t="about.h9"></li></ul>
  </section>
</section>

<dialog id="unlock-dlg" class="dlg" aria-labelledby="ul-h">
  <h2 id="ul-h" data-t="unlock.title"></h2>
  <p class="dlg-p" data-t="unlock.how"></p>
  <input id="ul-code" class="dlg-in" inputmode="numeric" autocomplete="one-time-code" maxlength="8" aria-labelledby="ul-h">
  <p class="dlg-msg" data-slot="msg" role="status"></p>
  <p class="acts"><button type="button" class="btn" data-act="unlockGo" data-t="unlock.go"></button><button type="button" class="btn" data-act="close" data-t="dlg.cancel"></button></p>
</dialog>
<dialog id="new-dlg" class="dlg" aria-labelledby="nw-h">
  <h2 id="nw-h" data-t="new.title"></h2>
  <label class="dlg-l" for="nw-text" data-t="new.task"></label>
  <textarea id="nw-text" class="dlg-in" rows="3"></textarea>
  <label class="dlg-l" for="nw-harness" data-t="new.harness"></label>
  <select id="nw-harness" class="dlg-in"><option value="codex" data-slot="hCodex" data-t="harness.codex"></option><option value="claude" data-slot="hClaude" data-t="harness.claude"></option></select>
  <p class="dlg-p" data-slot="why"></p>
  <label class="dlg-l" for="nw-model" data-t="new.model"></label>
  <select id="nw-model" class="dlg-in" data-slot="model"></select>
  <p class="dlg-p" data-t="new.cwd"></p>
  <p class="dlg-p" data-slot="note"></p>
  <p class="dlg-msg" data-slot="msg" role="status"></p>
  <p class="acts"><button type="button" class="btn" data-act="dispatch" data-slot="go"></button><button type="button" class="btn" data-act="close" data-t="dlg.cancel"></button></p>
</dialog>

<template id="tpl-btn"><button type="button" class="btn"></button></template>
<template id="tpl-opt"><option></option></template>
<template id="tpl-card"><li class="card" data-waiting="1"><p class="card-h"><span data-slot="kind"></span><span data-slot="left"></span></p><p class="card-t" data-slot="title"></p><pre class="pv" data-slot="pv"></pre><p class="card-note" data-slot="note"></p><p class="acts" data-slot="acts"></p></li></template>
<template id="tpl-msg"><li class="msg"><span class="msg-who" data-slot="who"></span><span class="msg-tx" data-slot="tx"></span></li></template>
<template id="tpl-tool"><li class="msg"><details><summary data-slot="sum"></summary><pre class="pv" data-slot="body"></pre></details></li></template>
<template id="tpl-src"><span class="src"><span class="sdot" aria-hidden="true"></span><span class="src-h" data-slot="h" aria-hidden="true"></span><span class="sr" data-slot="sr"></span></span></template>
<template id="tpl-pin"><li class="pin"><button type="button" class="pin-go"><span class="ico" aria-hidden="true" data-slot="ico"></span><span class="pin-kind" data-slot="kind"></span><span class="pin-path" data-slot="path"></span><span class="pin-clock" data-slot="clock"></span><span class="pin-hint" data-slot="hint"></span></button><span class="pin-pv" data-slot="pv"></span><span class="pin-acts" data-slot="acts"></span></li></template>
<template id="tpl-proj"><li class="row proj" role="treeitem" tabindex="-1"><span class="tw" aria-hidden="true"></span><span class="nm" data-slot="name"></span><span class="act" data-slot="act"></span><span class="kids" aria-hidden="true"><span class="k-e" data-slot="ke"></span><span class="k-w" data-slot="kw"></span></span><span class="sr" data-slot="kidsSr"></span></li></template>
<template id="tpl-group"><li class="row group" role="treeitem" tabindex="-1"><span class="ind" aria-hidden="true" data-slot="ind"></span><span class="tw" aria-hidden="true"></span><span class="ico" aria-hidden="true" data-slot="ico"></span><span class="nm" data-slot="name"></span><span class="act" data-slot="act"></span></li></template>
<template id="tpl-node"><li class="row node" role="treeitem" tabindex="-1">
<span class="line">
<span class="c1"><span class="ind" aria-hidden="true" data-slot="ind"></span><span class="tw" aria-hidden="true"></span><span class="ico" aria-hidden="true" data-slot="ico"></span>
<span class="name"><span class="nm" data-slot="name"></span><span class="approx" aria-hidden="true" data-slot="approx"></span><span class="sr" data-slot="srState"></span></span></span>
<span class="act" data-slot="act"></span>
<span class="kids" aria-hidden="true" data-slot="kids"><span class="k-c" data-slot="kc"></span><span class="k-e" data-slot="ke"></span><span class="k-w" data-slot="kw"></span></span><span class="sr" data-slot="kidsSr"></span>
<span class="age" data-slot="age"></span>
<span class="own" data-slot="own"></span>
</span>
<span class="peek"><span data-slot="pkState"></span><span data-slot="pkType"></span><span data-slot="pkAct"></span><span class="pk-mono" data-slot="pkSession"></span></span>
</li></template>
<template id="tpl-kv"><div class="kv"><dt data-slot="k"></dt><dd data-slot="v"></dd></div></template>
<template id="tpl-ev"><li class="ev"><span class="ev-at" data-slot="at"></span><span class="ev-ty" data-slot="ty"></span><span class="ev-tx" data-slot="tx"></span></li></template>
<template id="tpl-arow"><tr><th scope="row" data-slot="h"></th><td data-slot="st"></td><td class="num" data-slot="total"></td><td class="num" data-slot="shown"></td><td class="num" data-slot="clip"></td><td class="num" data-slot="reg"></td></tr></template>
<template id="tpl-rule"><li class="rule"><span class="rule-d" data-slot="d"></span><code class="rule-id" data-slot="id"></code><span class="rule-st" data-slot="st"></span><span class="rule-h" data-slot="hits"></span></li></template>
</body>
</html>
