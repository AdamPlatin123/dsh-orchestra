<!doctype html>
<html lang="zh-CN" data-theme="auto" data-view="stage" data-ready="0" data-fresh="live">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Stage</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='7' fill='%2323262f'/%3E%3Cpath d='M5 11H27M5 22H27' stroke='%235d6474' stroke-width='1.5'/%3E%3Cpath d='M8 11V22H13' fill='none' stroke='%23e3b341' stroke-width='2'/%3E%3Cpath d='M15 22H24' stroke='%23e6e8ee' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: light)" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='7' fill='%23f3f4f7' stroke='%2323262f'/%3E%3Cpath d='M5 11H27M5 22H27' stroke='%239aa0ad' stroke-width='1.5'/%3E%3Cpath d='M8 11V22H13' fill='none' stroke='%238a6400' stroke-width='2'/%3E%3Cpath d='M15 22H24' stroke='%2323262f' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: dark)" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='7' fill='%2314161b' stroke='%235d6474'/%3E%3Cpath d='M5 11H27M5 22H27' stroke='%235d6474' stroke-width='1.5'/%3E%3Cpath d='M8 11V22H13' fill='none' stroke='%23e3b341' stroke-width='2'/%3E%3Cpath d='M15 22H24' stroke='%23e6e8ee' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/ui/stage.css">
<script type="module" src="/assets/ui/app.js"></script>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false"><defs>
<symbol id="g-woodwind" overflow="visible" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M1.5 8C3.6 4.3 12.4 4.3 14.5 8 12.4 11.7 3.6 11.7 1.5 8z"/><circle cx="8" cy="8" r="2"/></symbol>
<symbol id="g-strings" overflow="visible" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M2.5 13.5l.9-3.4L10.8 2.7l2.5 2.5-7.4 7.4zM9.3 4.2l2.5 2.5"/></symbol>
<symbol id="g-percussion" overflow="visible" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M4.5 6l2.5 2-2.5 2M8.5 10.5h3"/></symbol>
<symbol id="g-brass" overflow="visible" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="M10.6 10.6L14.5 14.5M4.8 7.1l1.6 1.6 2.9-3"/></symbol>
<symbol id="g-unknown" overflow="visible" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="5.5"/><path d="M4.2 11.8l7.6-7.6"/></symbol>
<symbol id="arrow" overflow="visible" fill="currentColor"><path d="M1 0L-6-4V4z"/></symbol>
</defs></svg>

<header id="bar" class="bar">
  <div class="brand">
    <span class="mark">Stage</span>
    <label class="lane"><span class="sr" data-t="bar.lane"></span><select id="lane" data-slot="lane"></select></label>
    <span class="approx" data-slot="approx" data-hide="1" data-t="bar.approx"></span>
  </div>
  <p class="stats"><span data-slot="players"></span><span data-slot="items"></span></p>
  <p class="meta"><span data-slot="sources"></span><span class="fresh" data-slot="fresh"></span></p>
  <p class="badges"><span class="badge test" data-slot="test" data-hide="1"></span><span class="badge" data-t="bar.preview"></span><button id="theme" class="ghost" type="button" data-act="theme"></button><a class="ghost home" href="/" data-t="link.home"></a></p>
</header>
<nav class="tabs"><button id="tab-stage" type="button" data-act="stage" aria-pressed="true" data-t="tab.stage"></button><button id="tab-plan" type="button" data-act="plan" aria-pressed="false" data-t="tab.plan"></button></nav>
<p id="alert" class="alert" role="alert" aria-live="assertive" data-hide="1"></p>
<p id="live" class="sr" aria-live="polite"></p>

<main class="split">
<section id="stage" class="pane score-pane" aria-labelledby="stage-h">
<h2 id="stage-h" class="pane-h"><span data-t="tab.stage"></span><span class="pane-sub" data-t="score.sub"></span></h2>
<div class="you">
<span class="you-name" data-t="you.name"></span>
<div class="waits" data-slot="waits"></div>
<span class="you-note" data-slot="podium"></span>
</div>
<div class="systems" data-slot="systems"></div>
<p class="nolanes" data-slot="nolanes" data-hide="1"></p>
<article class="system sys-codex" data-lineage="codex">
<h3 class="sys-h"><span class="sys-name" data-t="harness.codex"></span></h3>
<p class="sys-line" data-t="grp.codex"></p>
<div class="codex-staff" aria-hidden="true"></div>
</article>
<ul class="legend">
<li><svg viewBox="0 0 26 14" aria-hidden="true"><line class="lg-ph" x1="4" y1="7" x2="22" y2="7"/></svg><span data-t="legend.phrase"></span></li>
<li><svg viewBox="0 0 26 14" aria-hidden="true"><path class="lg-ar" d="M13 0V9"/><use class="lg-ah" href="#arrow" transform="translate(13 13) rotate(90)"/></svg><span data-t="legend.slur"></span></li>
<li><svg viewBox="0 0 26 14" aria-hidden="true"><path class="lg-ar lg-up" d="M13 14V5"/><use class="lg-ah lg-up" href="#arrow" transform="translate(13 1) rotate(-90) scale(1.2)"/></svg><span data-t="legend.tie"></span></li>
<li><svg viewBox="0 0 26 14" aria-hidden="true"><line class="lg-ph lg-orphan" x1="3" y1="7" x2="23" y2="7"/></svg><span data-t="legend.orphan"></span></li>
<li><svg viewBox="0 0 26 14" aria-hidden="true"><line class="lg-ph lg-stub" x1="5" y1="7" x2="15" y2="7"/></svg><span data-t="legend.stub"></span></li>
<li><svg viewBox="0 0 26 14" aria-hidden="true"><rect class="lg-badge" x="1" y="2" width="24" height="10" rx="3"/></svg><span data-t="legend.ferm"></span></li>
<li class="legend-h" data-t="legend.title"></li>
<li data-instr="woodwind"><svg viewBox="0 0 16 16" aria-hidden="true"><g class="ins"></g></svg><span data-t="instr.woodwind"></span></li>
<li data-instr="strings"><svg viewBox="0 0 16 16" aria-hidden="true"><g class="ins"></g></svg><span data-t="instr.strings"></span></li>
<li data-instr="percussion"><svg viewBox="0 0 16 16" aria-hidden="true"><g class="ins"></g></svg><span data-t="instr.percussion"></span></li>
<li data-instr="brass"><svg viewBox="0 0 16 16" aria-hidden="true"><g class="ins"></g></svg><span data-t="instr.brass"></span></li>
<li data-instr="unknown"><svg viewBox="0 0 16 16" aria-hidden="true"><g class="ins"></g></svg><span data-t="instr.unknown"></span></li>
</ul>
</section>

<section id="plan" class="pane plan-pane" aria-labelledby="plan-h">
  <h2 id="plan-h" class="pane-h"><span data-t="tab.plan"></span></h2>
  <p class="health" data-slot="health" data-hide="1"></p>
  <div class="desks" data-slot="desk"></div>
  <p id="chips-l" class="sr" data-t="chip.label"></p>
  <div class="chips" role="group" aria-labelledby="chips-l" data-slot="chips"></div>
  <p class="total" data-slot="total" data-hide="1"></p>
  <div class="cols" aria-hidden="true"><span data-t="col.brief"></span><span data-t="col.exec"></span><span data-t="col.report"></span><span data-t="col.verdict"></span></div>
  <ol class="rows" data-slot="list"></ol>
  <p class="empty" data-slot="empty" data-hide="1"></p>
  <p class="clipped" data-slot="clipped" data-hide="1"></p>
  <details class="rules"><summary data-t="rules.title"></summary><ul data-slot="rules"></ul></details>
</section>
</main>

<dialog id="drawer" class="drawer" aria-labelledby="dr-title">
  <header class="dr-head">
    <svg class="mini" viewBox="0 0 16 16" aria-hidden="true" data-slot="head"><g class="ins"></g></svg>
    <div class="dr-id"><h2 id="dr-title" data-slot="title"></h2><p class="sub" data-slot="sub"></p></div>
    <button type="button" class="ghost" data-act="close" data-t="dr.close"></button>
  </header>
  <dl class="facts" data-slot="facts"></dl>
  <section class="dr-sec" data-slot="briefBox" data-hide="1"><h3 data-t="dr.brief"></h3><p class="brief-text" data-slot="brief"></p><p class="crit"><span class="chip-crit" data-t="plan.crit"></span><span class="note" data-t="plan.critNote"></span></p></section>
  <section class="dr-sec" data-slot="standBox" data-hide="1"><h3 data-slot="standHead"></h3><ul class="todo" data-slot="stand"></ul></section>
  <section class="dr-sec"><h3 data-t="dr.events"></h3><p class="note" data-slot="evNote"></p><ol class="events" data-slot="events"></ol></section>
  <p class="dr-foot"><button type="button" class="ghost" data-act="peek" data-slot="peek" data-t="dr.peek"></button></p>
</dialog>

<template id="tpl-opt"><option></option></template>
<template id="tpl-glyph"><svg><g><use class="g-woodwind" href="#g-woodwind"/><use class="g-strings" href="#g-strings"/><use class="g-percussion" href="#g-percussion"/><use class="g-brass" href="#g-brass"/><use class="g-unknown" href="#g-unknown"/></g></svg></template>
<template id="tpl-wait"><button type="button" class="wait"><span data-slot="t"></span></button></template>
<template id="tpl-system"><article class="system">
<h3 class="sys-h"><span class="sys-name" data-slot="sysName"></span><span class="sys-form" data-slot="sysForm"></span></h3>
<p class="sys-line" data-slot="sysLine"></p>
<div class="sys-body">
<svg class="heads" preserveAspectRatio="xMinYMin slice" data-slot="hsvg"><path class="brace" d="M6 0H3V1H6" data-slot="brace"/><text class="ord-l" x="16" y="17" data-t="score.order"></text><g data-slot="heads"></g></svg>
<div class="sys-scroll"><svg class="music" data-slot="msvg"><g data-slot="ords"></g><g data-slot="staves"></g><g data-slot="phrases"></g><g data-slot="ferms"></g></svg></div>
</div>
</article></template>
<template id="tpl-shead"><svg><g class="shead" tabindex="0" role="button">
<title data-slot="title"></title>
<rect class="hit" width="1" height="1" data-slot="hit"/>
<path class="h-dept" d="M1 0H0V1H1" data-slot="dept"/>
<line class="h-line" data-slot="hline"/>
<g class="ins" data-slot="ins"></g>
<text class="h-name" data-slot="name"></text>
<text class="h-tag" data-slot="tag"></text>
</g></svg></template>
<template id="tpl-uhead"><svg><text class="uhead"></text></svg></template>
<template id="tpl-staff"><svg><g class="staff"><line class="st-line" data-slot="line"/><text class="st-note" data-slot="note"></text></g></svg></template>
<template id="tpl-ord"><svg><text class="ord"></text></svg></template>
<template id="tpl-phrase"><svg><g class="phrase" tabindex="0" role="button">
<title data-slot="title"></title>
<rect class="hit" width="1" height="1" data-slot="hit"/>
<path class="slur" d="M0 0V1H1" data-slot="slur"/>
<use class="ah" href="#arrow" data-slot="sah"/>
<text class="sl-lab" data-slot="slab" data-t="ph.sent"></text>
<circle class="dot" r="3" data-slot="dot"/>
<path class="tie" d="M0 1H1V0" data-slot="tie"/>
<use class="ah tah" href="#arrow" data-slot="tah"/>
<line class="ph-tail" data-slot="tail"/>
<line class="ph" data-slot="body"/>
<line class="ph-in" data-slot="inner"/>
<text class="ph-st" data-slot="st"></text>
<text class="ph-cap" data-slot="cap"></text>
</g></svg></template>
<template id="tpl-ferm"><svg><g class="ferm" tabindex="0" role="button"><title data-slot="title"></title><rect class="badge-bg" y="-10" width="1" height="20" rx="4" data-slot="bg"/><text class="badge-t" x="8" y="4" data-slot="t"></text></g></svg></template>
<template id="tpl-desk"><article class="desk">
<svg class="mini" viewBox="0 0 16 16" aria-hidden="true"><g class="ins"></g></svg>
<div class="desk-body"><h3><button type="button" class="open" data-slot="name"></button></h3><p class="who" data-slot="who"></p><p class="goal" data-slot="goal"></p><p class="todo-head" data-slot="todoHead"></p><ul class="todo" data-slot="todo"></ul><p class="note" data-slot="note"></p></div>
</article></template>
<template id="tpl-todo"><li class="todo-i"><span class="g" data-slot="g" aria-hidden="true"></span><span class="t" data-slot="t"></span><span class="st" data-slot="st"></span></li></template>
<template id="tpl-chip"><button type="button" class="chip"></button></template>
<template id="tpl-row"><li class="row">
<div class="c c-brief"><span class="lab" data-t="col.brief"></span><button type="button" class="open" data-slot="brief"></button><span class="tags"><span class="tag" data-slot="src"></span><span class="dept" data-slot="dept"></span><span class="deep" data-slot="deep" data-t="plan.deep"></span></span><span class="crit"><span class="chip-crit" data-t="plan.crit"></span><span class="note" data-t="plan.critNote"></span></span></div>
<div class="c c-exec"><span class="lab" data-t="col.exec"></span><svg class="mini" viewBox="0 0 16 16" aria-hidden="true"><g class="ins"></g></svg><span class="ex"><span class="ex-name" data-slot="exName"></span><span class="ex-instr" data-slot="exInstr"></span><span class="ex-live" data-slot="exLive"></span></span></div>
<div class="c c-report"><span class="lab" data-t="col.report"></span><span class="rep" data-slot="report"></span><span class="funnel" aria-hidden="true"><i class="f-in"></i><i class="f-out"></i></span><span class="flow" data-slot="flowText"></span></div>
<div class="c c-verdict"><span class="lab" data-t="col.verdict"></span><span class="verdict" data-slot="verdict"></span></div>
</li></template>
<template id="tpl-head"><li class="head"><span class="head-t" data-slot="t"></span><span class="note" data-slot="note"></span></li></template>
<template id="tpl-rule"><li class="rule"><code data-slot="id"></code><span class="rule-n" data-slot="n"></span><span class="rule-h" data-slot="hits"></span></li></template>
<template id="tpl-kv"><div class="kv"><dt data-slot="k"></dt><dd data-slot="v"></dd></div></template>
<template id="tpl-ev"><li class="ev"><span class="ev-at" data-slot="at"></span><span class="ev-ty" data-slot="ty"></span><span class="ev-tx" data-slot="tx"></span></li></template>
</body>
</html>
